description_en: >
  On 29 October 2021 the Toronto Transit Commission (TTC), the municipal
  transit authority of the City of Toronto and Canada's largest urban
  transit operator, was hit by a ransomware attack. TTC IT staff
  detected unusual network activity on the evening of Thursday
  28 October 2021; impact remained minimal until around midday on
  Friday 29 October, when the attackers broadened their strike across
  TTC network servers. The incident took down the "Vision" radio/data
  system used by Transit Control to communicate with vehicle operators
  (streetcar, bus and subway drivers fell back to analog radio), the
  Wheel-Trans online booking portal for the paratransit service, the
  Next Vehicle real-time arrival information displayed on station
  platform screens and in trip-planning apps, the public TTC website,
  and the TTC's internal email service. Public transport continued to
  run; the TTC stated the incident did not cause significant service
  disruptions, although it had to cancel a planned Line 1 Yonge-
  University weekend closure (St Clair–College, 30 Oct) and a Line 2
  Bloor-Danforth late-opening (31 Oct) because the outages prevented
  normal service changeovers. The TTC disclosed on 26 November 2021
  that the attackers had exfiltrated the personal information — names,
  home addresses and Canadian Social Insurance Numbers — of
  approximately 25,000 current and former employees, retirees and
  pensioners, and that a small sample of TTC files had been briefly
  posted on a dark-web leak site. According to the subsequent public
  reporting and the Toronto Auditor General's two-phase cybersecurity
  audit (Phase 1 tabled 14 April 2022; Phase 2 tabled 22 November
  2023), the initial access vector was a spear-phishing email sent to
  a TTC employee from the compromised email account of a trusted
  third-party organisation, containing a malicious link the employee
  clicked, and the TTC had additionally failed to apply a publicly-
  available security patch within the 72-hour window required by its
  own internal patching policy. No ransomware family and no threat
  actor publicly claimed responsibility; the TTC has not disclosed
  whether a ransom was demanded or paid.
description_de: >
  Am 29. Oktober 2021 wurde die Toronto Transit Commission (TTC), der
  städtische Verkehrsbetrieb der Stadt Toronto und Kanadas größter
  städtischer Nahverkehrsanbieter, Opfer eines Ransomware-Angriffs.
  Die IT-Abteilung der TTC bemerkte bereits am Abend des Donnerstag,
  28. Oktober 2021, ungewöhnliche Netzwerkaktivität; die Auswirkungen
  blieben zunächst minimal, bis die Angreifer am Freitagmittag,
  29. Oktober, ihren Angriff auf die TTC-Netzwerkserver deutlich
  ausweiteten. Betroffen waren insbesondere das „Vision"-System
  (Daten- und Sprachkommunikation der Leitstelle Transit Control mit
  Fahrzeugpersonal — Busse, Straßenbahnen und U-Bahnen wichen auf
  analogen Funk aus), das Online-Buchungsportal des Wheel-Trans-
  Paratransportdienstes, die dynamische Fahrgastinformation („Next
  Vehicle") auf Bahnsteig-Anzeigetafeln und in Apps, die
  TTC-Website sowie der interne E-Mail-Dienst. Der öffentliche
  Verkehr lief weiter; die TTC teilte mit, es habe keine nennenswerten
  Betriebsstörungen gegeben, allerdings mussten eine geplante
  Wochenend-Streckensperrung der Linie 1 Yonge-University
  (St Clair–College, 30. Okt.) und ein verspäteter Betriebsbeginn
  der Linie 2 Bloor-Danforth (31. Okt.) abgesagt werden, weil die
  Ausfälle den regulären Betriebswechsel unmöglich machten. Am
  26. November 2021 bestätigte die TTC, dass die Angreifer
  personenbezogene Daten — Namen, Wohnadressen und kanadische
  Sozialversicherungsnummern — von bis zu 25.000 aktuellen und
  ehemaligen Beschäftigten, Rentnerinnen und Rentnern entwendet
  hatten und dass kurzzeitig ein kleinerer Datenauszug auf einer
  Leak-Seite im Darknet erschienen sei. Laut nachfolgenden
  Berichten und dem zweiteiligen Cybersicherheits-Audit des Toronto
  Auditor General (Phase 1 vorgelegt am 14. April 2022, Phase 2
  am 22. November 2023) erfolgte der Erstzugriff über eine Spear-
  Phishing-E-Mail, die ein Angreifer aus dem kompromittierten
  E-Mail-Konto einer vertrauenswürdigen Drittorganisation an eine
  TTC-Beschäftigte versandte und die einen schädlichen Link
  enthielt, auf den geklickt wurde; zusätzlich hatte die TTC einen
  öffentlich verfügbaren Sicherheits-Patch nicht innerhalb der
  eigenen 72-Stunden-Frist ausgerollt. Keine Ransomware-Familie
  und keine Tätergruppe hat die Verantwortung öffentlich
  übernommen; ob Lösegeld gefordert oder gezahlt wurde, hat die
  TTC nicht mitgeteilt.
