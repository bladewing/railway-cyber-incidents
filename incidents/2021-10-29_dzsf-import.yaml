notes: >
  Identification: the DZSF raw-data row (CA, 2021-10-29, confirmation
  status confirmed, affected systems = internal_communication +
  train_driver_communication + passenger_information + website)
  unambiguously maps to the 29 October 2021 ransomware attack on the
  Toronto Transit Commission publicly disclosed that evening and
  widely reported from 29 October 2021 onwards. The four DZSF
  affected-systems tags match the TTC's own disclosure: internal email
  (internal_communication), the Vision vehicle-operator communication
  system (train_driver_communication), the Next Vehicle real-time
  arrival displays / trip-planning apps / platform screens
  (passenger_information) and the TTC public website (website). No
  other 2021-10-29 Canadian railway cyber incident is publicly
  attested; the only other comparable Canadian transit ransomware
  cases from the same period are the Société de transport de Montréal
  (STM) attack of 19 October 2020 (RansomEXX) and the Metro Vancouver
  / TransLink attack of 1 December 2020 (Egregor). Neither matches
  the DZSF date or country entry-city combination.

  Not a duplicate of 2021-10-24_badrabbit: that escalated record
  concerns a purported Ukrainian (UA) BadRabbit railway incident and
  has no Canadian dimension. The date proximity (five days) is
  coincidental.

  Date handling: event_date kept at 2021-10-29 — the day the
  attackers escalated their strike from initial intrusion to
  network-wide impact (explicit in The Record, CBC, Global News,
  CTV News, Daily Hive, MobileSyrup: "midday today (Friday,
  Oct. 29) when hackers broadened their strike on network
  servers"). Initial unusual-activity detection on Thursday evening
  (28 October 2021) is documented; the earlier calendar date
  (Thursday night) is noted in the narrative but not used as
  event_date because the operational impact and public disclosure
  both fall on Friday 29 October. reported_date set to 2021-10-29
  because that is the day the incident became publicly known and
  was confirmed by TTC spokesperson Stuart Green to journalists
  (CTV News Toronto 29 Oct 2021 20:21 EDT; Global News 29 Oct
  2021 20:33 EDT). The actual initial intrusion preceding the
  detected "unusual network activity" is not publicly pinpointed
  but is believed to be shortly before Thursday 28 October 2021.

  target_organization: Toronto Transit Commission (TTC). Wikipedia
  and the TTC's own materials characterise it as an agency of the
  City of Toronto — a municipal public transit authority, with a
  board of ten members (six Toronto City Council members + four
  citizens), the mayor appointing the chair. Operator_type therefore
  coded `public_authority` (municipal transit authority), not
  `incumbent` (which is reserved for national mainline incumbents
  such as DB / SNCF / SBB / VIA Rail) and not `private` (TTC is a
  public-sector agency, not a private operator).

  industry_sector: `urban_transit`. TTC runs four rapid-transit
  subway lines (Lines 1 Yonge-University, 2 Bloor-Danforth,
  3 Scarborough RT — closed 2023, 4 Sheppard), plus LRT / streetcar
  lines and the city bus network; it is described by Wikipedia as
  "the most heavily used urban transit system in Canada". This
  record covers the TTC as a whole, not a specific mode — consistent
  with the DZSF's lack of mode disaggregation.

  attack_vector: `phishing`. Multiple independent sources — the
  McMillan LLP post-incident legal analysis ("Lessons Learned from
  the TTC's Ransomware Attack"), republished via Lexology, the
  Toronto Auditor General Phase 1 and Phase 2 audit summaries,
  and Canadian Underwriter's incident write-up — state that "a
  threat actor sent an email to a TTC employee from the email
  address of a trusted third party, whose systems the threat actor
  had compromised. The employee clicked a malicious link in the
  email, allowing the threat actor to infiltrate the TTC's systems."
  This is textbook spear-phishing via a compromised-trusted-third-
  party lure (MITRE T1566.002 Spearphishing Link combined with
  T1199 Trusted Relationship for the upstream third-party
  compromise). `phishing` is the best-fitting vocabulary value. A
  secondary contributing factor flagged by the Auditor General and
  McMillan is a failure to apply an available public security
  patch within the TTC's own 72-hour critical-patch policy window,
  but that is a compensating-control gap rather than the primary
  entry vector.

  supply_chain: false. The compromise of a third-party email
  account was used only as a phishing lure — it was not a
  software-supply-chain compromise of a vendor product updating
  TTC systems (which is what the `supply_chain` flag captures in
  this dataset — cf. SolarWinds, Kaseya). The trusted-third-party
  phishing is captured via the `phishing` attack vector and the
  T1199 MITRE tag.

  malware: null. No ransomware family has been publicly identified.
  McMillan, the Auditor General Phase 1 and Phase 2 reports, and
  contemporary reporting (CBC, Global News, The Record, TechCrunch)
  all characterise this as "a ransomware attack" without naming a
  specific family; The Driz Group quoted TTC communications head
  Shabnum Durrani stating she could not identify "what ransomware
  strain attacked TTC". No ransomware gang publicly claimed the
  attack on a leak site. Consistent with the repo's "prefer null
  over invention" rule, the malware list is kept null rather than
  speculating (for instance, some contemporary commentary suggested
  parallels with the STM/Montreal RansomEXX attack, but no
  public attribution ties TTC to RansomEXX).

  extortion: true (explicit — the TTC confirmed this was a
  ransomware attack; the FAQ-style coverage describes "the TTC did
  not disclose the ransom demand it received" and a small sample
  of files was briefly posted to a dark-web leak site).
  motive: `financial` (standard ransomware monetisation pattern).
  data_published: true — CBC News (26 Nov 2021) and subsequent
  coverage confirms that "a small sample of TTC files may have
  been briefly posted on the dark web", satisfying the dataset's
  data_published definition even though the full trove was not
  published.

  threat_actor / threat_actor_country / attribution_confidence: no
  public attribution exists. The Driz Group and DataBreaches.net
  both explicitly note that no group claimed responsibility and
  that the specific strain remains unidentified. threat_actor is
  therefore kept null, threat_actor_country kept null,
  attribution_confidence set to `unknown` (rather than `reported`).

  mitre_attack_techniques: four high-confidence techniques are
  asserted. T1566.002 (Spearphishing Link) because the initial-
  access email contained a malicious link that the TTC employee
  clicked (explicit in McMillan and Canadian Underwriter). T1199
  (Trusted Relationship) because the email was sent from the
  compromised mailbox of a "trusted third party" whose systems
  the attackers had already breached (explicit in McMillan,
  Lexology and Canadian Underwriter; see the MITRE T1199 write-
  up on compromised-third-party-access vectors). T1486 (Data
  Encrypted for Impact) because "a number of the TTC's servers
  being encrypted and locked" is a canonical ransomware behaviour
  confirmed by Global News / Daily Hive / MobileSyrup and the
  Auditor General. T1657 (Financial Theft) for the extortion
  component. Additional plausible techniques (T1078 Valid
  Accounts for any onward use of stolen credentials; T1567 Data
  Transfer to Cloud for the data exfiltration behind the leak-
  site posting) are deliberately not asserted — no Merseyrail-
  style public forensic breakdown pins them to this intrusion,
  and the draft conforms to the repo's "prefer null over
  invention" rule.

  affected_systems: kept as DZSF-imported (internal_communication,
  train_driver_communication, passenger_information, website).
  All four are corroborated by independent reporting: internal
  email (internal_communication — The Record, Global News, CBC,
  MobileSyrup, Daily Hive, IT World Canada); Vision system used
  by Transit Control to communicate with vehicle operators
  (train_driver_communication — Daily Hive, Global News, The
  Record explicitly identify Vision as the operator-
  communication channel; MobileSyrup clarifies the system covers
  streetcar, bus and subway operators alike); Next Vehicle real-
  time arrival information on platform screens, in trip-planning
  apps and on the TTC website (passenger_information — CTV News,
  Global News, Daily Hive, MobileSyrup); TTC public website
  (website — Daily Hive, MobileSyrup). Not added: `payment_system`
  (no reporting indicates the PRESTO fare-card system or any
  TTC ticketing was impaired — PRESTO is operated by Metrolinx,
  not TTC), `data` (although 25,000 employee records were
  exfiltrated, the repo's `data` system code refers to
  administrative/corporate data systems as an operational target,
  and the data_compromise.organizational_data = true flag already
  captures the exfiltration; double-coding would overstate),
  `rail_operations` (subway signalling / CBTC / interlocking were
  explicitly unaffected — public transport continued to run).

  impact.scope: `regional`. TTC serves the City of Toronto
  (~2.8 million residents) and adjacent Greater Toronto Area; it
  does not operate the national rail network. `regional` is
  consistent with how the dataset treats other single-city
  transit operators (STM Montreal, Metro Vancouver, SEPTA).
  duration_hours: left null. Partial restoration was underway by
  1 November 2021 (MobileSyrup: Wheel-Trans restored), but full
  restoration of all affected systems (particularly internal
  email) is not pinpointed in a single canonical source; The
  Driz Group / IT World Canada indicate several systems remained
  down into early November, while the Auditor General Phase 1
  report (14 Apr 2022) was published five months later, implying
  full operational recovery occurred in the interim but does not
  quantify downtime.
  affected_trains / affected_passengers: null — public transit
  continued to run; the DZSF dataset does not track "affected
  customers relying on passenger information apps" as a
  quantified metric.
  monetary_damage_eur: null — no public figure. No ransom
  amount disclosed; no public recovery-cost breakdown in the
  Auditor General report (the confidential recommendations
  would have included cost detail, but were redacted).
  data_compromise.organizational_data: true (25,000 employee
  records — names, home addresses, Canadian Social Insurance
  Numbers — explicit in CBC News 26 Nov 2021, Global News,
  Canadian Underwriter, TechCrunch). customer_data: false —
  CBC News and HostedPCI note that "client data compromise could
  not be confirmed at the time of reporting" and subsequent
  reporting (through 2024 CTV News follow-up) does not identify
  any TTC customer-data compromise. intellectual_property: false
  (no IP/design/trade-secret theft reported).

  confirmation_status: `confirmed`. The TTC itself confirmed the
  attack via spokesperson Stuart Green on 29 October 2021 (CBC,
  CTV News, Global News); the Office of the Auditor General,
  City of Toronto, independently confirmed the attack in the
  TTC Cybersecurity Audit Phase 1 (April 2022) and Phase 2
  (November 2023) public reports. This meets the highest tier
  of confirmation.

  German-language press coverage was not located (heise.de,
  Golem.de, Tagesschau, Süddeutsche searches returned no TTC
  2021 article). The DZSF entry remains the sole German-language
  primary anchor; noted as a coverage gap rather than a
  substantive discrepancy.

  needs_review flipped from true to false: more than two
  independent non-DZSF sources corroborate the core facts (date,
  country, target organisation, systems affected, ransomware
  nature, employee-data theft, phishing vector), and 15+
  fields were moved off null / defaults — the threshold for
  promotion to a fully reviewed record is comfortably met.
