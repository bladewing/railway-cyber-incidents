description_en: >
  On 18 January 2024, NMBS/SNCB - the national passenger railway
  operator of Belgium - was targeted by a distributed denial-of-service
  attack that disrupted public-facing communication channels and
  website services. Rail operations and train movements were not
  affected by the incident. No threat actor was publicly identified;
  the attack pattern is consistent with pro-Russian hacktivist DDoS
  campaigns active against European transport operators during this
  period.
