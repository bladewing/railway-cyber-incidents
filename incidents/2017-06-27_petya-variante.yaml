notes: >
  Incident originally imported from the DZSF raw-data spreadsheet as
  "Petya-Variante"; filename stem retained for ID stability. The attack is
  universally identified as NotPetya (a.k.a. ExPetr, Diskcoder.C, Nyetya),
  a Sandworm/GRU wiper masquerading as Petya ransomware. MITRE technique
  list is the full S0368 mapping (Enterprise); not every technique is
  necessarily relevant to the railway-specific kill chain, but all are
  attested for the malware. extortion=false reflects the consensus that
  the ransom note was a cover and decryption was never possible.
  description_de uses the German transliteration "Ukrsalisnyzja".
