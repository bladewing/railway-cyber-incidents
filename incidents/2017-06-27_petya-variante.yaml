description_en: On 27 June 2017 Ukrzaliznytsia, the Ukrainian state railway operator,
  was among the critical-infrastructure entities disabled by the NotPetya wiper,
  which spread via a trojanised update of the M.E.Doc Ukrainian tax-accounting
  software. The malware, disguised as Petya-family ransomware, irreversibly
  encrypted Windows hosts and forced the railway to issue paper tickets and
  process payments manually while ticketing, corporate IT and station systems
  were unavailable; the UK, US and allied governments later attributed the
  operation to Russia's GRU Unit 74455 (Sandworm).
description_de: Am 27. Juni 2017 gehörte die ukrainische Staatsbahn Ukrsalisnyzja
  (Укрзалізниця) zu den kritischen Infrastrukturbetreibern, die durch den
  NotPetya-Wiper lahmgelegt wurden. Der als Petya-Ransomware getarnte Schädling
  verbreitete sich über ein kompromittiertes Update der ukrainischen
  Steuersoftware M.E.Doc, zerstörte Windows-Systeme unwiderruflich und zwang
  die Bahn, Fahrkarten manuell auszustellen und Zahlungen per Hand zu
  bearbeiten. Britische, US-amerikanische und weitere Regierungen schrieben
  den Angriff später der russischen GRU-Einheit 74455 (Sandworm) zu.
