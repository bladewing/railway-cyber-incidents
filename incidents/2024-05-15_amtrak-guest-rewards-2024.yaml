description_en: >
  Between 15 and 18 May 2024, unidentified threat actors gained access
  to an unspecified number of Amtrak Guest Rewards loyalty accounts by
  credential stuffing — replaying username/password combinations
  obtained from unrelated third-party breaches and info-stealer logs.
  Amtrak's own authentication and rewards-programme back-end was not
  compromised; the attackers abused valid customer credentials to log
  in, change the registered e-mail address on hijacked accounts and
  access profile data (names, contact details, dates of birth, Guest
  Rewards account numbers, partial credit-card numbers with expiry
  dates, gift-card balances, trip and transaction history). Amtrak
  detected the activity, force-reset affected accounts on 18 May,
  enabled multi-factor authentication (email or SMS OTP) for Guest
  Rewards on 20 May, and sent breach-notification letters on 14 June
  2024 under state breach laws (initial notification filed with the
  Massachusetts Attorney General). Amtrak offered 12 months of
  Experian IdentityWorks credit-monitoring at no cost to affected
  customers. This is the second disclosed Guest Rewards credential
  incident, following the 2020 case catalogued as
  `2020-04-16_dzsf-import`.
description_de: >
  Zwischen dem 15. und 18. Mai 2024 verschafften sich nicht
  identifizierte Angreifer Zugang zu einer unbekannten Zahl von Amtrak
  Guest Rewards-Konten mittels Credential Stuffing — also durch das
  Wiedereinspielen von Nutzername-Passwort-Paaren aus Drittbreaches
  und Infostealer-Logs. Amtraks eigene Authentifizierungs- und Treue-
  programm-Backends wurden nicht kompromittiert; die Angreifer
  missbrauchten gültige Kundenzugangsdaten, änderten bei übernommenen
  Konten die hinterlegte E-Mail-Adresse und griffen auf Profildaten
  (Name, Kontakt, Geburtsdatum, Guest-Rewards-Kontonummer, Teilangaben
  der Kreditkarte mit Ablaufdatum, Gutscheinbalancen, Reise- und
  Transaktionshistorie) zu. Amtrak erkannte die Aktivität, setzte
  betroffene Konten am 18. Mai zurück, aktivierte MFA (E-Mail- oder
  SMS-OTP) am 20. Mai und verschickte am 14. Juni 2024 Benachrichtigungen
  nach US-Bundesstaaten-Datenschutzrecht (erste Meldung an die
  Generalstaatsanwaltschaft von Massachusetts). Amtrak bot zwölf Monate
  kostenlose Kreditüberwachung über Experian IdentityWorks an. Es ist
  der zweite offengelegte Guest-Rewards-Credential-Vorfall nach dem
  2020er Fall `2020-04-16_dzsf-import`.

