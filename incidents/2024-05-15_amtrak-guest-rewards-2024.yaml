notes: >
  Second Amtrak Guest Rewards credential-abuse incident; 2020 predecessor
  catalogued as 2020-04-16_dzsf-import. attack_vector=credential_theft
  per the Amtrak notification letter, which explicitly rules out any
  breach of Amtrak's own systems and attributes compromise to reused
  passwords. MITRE T1110.004 (Credential Stuffing) is the precise
  technique. extortion=false, motive=financial: typical
  loyalty-programme account-takeover fraud (gift-card liquidation,
  rewards-points cash-out, resale of account access). duration_hours≈72
  reflects the 15–18 May intrusion window before Amtrak's forced
  password reset. Total affected-account count is not in the public
  notification; Massachusetts alone received 134 notification letters
  under the 2024-1160 filing number. Dataset now carries two Amtrak
  records — see also the May 2024 → June 2024 timeline for
  ShinyHunters / Salesforce claims (separately reported April 2026, not
  catalogued yet due to insufficient corroboration as of 2026-04-23).
