notes: >
  Identification: the DZSF raw-data row DZSF-2020-23-S-1202 (event
  2020-05-07, CH, confirmed, affected_systems=[data], extortion=true,
  malware "Nefilim") maps unambiguously onto Stadler Rail AG's
  publicly disclosed Nefilim-ransomware attack. Stadler issued an
  official German- and English-language media release dated
  7 May 2020 (URLs preserved above) that fixes both event_date and
  reported_date to that day; Swiss mainstream (NZZ, 20 Minuten,
  Tages-Anzeiger, Luzerner Zeitung, Watson, inside-it.ch,
  computerworld.ch, Netzwoche, SwissCybersecurity.net) and
  international technical press (BleepingComputer, Security Affairs,
  DataBreaches.net, IRJ, Railway Age, Railway Gazette, Railway
  Technology, Global Railway Review, RailTech, Railway-News, Cyble)
  corroborate the same facts across languages.

  Malware attribution: Nefilim is reported as the specific ransomware
  strain by Cyble, Railway-News/IL7 Security, Netzwoche,
  SwissCybersecurity.net, computerworld.ch and Luzerner Zeitung;
  Stadler's own statements refer only to "malware". Family set to a
  descriptive free-text string since Nefilim is itself the family
  label (Nemty-descendant) and the schema malware.family field is a
  free-text string. mitre_software_id left null: as of 2026-04, MITRE
  ATT&CK has no dedicated Nefilim software entry (S-ID); attempts to
  resolve S0619 returned 404, and the software index does not list
  Nefilim. Malpedia catalogues it as win.nefilim.

  attack_vector retained as `unknown`. Although Trend Micro,
  SentinelLabs, Qualys and BankInfoSecurity generically describe
  Nefilim initial access as Citrix ADC/Gateway exploitation
  (CVE-2019-19781) and/or abused RDP, none of the Stadler-specific
  sources (neither Stadler's own release nor any Swiss or railway
  publication) confirm which vector was used against Stadler in
  particular. Per the enrichment hard rule "prefer null over
  invention", the generic family-level vector is not retrofitted onto
  this incident.

  supply_chain kept `false` (no third-party software compromise
  reported). extortion `true` (explicit — 6 M USD Bitcoin demand,
  threat of and subsequent publication of stolen data). motive
  `financial` (classic double-extortion ransomware). data_published
  `true` (first tranche on 2020-05-29 via @ransomleaks Twitter,
  followed by "Part 2" around 2020-06-02/03 per Cyble, Netzwoche,
  IRJ, Railway Age).

  affected_systems: `data` (document exfiltration) plus
  `internal_communication` (Stadler's own release and
  Global Railway Review describe the entire corporate IT network as
  compromised and some machines as infected, then rebooted from
  backup; no operational train/signalling systems were reported
  affected). `rail_operations` deliberately excluded — production
  continued per Stadler's statement.

  industry_sector `rolling_stock_manufacturer` (Stadler is the
  canonical Swiss OEM for passenger rolling stock: FLIRT, KISS, GTW,
  Smile/Giruno, TRAMLINK etc.). operator_type `private` — Stadler
  Rail AG is a privately controlled company; majority shareholder
  Peter Spuhler, listed on SIX since April 2019.

  threat_actor: "Nefilim ransomware operators" (the operator group;
  some researchers later linked the Nefilim operation to the intrusion
  set "Water Roc" per Trend Micro 2021, but this linkage postdates
  the Stadler incident). threat_actor_country left null (no
  attested nation-state attribution). attribution_confidence
  `reported` — the Nefilim identification is widely attested by
  multiple independent researchers/press but not formally confirmed
  by Stadler itself, which used generic "malware" language.

  MITRE ATT&CK techniques: T1486 (Data Encrypted for Impact —
  Nefilim's encryption payload is the defining behaviour; encryption
  was attempted/partially executed before backups were used) and
  T1567.002 (Exfiltration to Cloud Storage — the ~4 GB / 10 000 docs
  were staged externally and later published via Twitter/Mega
  links). Broader Nefilim tradecraft (T1190 Exploit Public-Facing
  Application against Citrix, T1078 Valid Accounts, T1021.001 RDP,
  T1562 Impair Defenses) is not retrofitted because Stadler-specific
  confirmation is absent.

  impact.scope `international`: Stadler is a transnational group with
  production sites in Switzerland, Germany, Poland, Spain, Hungary,
  Austria, the US, Belarus and Algeria among others, and Stadler's
  own release confirms the attack affected both Swiss and foreign
  locations. impact.duration_hours left null (no numeric outage
  figure disclosed; Stadler says production continued). magnitude
  sub-fields all null — no customer-facing train or passenger count
  is the right unit for a rolling-stock manufacturer, and no
  monetary-damage figure was disclosed. data_compromise.
  intellectual_property true (construction-project documents,
  engineering-adjacent material included per Luzerner Zeitung /
  IRJ), organizational_data true (financial statements, budgets,
  bank contracts, tax rulings, KPMG audit material),
  customer_data left null (not explicitly confirmed either way;
  the leaked material was primarily corporate/financial rather
  than passenger-facing).

  coordinates: Bussnang TG headquarters (47.5628 N, 9.0028 E).

  confirmation_status `confirmed` retained: attested by Stadler's own
  media release plus ≥20 independent secondary sources.

  needs_review flipped true → false. ≥2-independent-non-DZSF
  threshold massively exceeded (≥27 non-DZSF sources including
  Stadler's own release and dual-language Swiss mainstream).
