description_en: >
  On 7 May 2020 the Swiss rolling-stock manufacturer Stadler Rail AG
  (headquartered in Bussnang, Canton Thurgau) disclosed that its
  internal monitoring service had detected a malware-based intrusion
  into the company's IT network affecting locations in Switzerland and
  abroad. Attackers exfiltrated data and demanded a ransom of
  approximately USD 6 million (≈ CHF 5.8 million) in Bitcoin,
  threatening to publish stolen documents if the payment was refused.
  Security researchers and industry press (Bleeping Computer, Security
  Affairs, computerworld.ch, Netzwoche, inside-it.ch, Cyble) identified
  the ransomware strain as Nefilim — a double-extortion ransomware
  family first observed in March 2020 and widely reported to be a
  successor to / fork of Nemty, typically deployed after initial
  access via exposed or unpatched Citrix ADC/Gateway (CVE-2019-19781)
  or abused RDP. Stadler publicly refused to negotiate or pay, filed a
  criminal complaint with the Thurgau public prosecutor, engaged
  external cybersecurity experts, restored from backups and notified
  the data protection authorities in every country in which the
  company operates. After the refusal, the Nefilim operators released
  a first tranche of stolen material on 29 May 2020 and a second
  tranche on 2 June 2020 via an anonymous Twitter account
  ("@ransomleaks"); the attackers claimed roughly 10 000 documents
  totalling ~4 GB, including financial statements, budgets, loan and
  bank contracts (incl. a UBS syndicated loan agreement), tax-relief
  rulings with the canton of Thurgau, KPMG audit documents and plans
  relating to construction projects in Altenrhein. Stadler reported
  that train production and service operations continued uninterrupted
  through the incident and the COVID-19 pandemic.
description_de: >
  Am 7. Mai 2020 gab der Schweizer Schienenfahrzeughersteller Stadler
  Rail AG (Hauptsitz Bussnang TG) bekannt, dass der interne
  IT-Sicherheitsdienst einen Schadsoftware-Angriff auf das
  unternehmensweite IT-Netzwerk festgestellt hatte; betroffen waren
  Standorte in der Schweiz und im Ausland. Die Angreifer exfiltrierten
  Daten und forderten rund 6 Mio. US-Dollar (≈ 5,8 Mio. CHF) in Bitcoin,
  verbunden mit der Drohung, die erbeuteten Dokumente zu
  veröffentlichen. Sicherheitsforscher und Fachpresse (Bleeping
  Computer, Security Affairs, computerworld.ch, Netzwoche, inside-it.ch,
  Cyble) identifizierten die eingesetzte Schadsoftware als Nefilim —
  eine im März 2020 erstmals beobachtete „Double-Extortion"-Ransomware,
  die als Nachfolger bzw. Fork von Nemty gilt und typischerweise nach
  einem Erstzugriff über ungepatchte Citrix-ADC/Gateway-Installationen
  (CVE-2019-19781) bzw. missbrauchte RDP-Zugänge ausgerollt wird.
  Stadler verweigerte öffentlich jede Zahlung und jede Verhandlung,
  erstattete Strafanzeige bei der Thurgauer Staatsanwaltschaft, zog
  externe Cybersicherheitsspezialisten bei, spielte aus Backups zurück
  und informierte die Datenschutzbehörden in allen Ländern, in denen
  der Konzern tätig ist. Nach der Zahlungsverweigerung
  veröffentlichten die Nefilim-Betreiber am 29. Mai 2020 einen ersten
  und am 2. Juni 2020 einen zweiten Datensatz über den anonymen
  Twitter-Account „@ransomleaks"; die Angreifer gaben rund 10 000
  Dokumente mit insgesamt ~4 GB an — darunter Jahresabschlüsse,
  Budgets, Kredit- und Bankverträge (u. a. ein UBS-Konsortialkredit),
  Steuerabkommen mit dem Kanton Thurgau, KPMG-Auditunterlagen sowie
  Bauunterlagen zum Standort Altenrhein. Die Zugfertigung und der
  Service liefen laut Stadler trotz Cyberangriff und Corona-Pandemie
  ununterbrochen weiter.
