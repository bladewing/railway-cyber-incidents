description_en: >
  On Friday 19 March 2021 the Czech state railway infrastructure manager
  Správa železnic (SŽ, formerly SŽDC) and the incumbent national
  passenger rail operator České dráhy (ČD) detected and repelled a
  cyber-intrusion attempt against their office / e-mail IT networks.
  The attack formed part of a wider wave of intrusions against Czech
  public-sector organisations — Prague City Hall, the Ministry of
  Labour and Social Affairs (MPSV), a medical facility of the Ministry
  of the Interior — exploiting the same Microsoft Exchange Server
  zero-day vulnerabilities (ProxyLogon, CVE-2021-26855 / -26857 /
  -26858 / -27065) that Microsoft had patched on 2 March 2021 and
  which the Národní úřad pro kybernetickou a informační bezpečnost
  (NÚKIB) had urgently ordered regulated entities to mitigate. Both
  railway organisations informed NÚKIB immediately; Správa železnic
  spokesperson Dušan Gavenda and Czech Railways CEO Ivan Bednárik
  publicly confirmed that neither train operations nor railway-safety
  systems were compromised. No data exfiltration, ransomware payload,
  extortion demand or operational disruption was reported. Neither
  organisation named the initial-access vector publicly, but Czech
  press (iRozhlas, Lupa, Deník, Týden, Aktuálně) and NÚKIB's
  contemporaneous context place the incident inside the HAFNIUM /
  ProxyLogon Exchange exploitation campaign that Microsoft Threat
  Intelligence attributed with high confidence to a Chinese
  state-sponsored group (espionage motive).
description_de: >
  Am Freitag, dem 19. März 2021, entdeckten und wehrten der
  tschechische staatliche Eisenbahninfrastrukturbetreiber Správa
  železnic (SŽ, vormals SŽDC) und die tschechische Staatsbahn České
  dráhy (ČD) einen Cyber-Angriff auf ihre Büro- und E-Mail-IT-Netze
  ab. Der Vorfall reihte sich in eine breitere Angriffswelle auf
  tschechische öffentliche Einrichtungen — das Prager Magistrat, das
  Ministerium für Arbeit und Soziales (MPSV) und eine medizinische
  Einrichtung des Innenministeriums — ein, die dieselben
  Microsoft-Exchange-Zero-Day-Schwachstellen (ProxyLogon,
  CVE-2021-26855 / -26857 / -26858 / -27065) ausnutzte, die Microsoft
  am 2. März 2021 gepatcht und vor denen das tschechische Nationale
  Amt für Cyber- und Informationssicherheit (NÚKIB) dringend gewarnt
  hatte. Beide Bahnorganisationen informierten NÚKIB sofort; der
  Sprecher von Správa železnic, Dušan Gavenda, sowie der Generaldirektor
  der ČD, Ivan Bednárik, bestätigten öffentlich, dass weder der
  Zugbetrieb noch die sicherheitsrelevanten Signal-/Stellwerkssysteme
  betroffen gewesen seien. Es wurden keine Datenabflüsse,
  Ransomware-Nutzlasten, Erpressungsforderungen oder operativen
  Störungen gemeldet. Die betroffenen Organisationen nannten den
  initialen Zugriffsvektor nicht öffentlich; die tschechische
  Fachpresse (iRozhlas, Lupa, Deník, Týden, Aktuálně) und der
  zeitliche Zusammenhang ordnen den Vorfall jedoch der
  HAFNIUM-/ProxyLogon-Exchange-Ausnutzungskampagne zu, die Microsoft
  Threat Intelligence mit hoher Zuversicht einer chinesischen
  staatlich gesponserten Gruppe zuschreibt (Motiv: Spionage).
