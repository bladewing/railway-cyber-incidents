notes: >
  Identification. The DZSF raw-data row (event 2021-03-19, country CZ,
  confirmation_status=confirmed, affected_systems=[unclear_system],
  all other core fields null/unknown) maps unambiguously onto the
  simultaneous cyber-intrusion attempt disclosed by Správa železnic
  and České dráhy on 22 March 2021 but dated by both organisations to
  "od pátku 19. března" — Friday 19 March 2021 — via their respective
  spokespersons. No other CZ railway cyber incident is publicly
  documented for this date; the next CZ railway cyber event in the
  public record is the April 2022 pro-Russian Killnet DDoS wave
  against the cd.cz website and the "Můj vlak" mobile app, which is a
  distinct event and is not conflated here.

  Dates. event_date = 2021-03-19 is the date both organisations gave
  as the onset of the cyber-threat (SŽ spokesperson Dušan Gavenda;
  ČD spokespeople / CEO Ivan Bednárik). reported_date = 2021-03-22,
  the Monday on which the matter first became public via the Czech
  news cluster (Aktuálně, iRozhlas, Deník, Deník N, Lupa, Týden,
  RAILTARGET — all dated 22 March 2021, with OSŽ union follow-up on
  23 March).

  Attack vector. attack_vector = `exploit` and
  mitre_attack_techniques = [T1190] ("Exploit Public-Facing
  Application"). Neither organisation named the initial-access
  technique publicly, but multiple Czech publishers (Aktuálně,
  iRozhlas, Lupa, Týden) frame the railway incident alongside the
  parallel Microsoft Exchange Server zero-day (ProxyLogon,
  CVE-2021-26855) intrusions at Prague City Hall, MPSV and the
  Interior-Ministry medical facility; NÚKIB had on the preceding
  days ordered all regulated entities to patch Exchange. Aktuálně
  notes explicitly that it was not yet confirmed whether the railway
  attack exploited the same Exchange vulnerability, so this is
  circumstantial — recorded as `suspected` / `espionage` rather than
  `confirmed`. MITRE ATT&CK documents T1190 as the canonical
  technique for ProxyLogon initial access (HAFNIUM G0125 /
  Silk Typhoon).

  Attribution. threat_actor = null because neither the affected
  organisations nor NÚKIB nor any Czech press source publicly named
  a specific actor. threat_actor_country = null for the same reason.
  attribution_confidence = `suspected`: the broader ProxyLogon
  campaign was attributed by Microsoft with high confidence to the
  Chinese state-sponsored group HAFNIUM (Silk Typhoon), but the
  specific railway victim attribution was never publicly confirmed.
  motive = `espionage`: consistent with HAFNIUM's modus operandi
  (intelligence collection via mailbox access) rather than
  financial gain or disruption, and no ransom demand or leak was
  observed. Left `suspected` not `confirmed` because the link
  between the railway intrusion and HAFNIUM specifically is
  circumstantial.

  Affected systems. `internal_communication` and `data` are the two
  systems most directly implicated: the exploited surface is
  Microsoft Exchange (corporate e-mail = internal communication)
  and the stolen-mail risk, even if not realised, is an
  administrative/corporate-data risk. Both railway organisations
  explicitly and repeatedly stated that rail-operations, signalling
  and safety-critical systems were not affected (Gavenda, Bednárik,
  and the explicit NÚKIB statement "není ohrožena či snížena
  bezpečnost dopravy"). affected_systems therefore does NOT include
  `rail_operations`, `internal_train_tracking`, `station_it`,
  `train_driver_communication`, `passenger_information`,
  `payment_system` or `website`. The DZSF placeholder
  `unclear_system` has been replaced with the two more specific
  values justified above.

  Impact. scope = `national` because Správa železnic manages the
  entire 9,400-km state rail network and České dráhy is the national
  incumbent passenger operator; the exposure was therefore
  nation-wide even though no rail-service disruption materialised.
  duration_hours = null — the attack was repelled quickly but no
  public source gave a numeric figure. affected_trains = 0 (all
  Czech sources explicitly state train operations were not
  disrupted). customer_data = false (no customer-data breach was
  reported; the Exchange vector exposes mailbox contents rather
  than rider data). intellectual_property = false. organizational_data
  is left null because, while no exfiltration was reported, the
  ProxyLogon vector typically targets mailbox contents and neither
  SŽ nor ČD published a definitive post-incident forensic report
  ruling out silent compromise of administrative e-mail.
  data_published = false — no leak-site listing of SŽ or ČD has
  appeared.

  Organisational typing. Správa železnic is a Czech státní
  organizace (state organisation) acting as the national railway
  infrastructure manager for ~9,400 km of track, 6,700 bridges,
  2,500 stations, 166 tunnels (Wikipedia: Správa železnic; SŽ
  annual report 2021). České dráhy is the Czech state-owned
  incumbent passenger rail operator. industry_sector =
  `infrastructure_manager` (mapped to the headline target SŽ which
  is the infrastructure manager rather than a train operating
  company); operator_type = `incumbent` (SŽ and ČD are together
  the Czech state-owned legacy rail group, analogous to DB Netz +
  DB Fernverkehr).

  Confirmation. confirmation_status = `confirmed` (unchanged):
  affected organisations themselves confirmed the incident via
  official statements to multiple media outlets (Gavenda for SŽ;
  Bednárik and unnamed ČD spokespeople for ČD) on 22 March 2021,
  and NÚKIB confirmed it was handling the case.

  German-press coverage. German-language trade press
  (heise.de, Golem.de, Eurailpress / EI, Tagesschau, DSGVO-Portal
  Sicherheitsvorfalls-Datenbank) has no dedicated item on the
  2021-03-19 Správa železnic / České dráhy incident; only the DZSF
  Rohdaten row itself anchors the case in the German-language
  academic record. The DZSF 2023 summary article "Cyberangriffe auf
  das Bahnsystem — Was bisher geschah" (EI 8/2023) mentions the
  wider CZ railway cyber-threat picture only as aggregate statistics,
  not with per-incident attribution.

  No CERT / CERT-Bund / US-CERT / CISA advisory was issued
  specifically for the railway incident; the contemporaneous CISA
  emergency directive AA21-062A and the Czech NÚKIB advisory on
  Microsoft Exchange Server vulnerabilities are the governing
  primary-sector guidance but name neither SŽ nor ČD individually.
