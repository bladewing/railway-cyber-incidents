description_en: >
  On 21 March 2025, Regionale Verkehrsbetriebe Baden-Wettingen (RVBW)
  AG, a cantonal public-transport operator serving the Baden and
  Wettingen region in Aargau, Switzerland, detected suspicious activity
  in its IT infrastructure. RVBW immediately isolated affected
  computers and disconnected network connections, but attackers
  nonetheless succeeded in encrypting a portion of company data. The
  operator publicly disclosed the incident in early April 2025. RVBW
  stated that customer and subscription data were not affected and
  that bus services continued on their normal schedule throughout the
  incident. The attackers demanded a ransom and threatened to publish
  stolen company data on the darknet; RVBW did not comply with the
  demand. The Play (also known as PlayCrypt) ransomware group claimed
  responsibility via its darknet leak site. RVBW coordinated with the
  Swiss federal criminal police during the response. The same group
  had previously conducted high-profile ransomware operations against
  Swiss targets, including the 2023 breach of the hosting provider
  Xplain.
