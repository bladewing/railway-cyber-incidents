notes: >
  RVBW's own corporate IT was the direct target; this was not a
  supply-chain incident and is unrelated to the roughly contemporaneous
  MyCicero/MooneyGo supply-chain compromise of late March 2025 in Italy
  (separate entry). The exact initial access vector was not disclosed.
  Impact on rail-adjacent operations (RVBW primarily operates bus
  services in the Baden/Wettingen region, with some tram integration
  via neighbouring operators) was nil; only internal IT and data were
  affected. RVBW AG is majority-owned by Canton Aargau and participating
  municipalities, classified here as a public_authority operator even
  though structurally an Aktiengesellschaft. Attribution to Play is
  based on the group listing RVBW on its darknet leak site and on
  Swiss press reporting; no independent CERT or vendor confirmation is
  cited in the English-language record. This entry was manually
  completed from the discovery-pipeline stub; the original stub
  correctly identified the victim and ransomware nature but had most
  structured fields null.
