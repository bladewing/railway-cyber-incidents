description_en: >
  In August 2023, the Akira ransomware group listed The Belt Railway
  Company of Chicago on its darknet leak site, claiming to have
  exfiltrated approximately 85 GB of data from the operator's
  networks. Belt Railway, the largest switching and terminal railroad
  in the United States, operates around 28 miles of track and
  interchanges freight traffic between seven Class I railroads in the
  Chicago area. The company publicly confirmed awareness of the claim,
  stated that it was investigating the allegations in cooperation
  with federal authorities and an external cybersecurity firm, and
  emphasised that rail operations had not been impacted. Whether a
  ransom was paid is not publicly known.
