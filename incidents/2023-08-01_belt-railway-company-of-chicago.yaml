notes: >
  Akira emerged in March 2023 and by mid-2023 had compromised dozens of
  organisations across multiple sectors, typically using double-extortion
  tactics (encryption + data-leak threat). Belt Railway is identified
  as a victim in the FBI's 2024 Akira joint advisory. event_date uses
  month precision because the exact breach/exfiltration date is not
  public; Akira's leak-site post appeared around 10 August 2023.
