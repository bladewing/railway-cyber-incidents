description_en: >
  On the evening of Sunday 13 May 2018 and into the early hours of Monday
  14 May 2018, Denmark's incumbent national railway operator DSB (Danske
  Statsbaner) was hit by a distributed denial-of-service (DDoS) attack
  that flooded its public-facing systems with traffic from multiple
  external sources. Ticket sales via the DSB app, the DSB website, the
  automated ticket-vending machines at stations and the 7-Eleven kiosks
  inside Danish railway stations were all knocked offline, and internal
  email, telephony and SMS systems used by DSB staff were also disrupted
  so that the company could communicate with passengers only through
  social media. Passengers holding a Rejsekort contactless travel card
  could still board and travel as normal, and those without a card were
  allowed to purchase a ticket on the train from the conductor; bus and
  train operations themselves, and the signalling / safety systems,
  were not affected. DSB's IT team, together with external contractors,
  restored service by around 03:30 on the night into Monday 14 May, and
  DSB deputy director Aske Wieth-Knudsen told Danish media the incident
  was confirmed as an external attack aimed at bringing the system down;
  no ransom was demanded, no data theft was reported, and Thomas
  Lund-Sorensen of the Centre for Cyber Security (Centre for
  Cybersikkerhed, under the Danish Defence Intelligence Service)
  characterised the technique as a commodity booter-style DDoS of the
  kind that can be rented online cheaply.
description_de: >
  Am Abend des Sonntags 13. Mai 2018 und bis in die fruehen Morgenstunden
  des Montags 14. Mai 2018 wurde die daenische staatliche
  Eisenbahngesellschaft DSB (Danske Statsbaner) Ziel eines Distributed-
  Denial-of-Service-Angriffs (DDoS), bei dem oeffentlich erreichbare
  Systeme mit Anfragen aus vielen externen Quellen ueberflutet wurden.
  Der Ticketverkauf ueber die DSB-App, die DSB-Website, die
  Fahrkartenautomaten in den Bahnhoefen und die 7-Eleven-Kioske in den
  daenischen Bahnhoefen fiel vollstaendig aus; auch interne E-Mail-,
  Telefon- und SMS-Systeme der DSB-Mitarbeiter waren gestoert, sodass
  das Unternehmen mit Fahrgaesten nur noch ueber soziale Medien
  kommunizieren konnte. Reisende mit Rejsekort-Karte konnten weiterhin
  fahren, Fahrgaeste ohne Karte durften ihr Ticket beim Zugbegleiter
  kaufen; Zug- und Busbetrieb sowie die Leit- und Sicherungstechnik
  waren nicht betroffen. Das IT-Team von DSB stellte den Betrieb
  zusammen mit externen Dienstleistern gegen 03:30 Uhr am Montag wieder
  her. DSB-Vizedirektor Aske Wieth-Knudsen bestaetigte gegenueber
  daenischen Medien einen externen Angriff mit dem Ziel, das System
  lahmzulegen; Loesegeldforderungen oder Datenabfluss wurden nicht
  gemeldet. Thomas Lund-Sorensen vom Center for Cybersikkerhed
  (Zentrum fuer Cybersicherheit, Teil des daenischen militaerischen
  Nachrichtendienstes) stufte die Technik als handelsuebliche, im
  Internet guenstig mietbare Booter-DDoS-Attacke ein.
