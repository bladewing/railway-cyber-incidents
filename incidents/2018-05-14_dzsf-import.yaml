notes: >
  The DZSF raw-data row dated 2018-05-14 (DK, confirmation=confirmed,
  affected_systems spanning ticketing/website/staff communications,
  extortion=false, motive=unknown) is a clear match for the DDoS attack
  against DSB (Danske Statsbaner) that ran from the evening of Sunday
  13 May 2018 into the early hours of Monday 14 May 2018, widely
  reported in Danish (DR, TV 2, Version2, Folketidende/Ritzau) and
  international English/German press (The Local Denmark, The Copenhagen
  Post, Infosecurity Magazine, Security Affairs, HackRead, GBHackers,
  Latest Hacking News, LOK Report). No other Danish railway cyber
  incident on that date is publicly documented, so the DZSF stub is
  resolved to DSB. event_date kept as 2018-05-14 (the DZSF record's
  date) because the attack spanned the 13/14 May night and DSB's public
  announcement as well as the bulk of media coverage fell on 14 May;
  event_date_precision is `day` and description_en makes the two-day
  chronology explicit. industry_sector is `long_distance_passenger`
  because DSB is Denmark's incumbent long-distance and regional
  passenger operator (IC, IC Lyn, regional services); DSB also runs the
  Copenhagen S-tog urban S-Bahn, but the disruption affected the whole
  DSB ticketing estate rather than the S-tog urban service specifically,
  so `long_distance_passenger` best represents the victim. operator_type
  is `incumbent` (DSB is the Danish state-owned incumbent operator).
  attack_vector is `unknown`: the attack was clearly a volumetric DDoS,
  but the schema's `attack_vector` enumerates the initial-access class
  (exploit, phishing, credential_theft, ...), none of which map to an
  external DDoS delivered via commodity booter traffic; per the
  codebook we default to `unknown`. motive is `disruption`: DSB and
  Danish media explicitly described the goal as taking systems down,
  no ransom was demanded, and Centre for Cyber Security head Thomas
  Lund-Sorensen classed the attack as a cheap rent-a-DDoS, so
  `financial` and `state_geopolitical` are not supported by public
  evidence. extortion is false (no ransom or payment demand was made
  or reported). `supply_chain` is false. `malware` is null (a DDoS
  flood does not require attacker-side malware on DSB systems; any
  botnet / booter on the attacker side is not publicly characterised
  and would not be recorded under the victim's `malware` field).
  `mitre_attack_techniques` is kept null: although the incident is a
  textbook fit for T1498 (Network Denial of Service), no CERT, vendor
  or academic source formally maps this particular incident into the
  ATT&CK framework, so per the codebook we do not commit the mapping.
  `threat_actor`, `threat_actor_country` and `attribution_confidence`
  are null/unknown: no individual, group or state has ever been
  publicly identified for this attack. Reports in 2025 of Russian
  state-sponsored DDoS campaigns (NoName057(16)) against European
  rail operators refer to separate incidents against Deutsche Bahn and
  are not, on public evidence, connected to the 2018 DSB case.
  `affected_systems` expanded relative to the DZSF stub: the DZSF row
  listed `train_driver_communication`, but no source supports an
  impact on GSM-R / safety radio — Danish media and DSB's own
  statements are explicit that train operations and the safety-critical
  driver-dispatcher channel were NOT affected; the disrupted "internal
  communication" was DSB's corporate mail, telephony and SMS to staff
  (DR, TV 2, Version2, Infosecurity Magazine, Security Affairs). We
  therefore drop `train_driver_communication` and retain `website`,
  `payment_system` (ticket app, website sales, TVMs, 7-Eleven kiosks)
  and `internal_communication` (corporate mail/phone/SMS). `impact.
  scope` is `national`: the DSB ticketing estate covers all of Denmark
  and national media treated it as a country-wide disruption. `impact.
  magnitude.affected_trains` is 0 per DSB: no train movements were
  cancelled or delayed due to the attack; passengers boarded on
  Rejsekort or bought on-board from conductors. `affected_passengers`
  is null: Infosecurity Magazine cited "around 15,000 customers"
  affected but this figure was reported only once and not corroborated
  by Danish primary reporting, so per the "null over invention" rule
  we leave the field null. `monetary_damage_eur` is null (no public
  cost estimate). `data_compromise.customer_data`, `.organizational_
  data` and `.intellectual_property` are all false: DSB and Danish
  media are consistent that this was a pure availability attack with
  no exfiltration, no encryption and no defacement. `impact.duration_
  hours` is null: the outage ran from Sunday evening to roughly 03:30
  early Monday but no single-integer-hour duration is authoritatively
  reported, so per the codebook we leave it null. `reported_date` set
  to 2018-05-14 (the day DSB went public and the day of the bulk of
  Danish and international coverage, including the earliest dated DR,
  TV 2, Version2, Local Denmark, Copenhagen Post and LOK Report
  stories).
