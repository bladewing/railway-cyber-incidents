description_en: >
  Between 29 and 30 March 2025, unknown attackers breached the
  infrastructure of Pluservice S.r.l., an Italian IT service provider
  that operates the MyCicero and MooneyGo digital-ticketing and
  mobility-payment platforms on behalf of Mooney Servizi S.p.A.
  (formerly MyCicero S.r.l.). The compromise was detected on 1 April
  2025 when the hosting cloud provider WIIT S.p.A. observed anomalous
  behaviour in the hosted infrastructure and recommended Pluservice
  isolate and suspend the MyCicero service. Forensic analysis confirmed
  data exfiltration from databases hosted at WIIT data-centre
  facilities; WIIT stated that its cloud infrastructure itself was not
  directly compromised. The incident exposed personal data of
  customers across a large number of Italian public-transit, regional
  bus, and mobility operators that rely on the MyCicero/MooneyGo
  platform for ticketing and payments. Individual operators
  subsequently issued GDPR Art. 34 data-breach notifications to their
  customers. No ransomware component was publicly reported; the
  incident has been characterised as data theft. Rail operations,
  signalling, and onboard systems were not affected — the impact was
  limited to customer-facing ticketing and payment surfaces.
