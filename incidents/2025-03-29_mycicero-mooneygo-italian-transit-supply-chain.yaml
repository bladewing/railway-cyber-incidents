notes: >
  Consolidated entry merging nine per-victim stubs produced by the
  discovery pipeline on 2026-04-19, all describing the same
  supply-chain compromise of the MyCicero / MooneyGo ticketing and
  mobility-payment platform operated by Pluservice S.r.l. (a
  sub-contractor of Mooney Servizi S.p.A., formerly MyCicero S.r.l.;
  infrastructure hosted by WIIT S.p.A.). The dataset follows its
  existing shared-campaign precedent (e.g. 2017-05-13_wannacry,
  2017-06-27_petya-variante) of representing a single root cause with
  many downstream victims as one entry.
  Known victim operators (non-exhaustive, alphabetised):
    - Air Campania
    - Arriva Italia (Milan)
    - ASPO (Olbia)
    - ATMA (Ancona)
    - ATV (Verona)
    - Azienda Trasporti Milanesi (ATM Milano)
    - Busitalia Veneto
    - FNM Autoservizi S.p.A.
    - Kyma Mobilità S.p.A. (Taranto)
    - Mobilità di Marca (MOM, Treviso)
    - TPL FVG (Friuli-Venezia Giulia)
    - TUA S.p.A. (Abruzzo)
    - UnicoCampania
  Additional victims beyond this list are likely, as BeyondMachines
  reports the incident affected "multiple regional transport companies
  that rely on the MyCicero and MooneyGo platforms". The affected data
  categories were personal customer data (names, contact details,
  possibly payment metadata depending on the operator); scope varies
  per victim and is detailed in each operator's individual GDPR Art. 34
  notice. No threat actor has been publicly attributed as of the
  accessed_date. The original nine per-victim drafts
  (2025-03-29_kyma-mobilit-s-p-a, 2025-03-29_mobilit-di-marca,
  2025-03-29_my-cicero, 2025-03-29_tua-spa, 2025-03-30_arriva-italia,
  2025-03-30_atma-soc-cons-per-azioni,
  2025-03-30_azienda-trasporti-milanesi-atm,
  2025-03-30_fnm-autoservizi-s-p-a, 2025-03-30_tpl-fvg) have been
  removed from incidents/drafts/ in favour of this consolidated entry.
