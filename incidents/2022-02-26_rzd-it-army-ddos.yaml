description_en: >
  Shortly after the start of the Russian invasion of Ukraine on 24 February
  2022 and the 26 February 2022 formal founding of the IT Army of Ukraine
  by Ukraine's Minister of Digital Transformation Mykhailo Fedorov, the
  volunteer hacktivist collective published Russian Railways (РЖД / RZD)
  on its Telegram target list. During the following days the public
  website (rzd.ru) and mobile booking app were rendered intermittently
  unavailable by sustained distributed denial-of-service (DDoS) traffic,
  preventing Russian passengers from purchasing or refunding tickets
  online. RZD responded by opening additional staffed ticket counters at
  major stations; rail operations (dispatching, signalling) were not
  affected. The IT Army explicitly framed the attacks as economic pressure
  on "the aggressor state", stating that even one hour of downtime would
  damage the Russian economy.
description_de: >
  Unmittelbar nach Beginn des russischen Angriffs auf die Ukraine
  am 24. Februar 2022 und der formellen Gründung der IT Army of Ukraine
  durch den ukrainischen Minister für digitale Transformation Mychajlo
  Fedorow am 26. Februar 2022 setzte das Freiwilligenkollektiv die
  Russischen Eisenbahnen (РЖД / RZD) auf ihre Telegram-Zielliste. In
  den folgenden Tagen waren die öffentliche Website (rzd.ru) sowie die
  Buchungs-App wiederholt nicht erreichbar; russische Reisende konnten
  weder Tickets kaufen noch stornieren. RZD öffnete zusätzliche Schalter
  an großen Bahnhöfen; der Bahnbetrieb selbst blieb unberührt. Die IT
  Army bezeichnete die Angriffe offen als wirtschaftliche Druckmittel
  gegen den Aggressorstaat.

