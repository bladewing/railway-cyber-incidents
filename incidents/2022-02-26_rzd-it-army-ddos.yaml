notes: >
  Dated 2022-02-26 with month-level precision. The IT Army of Ukraine
  was formally announced by Minister Mykhailo Fedorov on 26 February
  2022, and RZD was one of the earliest targets listed on its Telegram
  channel; multiple outlets (Cybernews, Cybersecurity Insiders, the
  EPRS timeline) report the rzd.ru website and mobile app being
  intermittently unreachable in the days immediately following.
  The exact onset day of the RZD campaign is not independently
  pinpointed in open sources, so month-precision is used.
  industry_sector=other (RZD combines freight + long-distance + regional
  passenger segments). extortion=false: no ransom demand; politically
  motivated disruption. attack_vector=unknown: DDoS does not map cleanly
  to the existing vocabulary (exploit/phishing/supply_chain/insider/
  physical/credential_theft); MITRE T1498 (Network Denial of Service)
  captured under mitre_attack_techniques. This is the first documented
  wartime cyberattack on RZD; subsequent incidents in 2023-07-05,
  2025-03, and 2025-04 are separately catalogued.
