description_en: >
  On 7 May 2024, the Washington Metropolitan Area Transit Authority
  (WMATA), the operator of the Washington, DC Metro rail and bus
  system, experienced a distributed denial-of-service attack that
  rendered its public website inaccessible for approximately two
  hours. Rail and bus operations were not affected; passenger-facing
  information on platforms and onboard trains continued normally. No
  threat actor claimed responsibility publicly.
