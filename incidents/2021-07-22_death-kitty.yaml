description_en: >
  On 22 July 2021 Transnet SOC Ltd — the South African state-owned
  freight-rail, port and pipeline operator — was hit by a ransomware
  attack that encrypted systems across the group and forced a switch
  to manual, paper-based operation at its four container-handling
  ports (Durban, Ngqura, Port Elizabeth/Gqeberha and Cape Town) as
  well as degraded availability of corporate IT (the transnet.net
  website went offline during the incident). On 27 July 2021 Transnet
  Port Terminals chief executive Velile Dube formally declared force
  majeure, characterising the event as "an act of cyber-attack,
  security intrusion and sabotage". Media reporting by Bloomberg
  (29 July 2021), citing CrowdStrike Vice President of Intelligence
  Adam Meyers, linked the intrusion to the ransomware strain tracked
  variously as "Death Kitty", "HelloKitty" and "Five Hands", and
  assessed likely origins in Eastern Europe or Russia; Meyers noted
  the operators kept a closed-group / private-service profile with
  no observed recruitment or affiliate-style advertising. The
  attackers left a ransom note claiming to have encrypted
  approximately one terabyte of personal data, financial reports
  and other documents, directing Transnet to a dark-web chat portal
  for negotiation. Public Enterprises Minister Pravin Gordhan later
  told parliament (17 August 2021) that no ransom had been paid,
  that approximately 90 % of IT systems had been restored, and
  that the Department of Public Enterprises found none of
  Transnet's client data had been compromised. Operationally,
  Transnet Freight Rail, Transnet Pipelines and Transnet
  Engineering activated business-continuity plans and, per
  Transnet's own statement, kept freight-rail services running
  to schedule on manual/paper processes; the Natcor rail corridor
  had already been under a separate unrest-related force majeure
  earlier in July 2021. The core container management system
  (Navis N4) was fully restored by 30 July 2021, and TPT lifted
  the cyber-related force majeure on 2 August 2021. The attack
  is considered the first severe disruption to the operational
  integrity of South Africa's critical maritime infrastructure
  and is cited as a case study in the 2023 AJIC academic analysis
  (Timcke, Gaffley, Rens), the TechPolicy.Press policy review
  (2024) and the ISS Africa brief (Reva, 29 July 2021). No
  specific initial-access vector has been disclosed publicly;
  the academic literature and vendor reporting attribute HelloKitty
  intrusions generally to phishing, compromised credentials or
  exploitation of unpatched internet-facing vulnerabilities
  (including SonicWall CVE-2021-20016 in other campaigns), but
  neither Transnet nor its investigators have tied the 22 July
  2021 entry point to a specific technique.
description_de: >
  Am 22. Juli 2021 wurde die südafrikanische Staatsholding
  Transnet SOC Ltd — Betreiber des Güterbahn-, Hafen- und
  Pipelinenetzes Südafrikas — Ziel eines Ransomware-Angriffs,
  der konzernweit IT-Systeme verschlüsselte und an den vier
  Container-Häfen Durban, Ngqura, Port Elizabeth/Gqeberha und
  Kapstadt eine Umstellung auf manuellen, papierbasierten
  Betrieb erzwang; die öffentliche Website transnet.net war
  während des Vorfalls nicht erreichbar. Am 27. Juli 2021
  erklärte Velile Dube, CEO der Hafentochter Transnet Port
  Terminals, förmlich force majeure und bezeichnete den
  Vorfall als „Akt des Cyber-Angriffs, Sicherheitsbruchs und
  Sabotage". Laut Bloomberg-Bericht vom 29. Juli 2021 ordnete
  CrowdStrike-Intelligence-VP Adam Meyers die Verschlüsselung
  der als „Death Kitty" / „HelloKitty" / „Five Hands"
  bekannten Ransomware-Familie zu und verortete die Urheber
  mit hoher Wahrscheinlichkeit in Osteuropa oder Russland;
  Meyers beschrieb die Betreiber als geschlossene Gruppe bzw.
  privaten Dienst ohne beobachtete Affiliate-Rekrutierung.
  Die Erpresser hinterließen eine Lösegeldforderung über eine
  Darknet-Verhandlungsseite und behaupteten, rund ein Terabyte
  an personenbezogenen Daten, Finanzberichten und sonstigen
  Unterlagen verschlüsselt zu haben. Öffentliche-Unternehmen-
  Minister Pravin Gordhan erklärte am 17. August 2021 vor dem
  Parlament, dass kein Lösegeld gezahlt, etwa 90 % der
  IT-Systeme wiederhergestellt und keine Kundendaten
  kompromittiert worden seien. Die Divisionen Transnet
  Freight Rail, Transnet Pipelines und Transnet Engineering
  aktivierten Business-Continuity-Pläne und führten laut
  eigener Angaben den Schienengüterverkehr manuell nach
  Fahrplan weiter; das Kern-Container-Betriebssystem Navis N4
  wurde bis 30. Juli 2021 wiederhergestellt, die
  cyberbedingte force majeure am 2. August 2021 aufgehoben.
  Der Vorfall gilt als erster schwerer Angriff auf die
  operative Integrität der kritischen maritimen Infrastruktur
  Südafrikas und wird als Fallstudie u. a. in der AJIC-Studie
  von Timcke/Gaffley/Rens (2023), in der TechPolicy.Press-
  Analyse (2024) sowie im ISS-Africa-Brief (Reva, 29. Juli
  2021) aufgearbeitet. Ein konkreter Erstzugriffs-Vektor ist
  nicht öffentlich dokumentiert; HelloKitty wird in Herstel-
  lerreports allgemein mit Phishing, Kompromittierung
  privilegierter Zugangsdaten bzw. Exploit-Ausnutzung
  (u. a. SonicWall CVE-2021-20016 in anderen Kampagnen) in
  Verbindung gebracht, ohne dass Transnet oder Ermittelnde
  dies auf den 22.-Juli-Einbruch bezogen hätten.
