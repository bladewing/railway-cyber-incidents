notes: >
  Identification: the DZSF row (ZA, 2021-07-22, malware "Death
  Kitty", affected_systems [website, rail_operations]) maps
  unambiguously to the Transnet SOC Ltd ransomware attack of
  22 July 2021 — the only publicly documented July 2021 South-
  African railway cyber-incident, confirmed by Wikipedia's
  "Transnet ransomware attack" article and by multiple first-
  hand news accounts (TechCentral 27/29 July; Daily Maverick
  27 July; Maritime Executive 27 July; Bloomberg 29 July;
  ITWeb 17 August). "Death Kitty" is the colloquial moniker
  used by CrowdStrike / Bloomberg for what MITRE tracks as
  HELLOKITTY (S0617) and some vendors also call "Five Hands";
  the three names refer to the same ransomware family lineage
  (HelloKitty / DeathRansom / FiveHands share C++ code base).

  Date handling: event_date = 2021-07-22 (detection /
  operational impact day — Transnet's own statement and every
  contemporaneous source place the attack on that Thursday).
  reported_date = 2021-07-22: same day, since The Stack
  (2021-07-22) and TimesLIVE (2021-07-22) carried the first
  public reports; Transnet's formal acknowledgement ("act of
  cyber-attack, security intrusion and sabotage") followed on
  27 July with the force majeure letter, and the "Death Kitty"
  attribution was published by Bloomberg on 29 July. event_date
  <= reported_date holds.

  target_organization: Transnet SOC Ltd, a South African state-
  owned enterprise headquartered at the Carlton Centre,
  Johannesburg. Divisions encompass Transnet Freight Rail
  (heavy-haul freight railway, described by Wikipedia as the
  biggest outside the United States), Transnet National Ports
  Authority, Transnet Port Terminals, Transnet Pipelines and
  Transnet Engineering. The whole group was hit; the most
  visible impact was at TPT's four container terminals, but
  Transnet's own statement (quoted in multiple sources) and
  the AJIC paper confirm that IT across the group (incl.
  freight rail corporate systems, the transnet.net website)
  was disrupted.

  industry_sector: `freight` — Transnet Freight Rail is the
  group's dominant rail business (heavy-haul freight,
  including bulk coal, iron-ore, chrome and manganese
  corridors). The codebook's `freight` value directly fits.
  Alternatives considered: `infrastructure_manager` — Transnet
  does manage national rail infrastructure via the Transnet
  National Ports Authority / Transnet Freight Rail network
  division, but the attack's directly-rail-relevant subject
  is the freight operator. `other` would have applied only
  if the rail component were incidental, which it is not
  (the DZSF entry explicitly codes rail_operations). Ports
  are outside the repository's scope proper but share the
  same target organisation; the draft does not add a separate
  maritime entry.

  operator_type: `public_authority` — Transnet SOC Ltd is a
  wholly state-owned company (SOC = "State-Owned Company")
  under the Department of Public Enterprises. Supervising
  minister at the time of the incident: Pravin Gordhan. This
  is distinct from `incumbent` (usually the historical
  monopoly passenger/freight carrier in a liberalised market)
  and `private` (Merseyrail-style concession JV); Transnet
  is neither — it is the SOC that inherits the former South
  African Transport Services (SATS) monopoly and remains
  100 % state-owned.

  attack_vector: `unknown` — despite extensive public
  reporting and a formal parliamentary briefing, no source
  identifies the initial-access vector. HelloKitty is
  generically associated by MITRE / Trend / FBI with
  phishing, compromised credentials and exploitation of
  unpatched vulnerabilities (SonicWall CVE-2021-20016 in
  other 2021 campaigns), but no Transnet-specific source
  pins any of these. Per the repo's "prefer null over
  invention" rule, `unknown` is kept. supply_chain = false
  (no third-party / vendor compromise chain documented).

  malware: name "Death Kitty" (DZSF / Bloomberg wording);
  family "HelloKitty" (MITRE ATT&CK canonical name) — the
  HelloKitty / FiveHands / DeathRansom code lineage is
  widely documented (MITRE S0616 DEATHRANSOM, S0617
  HELLOKITTY, S0618 FIVEHANDS). mitre_software_id = S0617
  (HELLOKITTY). Note: the colloquial "Death Kitty" is a
  Bloomberg/CrowdStrike label, not a distinct MITRE entry.

  threat_actor: null — no public naming of a crew beyond
  CrowdStrike's "closed group or private service" framing
  and generic "Eastern Europe or Russia" geography.
  threat_actor_country kept null (generic regional
  suspicion, not a specific CC). attribution_confidence =
  `reported` — the ransomware-family attribution is
  reported by a named industry analyst (Meyers / CrowdStrike)
  and widely echoed by first-hand news (Bloomberg, Moneyweb,
  TechCentral, News24/Fin24), but no forensic confirmation
  or government-issued attribution statement exists.

  extortion = true (ransom note left on Transnet systems
  with dark-web negotiation portal, per TechCentral /
  Moneyweb / Bloomberg / cybersecurity-help.cz).
  motive = `financial` (standard ransomware monetisation;
  Bloomberg/Crowdstrike analyst framing; no credible
  state-sponsored hypothesis survived — South African
  authorities explicitly dismissed the Zuma-unrest
  coordination theory).

  data_published = false — no HelloKitty/Death Kitty leak-
  site post of Transnet data is documented in the 2021-2026
  public record; the 1 TB claim rests solely on the ransom
  note itself. data_compromise.customer_data = false: the
  Department of Public Enterprises explicitly stated no
  client data was compromised (Wikipedia; Moneyweb; ITWeb
  17-Aug briefing). organizational_data = true: the ransom
  note itself claimed encryption of corporate financial
  reports and internal documents, and file access was
  disrupted group-wide. intellectual_property = false (no
  IP-theft allegation or leaked sample).

  affected_systems: kept from the DZSF import
  [website, rail_operations] and augmented with `data` (the
  1 TB encryption claim against corporate files — financial
  reports, personal data) and `internal_communication` (the
  group-wide IT outage disrupted email and corporate-
  collaboration systems per The Stack / ITWeb / AJIC paper).
  `rail_operations` is honoured because the DZSF coding
  reflects the freight-rail relevance of the incident;
  however the notes should flag that the publicly-visible
  rail impact was corporate-IT / logistics-planning-level,
  not signalling-system-level: Transnet's own statement
  and the AJIC paper both confirm Transnet Freight Rail
  continued to run trains to schedule on paper-based
  manual processes.

  impact.scope = `national` — Transnet is the sole heavy-
  haul freight rail operator in South Africa and the
  monopoly national ports operator; the attack disrupted
  all four container ports and corporate IT group-wide.
  duration_hours left null — Navis N4 fully restored by
  30 July (~8 days), cyber force majeure lifted 2 August
  (~11 days), but rail services per Transnet's own
  statement were not physically stopped (manual
  workaround), so a single "duration" figure is not
  publicly defensible. affected_trains and affected_
  passengers null (freight rail; Transnet is not a
  passenger operator, and no specific train-count
  disruption figure was published). monetary_damage_eur
  null — the AJIC paper cites ZAR50 bn (≈USD2.79 bn) as
  the upper-bound estimate of annual export-sector losses
  across coal/chrome/iron-ore/manganese attributable to
  the combined riot+cyber disruption, not a
  Transnet-specific damage figure.

  confirmation_status = `confirmed` — Transnet publicly
  confirmed the incident via the TPT force-majeure letter
  (27 July 2021) and via Minister Gordhan's parliamentary
  briefing (17 August 2021); the Department of Public
  Enterprises issued a formal statement on client-data
  impact. This is the highest tier.

  MITRE ATT&CK techniques: only those directly supported
  by Transnet-specific public reporting or by HelloKitty's
  canonical S0617 behaviours observed here are asserted:
  T1486 (Data Encrypted for Impact — files encrypted across
  Transnet systems, ransom note left) and T1657 (Financial
  Theft — the extortion component). T1490 (Inhibit System
  Recovery) is also kept because HelloKitty's S0617
  technique list includes it and the AJIC paper notes
  Transnet had to rebuild Active Directory and restore
  systems from backups, consistent with shadow-copy/backup
  tampering. Generic HelloKitty behaviours (T1135 Network
  Share Discovery, T1047 WMI, T1057 Process Discovery)
  are deliberately not asserted per "prefer null over
  invention" — these are S0617 group-level behaviours but
  no Transnet-specific forensic write-up confirms them
  for this intrusion.

  German-language primary coverage: HANSA International
  Maritime Journal (Anna Wroblewski, 2021-07-23) carried
  a German-language news item, though the detail is behind
  a HANSA+ paywall. heise.de / Golem.de / tagesschau.de
  did not, per our searches, carry a dedicated Transnet
  item in 2021; this is documented as a coverage gap, not
  a conflict. The DZSF entry remains a German-language
  anchor.

  Sources: 17 total after enrichment, 16 non-DZSF (well
  above the ≥2 independent threshold). needs_review
  flipped from true to false. provenance.origin preserved.
