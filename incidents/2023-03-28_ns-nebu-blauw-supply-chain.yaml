notes: >
  Four-level supply chain: NS → Blauw Research (market-research
  agency) → Nebu B.V. (survey-software vendor) → attacker.
  event_date=2023-03-28 matches the NS public customer-notification day
  (the date on which the incident became a matter of public record for
  NS). The underlying Nebu intrusion is dated 2023-03-10 in the court-
  ordered independent forensic report; Nebu internally detected the
  breach on 11 March and began informing downstream clients later that
  month. supply_chain=true and attack_vector=supply_chain captures
  the root cause; Nebu has not publicly named a threat actor and the
  forensic report (April 2023) did not attribute the breach, so
  threat_actor remains null. affected_passengers=780000 is the NS
  customer-notification figure; aggregate across all Blauw/Nebu clients
  exceeds ~2 M Dutch residents but that figure spans multiple sectors
  outside rail. data_published left null because no leak-site listing
  or public dump has been documented as of April 2026.
