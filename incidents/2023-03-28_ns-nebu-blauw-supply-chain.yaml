description_en: >
  On 10 March 2023, attackers breached the systems of Nebu B.V., a Dutch
  supplier of online-survey software used by the market-research agency
  Blauw Research B.V., which ran customer-satisfaction surveys on behalf
  of dozens of Dutch organisations including Nederlandse Spoorwegen (NS).
  Nebu detected the intrusion on 11 March but did not notify downstream
  clients until later that month; NS began warning approximately 780,000
  customers on 28 March 2023 that their names, email addresses, phone
  numbers and postal addresses — collected from NS satisfaction surveys
  — may have been exfiltrated. No passwords, Mijn-NS credentials,
  OV-chipkaart or payment data were involved. The Nebu compromise
  propagated to at least nine other Dutch organisations (VodafoneZiggo,
  Heineken, CZ, ArboNed, Trevvel, the Dutch Rental Commission /
  Huurcommissie, the Dutch Golf Federation, IFFR and others), ultimately
  affecting around 2 million individuals in total; a Dutch court
  subsequently ordered Nebu to commission an independent forensic
  investigation.
description_de: >
  Am 10. März 2023 drangen Angreifer in die Systeme der niederländischen
  Firma Nebu B.V. ein, einer Softwarefirma für Online-Umfragen, die von
  der Marktforschungsagentur Blauw Research B.V. für
  Kundenzufriedenheitsbefragungen im Auftrag von Nederlandse Spoorwegen
  (NS) und weiteren Auftraggebern eingesetzt wurde. Nebu entdeckte den
  Einbruch am 11. März, informierte nachgelagerte Kunden aber erst
  später im Monat; NS begann am 28. März 2023 rund 780.000 Kundinnen
  und Kunden darüber zu informieren, dass Namen, E-Mail-Adressen,
  Telefonnummern und Postadressen aus NS-Zufriedenheitsbefragungen
  möglicherweise entwendet worden seien. Mijn-NS-Zugangsdaten,
  OV-Chipkarten- und Zahlungsdaten waren nicht betroffen. Der
  Nebu-Vorfall breitete sich auf mindestens neun weitere niederländische
  Organisationen aus (VodafoneZiggo, Heineken, CZ, ArboNed, Trevvel,
  Huurcommissie, Dutch Golf Federation, IFFR u. a.) mit insgesamt rund
  zwei Millionen Betroffenen; ein niederländisches Gericht ordnete
  später eine unabhängige forensische Untersuchung an.

