last_updated: '2026-04-19'
notes: >
  Identification: the DZSF raw-data row (IR, 2021-07-09, malware
  "Meteor", affected_systems [station_it, internal_train_tracking],
  confirmation_status confirmed) maps unambiguously to the "MeteorExpress"
  attack against the Islamic Republic of Iran Railways (RAI) publicly
  disclosed by Fars, Iran International, IRIB and Reuters-wire outlets on
  9 July 2021, technically analysed by Amnpardaz + SentinelOne on
  29 July 2021, and attributed by Check Point Research to the Indra
  persona on 14 August 2021. No other IR railway cyber-incident on
  2021-07-09 is publicly attested.

  Date handling: event_date kept at 2021-07-09 — the day operational
  disruption at RAI stations became publicly visible (Fars, IRIB,
  The Record, Iran International). event_date_precision `day`.
  reported_date set to 2021-07-09 (same-day IRIB/Fars reporting; The
  Record's first story is dated 2021-07-10 but the event was publicly
  visible at Iranian stations throughout 9 July). The follow-on
  Ministry of Roads portal incident (2021-07-10) is treated here as a
  cascading consequence of the same Indra intrusion — consistent with
  Check Point Research and Fortinet grouping both events under
  MeteorExpress — rather than as a separate incident; it is noted in
  `region` and in the descriptions. The compilation timestamp of the
  Meteor binary (2021-01-17) is the earliest in-the-wild forensic
  anchor.

  target_organization: Islamic Republic of Iran Railways (RAI /
  Rāh-Āhan-e Jomhuri-ye Eslāmi-ye Irān) — the state-owned national
  rail operator under the Ministry of Roads and Urban Development
  (Wikipedia: Rail transport in Iran). Raja Passenger Train Company
  — RAI's passenger-services subsidiary — operated the inter-city
  passenger services impacted by cancellations; it is therefore named
  as a cascading affected party, not the primary target. The Ministry
  of Roads and Urban Development (HQ, Tehran) portal outage of
  2021-07-10 is named in `region` as a same-operation cascading
  effect. Freight services (Railway Transportation Company / RAI
  freight subsidiary) were also disrupted per The Record
  ("both passenger and cargo transportation services").

  industry_sector: `other` — RAI is a vertically-integrated state
  railway operating passenger (via Raja subsidiary), freight (via
  Railway Transportation Company subsidiary) and infrastructure-
  manager functions; no single vocabulary value (`freight` /
  `long_distance_passenger` / `regional_passenger` /
  `infrastructure_manager`) captures the composite-target nature of
  the incident, and impacts were reported across all three branches.
  `other` is the codebook-sanctioned "mixed" fallback.

  operator_type: `public_authority` — RAI is a state-owned operator
  directly reporting to the Ministry of Roads and Urban Development,
  with the ministry itself also compromised the following day; this
  is the vocab value closest to a state-owned incumbent. `incumbent`
  (Deutsche Bahn / SNCF / SBB-style commercialised national
  incumbents) would mis-cast RAI's direct-ministry reporting line.

  attack_vector: `unknown` — no public source pins down the initial-
  access vector. SentinelOne states the attackers had "prior access
  to the network" and the destructive chain was distributed via
  Active Directory Group Policy Objects from CAB files on SMB shares
  (lateral distribution, post-initial-access). Initial access itself
  (phishing vs. exploit vs. credential theft vs. supply chain) is
  not publicly attributed — SentinelOne/Amnpardaz recovered neither
  the delivery vector nor the dwell-time forensics. `unknown` kept to
  honour the "prefer null over invention" rule.

  malware: Meteor — MITRE ATT&CK S0688 (confirmed; created in ATT&CK
  2022-03-07; associated group Indra). `family` set to MeteorExpress
  (the campaign toolkit) with explicit mention of the pre-operation
  Stardust (2020) and Comet (2019) Indra wipers that share code
  lineage per Check Point Research 2021-08-14.

  extortion = false: no ransom demand, no extortion note, no data-
  leak threat — explicitly noted by SentinelOne, The Record, Amnpardaz
  and Check Point Research as pure destructive/disruptive operation.
  data_published = false: no exfiltration claim or leaked sample in
  the public record as of 2026-04-19.

  motive = `hacktivism` — the self-identifying Indra persona frames
  itself as regime opposition / anti-IRGC hacktivist (Check Point
  Research, Graham Cluley, Times of Israel, BleepingComputer);
  Predatory Sparrow's parallel claim carries pro-Israel / anti-
  IRGC messaging (Wikipedia). Check Point explicitly assesses Indra
  as "unlikely to be a nation-state actor". The overt political-
  trolling payload (Khamenei phone number on platform displays) is
  inconsistent with `financial` or `espionage` and more specific than
  `disruption`; `hacktivism` is the best vocab fit. `state_
  geopolitical` would overstate — no government has attributed the
  campaign. `mixed` is a possible alternative but overloads motive
  coding for a single persona's well-articulated anti-regime framing.

  threat_actor: Indra (regime-opposition hacktivist persona; Check
  Point Research 2021-08-14 technical attribution). threat_actor_
  country = null — Check Point explicitly declines to assign a
  country and notes Indra's social-media presence does not resolve
  to a single geography; Iranian officials blamed Israel/US without
  publishing IOCs; Predatory Sparrow's pro-Israel alignment is
  suggestive but not formally attributed to an Israeli state entity.
  "Prefer null over invention" controls. attribution_confidence =
  `reported` — attribution rests on Check Point Research's code-
  lineage analysis (primary technical source), corroborated by
  Graham Cluley, Times of Israel, BleepingComputer — reported by a
  primary technical vendor but not forensically confirmed by a
  government authority.

  MITRE ATT&CK techniques: full set from the ATT&CK S0688 mapping
  (as listed on https://attack.mitre.org/software/S0688/), covering:
  T1047 (WMI), T1053.005 (Scheduled Task — `mstask` at 23:55),
  T1057 (Process Discovery), T1059.001 (PowerShell), T1059.003
  (Windows Cmd batch-file orchestration), T1070.001 (Clear Windows
  Event Logs), T1070.004 (File Deletion), T1082 (System Information
  Discovery), T1105 (Ingress Tool Transfer via CAB/SMB), T1106
  (Native API), T1036.004 (Masquerading: Masquerade Task or Service),
  T1484.001 (Domain Policy Modification: GPO Modification), T1485
  (Data Destruction — filesystem wipe), T1489 (Service Stop), T1490
  (Inhibit System Recovery — shadow-copy deletion / boot-policy
  mod), T1491.001 (Internal Defacement — platform displays + screen
  locker), T1518.001 (Security Software Discovery — Kaspersky check),
  T1531 (Account Access Removal — password change / domain removal),
  T1562.001 (Impair Defenses: Disable or Modify Tools — Defender
  exclusions), T1564.003 (Hide Artifacts: Hidden Window).

  affected_systems = [station_it, internal_train_tracking,
  passenger_information, website, internal_communication]. DZSF
  already coded the first two. Added: passenger_information (defaced
  platform display boards with fake delay/cancellation messages +
  Khamenei-office number — directly attested by Times of Israel,
  The Record, Iran International, RT DE, BleepingComputer, Graham
  Cluley, SentinelOne); website (Ministry of Roads portal / RAI
  ticketing and business-services websites down — attested by Press
  TV, The Record, Iran International, Engadget); internal_
  communication (staff-PC compromise at RAI + MoR HQ via AD/GPO
  propagation — Press TV quotes ministry statement: "disruption in
  the staff computer systems in the headquarters of the Ministry
  of Road and Urban Development"; SentinelOne on AD/GPO-driven
  network-wide deployment). rail_operations NOT asserted —
  operational-technology / signalling / interlocking / CBTC / ETCS
  systems were not reported as compromised; Iran's rail network is
  largely non-ETCS and SentinelOne found no evidence the wiper
  reached OT. payment_system NOT asserted — ticketing was down per
  The Record, but this falls under internal_train_tracking /
  passenger_information system outages rather than a targeted PoS /
  payment compromise per se; no source attests compromise of
  payment-card infrastructure.

  impact.scope = `national` — RAI is the national operator and the
  attack affected stations across the country (Fars: "unprecedented
  chaos at rail stations" nationwide; Iran International, The Record,
  BleepingComputer all describe nationwide scope). duration_hours
  left null — RAI publicly claimed service restoration by evening
  of 9 July, but no source provides a precise hour figure for full
  systems recovery; the MoR portal was still offline on 10 July.
  affected_trains / affected_passengers null: Fars reported
  "hundreds delayed or cancelled" but no exact figure is publicly
  confirmed, and RAI's spokesman disputed any train-operation
  impact. monetary_damage_eur null (no public figure).
  data_compromise.* all false: no data-theft claim or leak.

  confirmation_status = `confirmed`: the Ministry of Roads and Urban
  Development publicly confirmed the cyber incident via Press TV on
  2021-07-10 (official_statement); Iran International and state-
  media IRIB/Fars confirmed the railway disruption on 2021-07-09.
  This meets the highest tier of confirmation. `confirmation_status`
  was already `confirmed` in the DZSF row and is retained.

  Indra vs. Predatory Sparrow: the two personae were initially
  assumed separate — Indra on the basis of the Check Point 2021-08-14
  attribution, Predatory Sparrow on the basis of its own 2021 claim
  of responsibility for the railway attack. Check Point Research's
  subsequent 2022 analysis of the June-2022 Iranian steel-mill
  attack identified code overlap between Predatory Sparrow's 2022
  tooling and Indra's 2021 MeteorExpress code (CyberScoop, 2022),
  raising the possibility that Predatory Sparrow absorbed or re-used
  Indra's code. `threat_actor` is coded as Indra (primary technical
  attribution) with the Predatory Sparrow overlap documented in the
  description. No academic or government source has resolved the
  relationship.

  Government-level attribution gap: Iranian officials (telecoms
  minister Mohammad Javad Azari-Jahromi) publicly referenced
  "cyber aggressors" and implied Israeli/US involvement per Iran's
  historical accusations, but no IOCs or formal state attribution
  were published. No NCSC-UK, CISA, ANSSI, BSI or other Western
  government advisory specifically addresses the 2021 Iran railway
  attack (the only CERT-style technical advisory is Fortinet's
  FortiGuard 2021-07-30 threat-signal). German-language press
  coverage was located (RT DE, Deutsche Wirtschafts Nachrichten) —
  no heise.de, Golem.de or Tagesschau technical piece specifically on
  the railway attack found; the main German-language academic anchor
  is DZSF.

  A third-party claim by a persona calling itself "MBC" surfaced on
  2021-08-21 (The National, UAE) purporting to be ransomware-group
  responsibility. This claim contradicts the SentinelOne / Amnpardaz
  / Check Point wiper-not-ransomware finding and the Indra code-
  lineage evidence; no technical corroboration exists and MBC's
  claim is treated as noise, not a credible attribution.
