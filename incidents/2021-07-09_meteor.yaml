description_en: >
  On 9 July 2021 (Friday) the Islamic Republic of Iran Railways (RAI),
  the state-owned national rail operator under the Ministry of Roads
  and Urban Development, suffered a destructive cyberattack that
  paralysed train-schedule management, ticketing and passenger-
  information systems nationwide. Semi-official Fars news agency
  reported "unprecedented chaos" at stations across the country with
  hundreds of trains delayed or cancelled; RAI spokesman Sadegh Sekri
  initially denied any service impact and claimed only the displays
  were affected, a position contradicted by Fars and Iran International
  reporting. Defaced platform displays at stations showed fake delay
  and cancellation messages and instructed passengers to call
  "64411" — the publicly listed phone number of Supreme Leader
  Ayatollah Ali Khamenei's office — for further information, a
  trolling element widely noted by Reuters-wire syndication, the
  Times of Israel, Iran International, Xinhua, and Western security
  press. The following day (10 July 2021) the headquarters portal of
  the Ministry of Roads and Urban Development was also taken down;
  Iranian state broadcaster Press TV confirmed the ministry incident
  and characterised it as "new provocations by cyber aggressors",
  while the telecoms minister urged agencies to route indicators to
  Iran's MAHER CERT. Technical analysis published on 29 July 2021 by
  Iranian antivirus vendor Amnpardaz and on the same day by
  SentinelOne (Juan Andres Guerrero-Saade, "MeteorExpress") showed
  the intrusion combined three components — a previously-unseen
  externally-configurable wiper (Meteor / env.exe / msapp.exe,
  compiled 2021-01-17, MITRE ATT&CK S0688), a screen-locker
  (mssetup.exe) and an MBR-corrupting executable (nti.exe) — deployed
  network-wide via Active Directory Group Policy Objects from CAB
  archives on SMB shares, with scheduled-task execution at 23:55
  local time. Contrary to early ransomware framing, no ransom demand
  was made and no data exfiltration was claimed or published; the
  operation was purely destructive/disruptive with an overt political-
  trolling payload. On 14 August 2021 Check Point Research attributed
  MeteorExpress to the self-identifying anti-regime hacktivist persona
  "Indra" (named after the Hindu god of war) on the basis of shared
  code lineage with the earlier "Stardust" (2020) and "Comet" (2019)
  wipers Indra had used against Syrian companies Katerji Group,
  Arfada Petroleum, Alfadelex Trading, Cham Wings Airlines, and
  Banias Oil refinery — concluding that "judging by the quality of the
  tools, their modus operandi, and their presence on social media"
  Indra was unlikely to be a nation-state actor. In parallel, the
  pro-Israel/anti-IRGC persona "Predatory Sparrow" (Persian:
  گنجشک درنده / Gonjeshke Darande) publicly claimed the July 2021
  Iranian-transit attack; Check Point Research later (2022) identified
  code overlap between Predatory Sparrow's 2022 steel-mill tooling
  and Indra's MeteorExpress code, leaving the precise relationship
  between the two personae unresolved. No government-level attribution
  to a specific nation-state exists; Iranian officials publicly blamed
  Israel and the United States but published no indicators of
  compromise tying the attack to either.
description_de: >
  Am 9. Juli 2021 (Freitag) erlitt die staatliche iranische
  Eisenbahngesellschaft Rāh Āhan-e Jomhuri-ye Eslami-ye Iran (RAI) —
  der nationale Bahnbetreiber unter dem iranischen Ministerium für
  Straßen- und Stadtentwicklung — einen destruktiven Cyberangriff,
  der landesweit die Fahrplansteuerung, den Ticketverkauf und die
  Fahrgastinformationssysteme lahmlegte. Die halbamtliche
  Nachrichtenagentur Fars berichtete von „beispiellosem Chaos" in den
  Bahnhöfen des Landes mit hunderten verspäteten oder gestrichenen
  Zügen; RAI-Sprecher Sadegh Sekri dementierte zunächst jegliche
  Betriebsstörung und behauptete, nur die Anzeigetafeln seien
  betroffen — eine Einschätzung, der Fars und Iran International
  widersprachen. Auf defacten Bahnsteiganzeigen wurden gefälschte
  Verspätungs- und Ausfallmeldungen angezeigt und Reisende
  aufgefordert, unter der Rufnummer „64411" — der öffentlich
  bekannten Telefonnummer des Büros des obersten Führers Ayatollah
  Ali Khamenei — nachzufragen, ein hacktivistisch-trollender Zug,
  der in Reuters-Agenturmaterial, Times of Israel, Iran International,
  Xinhua und der westlichen IT-Sicherheitspresse breit dokumentiert
  wurde. Am Folgetag (10. Juli 2021) wurde das Hauptportal des
  iranischen Ministeriums für Straßen- und Stadtentwicklung offline
  genommen; der iranische Staatssender Press TV bestätigte den
  Ministeriumsvorfall und sprach von „neuen Provokationen durch
  Cyber-Aggressoren"; der Telekommunikationsminister forderte die
  Behörden auf, Indikatoren an die iranische CERT-Stelle MAHER zu
  übermitteln. Die technische Analyse veröffentlichte am 29. Juli 2021
  der iranische Antivirenhersteller Amnpardaz und — am selben Tag —
  SentinelOne (Juan Andres Guerrero-Saade, „MeteorExpress"): Der
  Angriff kombinierte drei Komponenten — einen bis dato unbekannten,
  extern konfigurierbaren Wiper (Meteor / env.exe / msapp.exe,
  kompiliert am 17. Januar 2021; MITRE ATT&CK S0688), einen
  Screenlocker (mssetup.exe) sowie ein MBR-zerstörendes Binary
  (nti.exe) — verteilt netzweit über Active-Directory-
  Gruppenrichtlinien aus CAB-Archiven auf SMB-Freigaben, mit einer
  geplanten Ausführung um 23:55 Uhr Ortszeit. Entgegen der
  anfänglichen Einordnung als Ransomware gab es keine
  Lösegeldforderung und keine Datenexfiltration oder -veröffentlichung;
  die Operation war rein destruktiv/disruptiv mit einem offen
  politisch-trolligen Payload. Am 14. August 2021 schrieb Check Point
  Research MeteorExpress der sich selbst als regimekritisch
  bezeichnenden Hacktivistengruppe „Indra" (benannt nach dem
  hinduistischen Kriegsgott) zu — auf Grundlage gemeinsamer
  Codebasis mit den älteren Wipern „Stardust" (2020) und „Comet"
  (2019), die Indra zuvor gegen die syrischen Unternehmen Katerji
  Group, Arfada Petroleum, Alfadelex Trading, Cham Wings Airlines
  und die Banias-Raffinerie eingesetzt hatte — und kam zu dem
  Schluss, dass Indra „angesichts der Werkzeugqualität, der
  Vorgehensweise und der Social-Media-Präsenz" unwahrscheinlich als
  Nationalstaatsakteur einzuordnen sei. Parallel dazu reklamierte die
  pro-israelische / anti-IRGC-Persona „Predatory Sparrow" (persisch
  گنجشک درنده / Gonjeshke Darande) öffentlich den Juli-Angriff auf
  das iranische Verkehrssystem; Check Point Research stellte später
  (2022) Code-Überschneidungen zwischen Predatory-Sparrow-Tools der
  Stahlwerksangriffe 2022 und Indras MeteorExpress-Code fest — die
  genaue Beziehung beider Personae bleibt ungeklärt. Eine offizielle
  nationalstaatliche Attribution existiert nicht; iranische Stellen
  beschuldigten Israel und die USA öffentlich, legten jedoch keine
  technischen Indikatoren vor.
