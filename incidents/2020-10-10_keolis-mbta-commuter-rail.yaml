notes: >
  industry_sector=regional_passenger: MBTA Commuter Rail is a
  suburban/commuter passenger network (14 lines, ~140 stations across
  eastern Massachusetts and northern Rhode Island). operator_type=
  private because the affected entity is Keolis Commuter Services
  (Keolis North America subsidiary), not MBTA itself; MBTA contracts
  Keolis as operating company. attack_vector=unknown: no public
  attribution or initial-access vector; the company did not name the
  ransomware family or the attacker. extortion=true and data_published=
  true reflect the confirmed leak of employee HR data on the
  attacker's shaming site after Keolis refused to pay. affected_trains=
  0 because operations were not impacted. No MBTA rider data was
  compromised per Keolis's statement. Parallels the dataset's existing
  2021-04-18_lockbit (Merseyrail) pattern: ransomware at a rail
  operator with leak-site employee-data extortion but no train impact.
