description_en: >
  On the morning of 10 October 2020, Keolis Commuter Services — the
  private contract operator of the Massachusetts Bay Transportation
  Authority (MBTA) commuter-rail network in Boston — detected a
  ransomware intrusion on its corporate IT environment. The company's
  threat-detection tooling alerted staff, who disconnected the affected
  systems from the network within hours; no MBTA networks, operational
  or safety-critical systems, or passenger-facing applications were
  reached. Train services continued to run on schedule. Attackers did,
  however, exfiltrate and subsequently publish personal information
  belonging to Keolis employees (names, Social Security numbers and
  other HR records). Keolis declined to pay the ransom, engaged a
  forensic firm and offered affected employees credit-monitoring and
  identity-theft-protection services. The incident was publicly
  disclosed by The Boston Globe on 23 October 2020.
description_de: >
  Am Morgen des 10. Oktober 2020 entdeckte Keolis Commuter Services —
  der private Betreiber des Pendlerbahn-Netzes der Massachusetts Bay
  Transportation Authority (MBTA) im Großraum Boston — einen
  Ransomware-Einbruch in seiner Unternehmens-IT. Die Bedrohungs-
  erkennung löste Alarm aus; Mitarbeitende trennten die betroffenen
  Systeme binnen weniger Stunden vom Netz. MBTA-Netze, betrieblich
  oder sicherheitsrelevante Systeme sowie fahrgastseitige Anwendungen
  blieben unberührt; der Zugbetrieb lief fahrplanmäßig weiter. Die
  Angreifer entwendeten und veröffentlichten jedoch Personaldaten von
  Keolis-Beschäftigten (Namen, US-Sozialversicherungsnummern, weitere
  HR-Datensätze). Keolis zahlte kein Lösegeld, beauftragte ein
  forensisches Unternehmen und bot betroffenen Beschäftigten kostenlose
  Kreditüberwachung und Identitätsdiebstahlschutz an. Öffentlich
  gemacht wurde der Vorfall am 23. Oktober 2020 durch The Boston Globe.

