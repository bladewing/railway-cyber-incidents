description_en: >
  On 31 August 2024 attackers affiliated with the English-speaking
  social-engineering collective Scattered Spider (also tracked as
  UNC3944 / Octo Tempest) gained persistent access to the corporate
  network of Transport for London (TfL) through a targeted phishing
  and help-desk social-engineering campaign. TfL detected the intrusion
  on 1 September and publicly confirmed it on 2 September 2024. Over
  the following weeks TfL took customer-facing back-office systems
  offline to contain the incident: online refunds, Oyster auto-top-up
  registrations, Dial-a-Ride bookings, live LU arrival data and
  journey-history endpoints were all degraded or suspended. Investigators
  determined that the personal data of approximately 10 million
  customers was accessed (names, contact details, email and home
  addresses, some date-of-birth records), and that around 5,000 Oyster
  refund records containing bank account numbers and sort codes were
  also exposed. TfL forced a password reset for its ~30,000 staff,
  requiring in-person identity verification for many employees. Two
  suspected Scattered Spider members — Thalha Jubair (19, East London)
  and Owen Flowers (18, Walsall) — were arrested by the UK National
  Crime Agency on 16 September 2024 and charged under the Computer
  Misuse Act 1990; a further 17-year-old had been arrested on
  6 September. Public-body accounts showed TfL response and remediation
  costs approaching GBP 40 million (≈ EUR 48 M).
description_de: >
  Am 31. August 2024 verschafften sich Angreifer der
  englischsprachigen Social-Engineering-Gruppe Scattered Spider (auch
  UNC3944 / Octo Tempest) persistenten Zugriff auf das Unternehmensnetz
  von Transport for London (TfL) durch gezieltes Phishing und
  Helpdesk-Social-Engineering. TfL entdeckte den Einbruch am
  1. September und bestätigte ihn öffentlich am 2. September 2024. In
  den folgenden Wochen schaltete TfL zahlreiche Kundenfunktionen ab:
  Online-Rückerstattungen, Oyster-Auto-Top-Up-Anmeldungen,
  Dial-a-Ride-Buchungen, LU-Echtzeitdaten und Fahrthistorien waren
  degradiert oder ausgesetzt. Laut Ermittlungen wurden Personendaten
  von rund zehn Millionen Kunden abgegriffen (Namen, Kontaktdaten,
  E-Mail und Postanschriften, teils Geburtsdaten) sowie rund
  5.000 Oyster-Rückerstattungsdatensätze mit Bankkontonummern und
  Bankleitzahlen. TfL erzwang für ~30.000 Beschäftigte einen
  Passwort-Reset mit persönlicher Identitätsprüfung. Am 16. September
  2024 verhaftete die britische National Crime Agency zwei mutmaßliche
  Scattered-Spider-Mitglieder — Thalha Jubair (19, East London) und
  Owen Flowers (18, Walsall) —; ein 17-Jähriger war bereits am
  6. September festgenommen worden. Die TfL-Reaktions- und
  Sanierungskosten belaufen sich auf knapp 40 Millionen GBP
  (rund 48 Mio. EUR).

