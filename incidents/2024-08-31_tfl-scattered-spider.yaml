notes: >
  TfL is the public transport authority for Greater London (operator_
  type=public_authority) and operates the London Underground, Elizabeth
  line and Docklands Light Railway — clearly rail operations within
  this dataset's remit — alongside buses and managed roads. industry_
  sector=urban_transit rather than rolling_stock_manufacturer or
  infrastructure_manager, matching the dataset's handling of BVG
  (2025-04-07_bvg) and WMATA (2024-05-07_wmata). attack_vector=phishing
  and motive=financial reflect Scattered Spider's documented tradecraft
  (SIM-swap + help-desk social engineering + identity-provider abuse
  → domain admin → extortion). extortion=true — Scattered Spider
  attempted ransom negotiation according to TfL internal reporting
  surfaced in later press coverage; no public ransom amount nor paid
  ransom has been reported. monetary_damage_eur approximates the
  GBP 30-40 M TfL response cost (2024-12 / 2026-03 reporting); exact
  figure pending TfL annual report. Rail operations and signalling
  were not directly affected; safety-of-life systems remained
  segregated per TfL's confirmation. The 17-year-old's name is
  withheld per UK youth-reporting restrictions.
