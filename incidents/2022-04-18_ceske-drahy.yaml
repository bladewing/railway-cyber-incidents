notes: >
  Rail-primary incident within a cross-sector Killnet campaign. ČD's
  core rail operations (signalling, interlocking, dispatch) were not
  affected — the outage was limited to public-facing web and ticketing
  surfaces. Duration was reported in the scale of hours to a day but
  exact duration was not disclosed. ČD's Annual Report 2022 mentions
  cyber-incident handling generally but does not itemise this event.
  This entry was manually rewritten from the discovery-pipeline draft
  2023-02-09_eurepoc-085a, which had conflated 16 Killnet target
  countries into a single stub with the wrong event_date (the 2023
  SecurityAffairs report date, not the 2022 incident date). Scope was
  narrowed to the ČD victim, event_date corrected to 2022-04-18, and
  sources replaced with rail-naming reporting from BankInfoSecurity,
  Expats.cz, and Securelist.
