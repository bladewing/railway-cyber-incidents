description_en: >
  On 18 April 2022, Czech Railways (České dráhy / ČD) suffered a
  distributed denial-of-service attack that disrupted its public website
  and online sales channels, including an outage of the Můj vlak ("My
  Train") mobile application used for ticket purchase and connection
  search. ČD confirmed the attack via an official statement on its
  Twitter account, stating that online operations had been affected and
  that some railway applications were unavailable. No data exfiltration
  was reported. The attack was part of a broader pro-Russian Killnet
  campaign against Czech critical infrastructure that ran from 18 April
  2022 onward and also targeted the Interior Ministry, Chamber of
  Deputies, Prague Airport, the regional airports of Karlovy Vary,
  Pardubice, Brno-Tuřany and Ostrava, Komerční banka, and the
  telecommunications operator O2. Killnet claimed responsibility on its
  Telegram channels.
