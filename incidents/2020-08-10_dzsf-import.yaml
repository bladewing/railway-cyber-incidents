description_en: >
  On Monday 10 August 2020 the IT department of the Southeastern
  Pennsylvania Transportation Authority (SEPTA) — the public-authority
  transit operator for the five-county Philadelphia metropolitan area,
  which runs 13 Regional Rail commuter lines, the Market-Frankford and
  Broad Street subway lines, city and suburban trolleys and buses,
  serving roughly four million people — detected unauthorised access
  to its servers and shut systems down to contain the spread.
  Multiple sources at the authority subsequently confirmed the event
  as a ransomware attack settled through SEPTA's cyber liability
  insurance, although SEPTA itself never publicly named the
  ransomware family or the threat actor. Approximately 100 servers
  and 50 workstations were affected. Impact on passengers was
  concentrated on information systems: SEPTA's real-time
  "Next-to-Arrive" / TransitView / TrainView feeds, the mobile app,
  the public website and automated platform announcements were
  unavailable from 10 August until late on Monday 24 August 2020 —
  riders were referred to printed schedules and station staff during
  the roughly two-week outage. SEPTA Key card and fare-payment
  systems, which run on an air-gapped third-party platform, were
  unaffected, and revenue rail and bus service continued throughout.
  Internal impact was more prolonged: around 2,200 employee email
  accounts, phone directories, payroll, remote timekeeping,
  shared-drive file servers and headquarters Internet connectivity
  were disrupted, and the automatic-passenger-counting (APC) system
  used to manage COVID-19 crowding on roughly a quarter of the bus
  and trolley fleet remained offline for about four months.
  Scheduling for the Customized Community Transportation (CCT)
  paratransit service was likewise impaired. On 27 August 2020 SEPTA
  general manager Leslie S. Richards wrote to the agency's
  approximately 9,300 employees to warn that unauthorised
  individuals may have accessed files containing employee names,
  Social Security numbers, addresses, benefits-enrolment
  information, salaries / hourly rates and bank account and routing
  numbers; SEPTA offered a year of Kroll credit-monitoring paid for
  out of the cyber insurance policy and opened an employee call
  centre. The FBI and external forensics provider Arete Advisors
  assisted the investigation. No rider data was reported as
  compromised and no leak of the exfiltrated employee data has been
  observed on any ransomware leak site. A hard drive containing
  "executable batch files used to spread malware" from an
  investigation workstation went missing between 5 and 10 September
  2020 and was never recovered, but SEPTA stated that it held no
  sensitive personal information; the investigation closed without
  public attribution.
description_de: >
  Am Montag, 10. August 2020, stellte die IT-Abteilung der
  Southeastern Pennsylvania Transportation Authority (SEPTA) — der
  öffentlich-rechtliche Nahverkehrsbetreiber der fünf Countys um
  Philadelphia mit 13 Regionalbahnlinien (Regional Rail), den
  U-Bahn-Linien Market-Frankford und Broad Street, Stadt- und
  Vorortstraßenbahnen sowie Buslinien und rund vier Millionen
  Einwohnern im Einzugsgebiet — unautorisierte Zugriffe auf ihre
  Server fest und fuhr die Systeme zur Eindämmung herunter. Mehrere
  Quellen innerhalb der Verkehrsbehörde bestätigten den Vorfall
  anschließend als Ransomware-Angriff, der über die Cyber-
  versicherung der SEPTA reguliert wurde; die Ransomware-Familie und
  die Urheber wurden öffentlich nie benannt. Betroffen waren rund
  100 Server und 50 Arbeitsplatzrechner. Fahrgastseitig wirkten sich
  die Folgen auf Informationssysteme aus: die Echtzeitauskunft
  („Next-to-Arrive“ / TransitView / TrainView), die mobile App, die
  Webseite und die automatischen Bahnsteigansagen waren vom
  10. August bis zum späten Montag, 24. August 2020 nicht verfügbar
  — rund zwei Wochen lang wurden die Fahrgäste auf gedruckte
  Fahrpläne und Personal verwiesen. Das Bezahlsystem SEPTA Key, das
  von einem Dritten auf einer luftgetrennten Plattform betrieben
  wird, war nicht betroffen, der Bahn- und Busbetrieb lief
  durchgängig weiter. Intern hielten die Störungen länger an: rund
  2.200 E-Mail-Konten der Beschäftigten, Telefonverzeichnisse,
  Lohnbuchhaltung, Zeiterfassung, gemeinsam genutzte Dateiserver
  und der Internetzugang am SEPTA-Hauptsitz waren unterbrochen; das
  automatische Fahrgastzählsystem (APC), mit dem während der
  Corona-Pandemie auf etwa einem Viertel der Bus- und
  Straßenbahnflotte die Auslastung überwacht wurde, blieb rund vier
  Monate offline. Auch die Disposition des Paratransit-Dienstes
  „Customized Community Transportation“ (CCT) war beeinträchtigt.
  Am 27. August 2020 informierte SEPTA-Generaldirektorin Leslie S.
  Richards die rund 9.300 Beschäftigten per E-Mail darüber, dass
  Unbekannte möglicherweise auf Dateien mit Namen,
  Sozialversicherungs­nummern, Adressen, Angaben zur Leistungs­
  anmeldung, Gehalts- bzw. Stundenlohnsätzen sowie Bankkonto- und
  Routingnummern zugegriffen haben; SEPTA übernahm über die
  Cyber­versicherung zwölf Monate Bonitätsüberwachung bei Kroll
  und richtete eine Mitarbeiter-Hotline ein. Das FBI und der
  externe Incident-Response-Dienstleister Arete Advisors
  unterstützten die Untersuchung. Daten von Fahrgästen wurden nicht
  als kompromittiert gemeldet und die erbeuteten Personaldaten
  tauchten bis heute nicht auf einer Ransomware-Leak-Site auf. Eine
  Festplatte mit „ausführbaren Batch-Dateien zur Verbreitung der
  Schadsoftware“ verschwand zwischen dem 5. und 10. September 2020
  von einem der Untersuchungsrechner und blieb verschollen; laut
  SEPTA enthielt sie keine sensiblen Personendaten. Eine
  öffentliche Zuordnung zu einem Täter erfolgte nicht.
