description_en: >
  In January 2018, Metrolinx — the Ontario Crown agency that coordinates
  GO Transit regional rail, UP Express and the PRESTO fare system across
  the Greater Toronto and Hamilton Area — publicly disclosed that malware
  had been found on one of its corporate computer networks roughly two
  weeks earlier, and attributed the intrusion to North Korea with the
  traffic said to have been routed through servers in Russia. The agency
  said its firewall had been breached but that safety-critical rail and
  bus control systems, PRESTO (on a segregated network) and customer and
  staff data were not affected, and the RCMP opened an investigation.
  The DPRK attribution was widely reported but remained contested:
  Metrolinx and the Ontario government declined to publish any evidence,
  and cybersecurity experts including Citizen Lab director Ron Deibert
  and Trend Micro's Mark Nunnikhoven publicly criticised the naming of a
  nation-state without supporting proof.
description_de: >
  Im Januar 2018 meldete die Verkehrsagentur Metrolinx — eine
  landeseigene Gesellschaft der Provinz Ontario, die den
  Regionalzugbetrieb GO Transit, den Flughafenzubringer UP Express sowie
  das Ticketing-System PRESTO in der Metropolregion Toronto/Hamilton
  verantwortet — dass rund zwei Wochen zuvor Schadsoftware in einem
  ihrer Verwaltungsnetze gefunden worden sei. Die Agentur schrieb den
  Angriff Nordkorea zu; der Datenverkehr sei über russische Server
  geleitet worden. Die Firewall sei durchbrochen worden, sicherheitsrelevante
  Zug- und Busleitsysteme, das (getrennt betriebene) PRESTO-System sowie
  Kunden- und Mitarbeiterdaten seien jedoch nicht betroffen gewesen; die
  RCMP nahm Ermittlungen auf. Die DPRK-Zuschreibung wurde breit berichtet,
  blieb aber umstritten: Metrolinx und die Regierung von Ontario
  veröffentlichten keine Belege, und IT-Sicherheitsfachleute wie Ron
  Deibert (Citizen Lab) und Mark Nunnikhoven (Trend Micro) kritisierten
  die öffentliche Nennung eines Staatsakteurs ohne nachvollziehbaren
  Nachweis.
