notes: >
  The DZSF raw-data row carries country "Kanada" (CA) and actor
  "Nordkorea?" with date 2018-01-01 (month precision). It corresponds
  to the Metrolinx disclosure of 23 January 2018. Metrolinx spokesperson
  Anne Marie Aikins said the malware had been found on a corporate
  network roughly a week to two weeks before the announcement; no
  precise incident date was ever released. `event_date` is therefore
  kept at 2018-01-01 with month precision, and `reported_date` is set
  to the public disclosure on 2018-01-23. `threat_actor_country: KP` is
  recorded because that is the attribution Metrolinx made on the record,
  but `attribution_confidence` is `rumored` rather than `reported`: no
  evidence was published, Metrolinx declined to back the claim with
  indicators, and multiple independent experts (Ron Deibert of Citizen
  Lab; Mark Nunnikhoven, then of Trend Micro; Carmi Levy) publicly
  criticised the attribution as unsubstantiated. No specific named
  threat group (Lazarus, APT38, Kimsuky, Andariel, etc.) was ever
  attached to this incident by a vendor or CERT. The malware itself
  was not publicly named; references in some downstream pieces to
  "WannaCry-like" behaviour are speculative and not supported by
  Metrolinx's statements. `affected_systems: [data]` reflects that the
  impact was limited to a Metrolinx corporate/administrative IT
  network; PRESTO (ticketing), GO Transit operations, UP Express and
  bus operations were explicitly stated to be unaffected, and PRESTO
  runs on a segregated network.
