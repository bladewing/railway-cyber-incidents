notes: >
  Identification: the DZSF raw-data row (GB, 2021-04-18, threat_actor
  LockBit, extortion, data + internal_communication) unambiguously
  maps to the Merseyrail LockBit incident publicly disclosed via
  BleepingComputer on 28 April 2021 (email arrival date: 18 April
  2021). 18 April 2021 was a Sunday — consistent with the "previous
  weekend outage" referenced in the attacker-sent email. No other UK
  railway LockBit incident is publicly attested for April 2021; the
  next publicly documented LockBit rail-adjacent case is the
  post-2.0 era (Q3-2021 onward).

  Date handling: event_date kept at 2021-04-18 — the day the
  attacker-sent email carrying the "Lockbit Ransomware Attack and
  Data Theft" subject was disseminated to BleepingComputer, UK
  newspapers, and Merseyrail staff (explicit in BleepingComputer,
  The Register, Computer Weekly, Graham Cluley, Information Age,
  Security Affairs, DataBreaches.net). That same day is also the
  earliest publicly fixed calendar date in the incident timeline
  (the "weekend outage" reference is qualitative, not a dated
  event). reported_date set to 2021-04-18 because that is the day
  the incident became externally known via the attacker's mass-
  email tactic, even though Merseyrail's own corporate confirmation
  statement followed ten days later on 28 April 2021. The actual
  intrusion date (initial Office 365 compromise → lateral movement
  → deployment) is not publicly known and is presumably earlier.

  target_organization: Merseyrail Electrics (2002) Ltd, the train-
  operating company, trading as "Merseyrail". 50:50 concession
  joint venture between Serco Group plc and Transport UK Group Ltd
  (the Netherlands-incorporated NedRailways parent was renamed
  Abellio in 2009; Abellio UK was rebranded Transport UK in 2024 —
  as of the 2021 incident the JV partner was still branded Abellio).
  Network owned by Merseytravel (Liverpool City Region Combined
  Authority) and Network Rail; Merseyrail holds a 25-year concession
  running to 2028. This is why operator_type is coded `private`
  rather than `public_authority`: the attack target is the private
  train-operating JV, not Merseytravel itself.

  industry_sector: `urban_transit` — Merseyrail is a self-contained
  third-rail commuter/metro-style network in the Liverpool City
  Region with frequent-interval services on the Northern and
  Wirral Lines; it is classed as a rapid-transit/urban operation
  rather than long-distance or regional passenger rail in Wikipedia,
  Transport UK marketing material and the UK Rail Industry Safety
  & Standards Board taxonomy.

  attack_vector: `credential_theft`. Computer Weekly (Alex Scroxton,
  2021-04-28) cites Darktrace analysis pointing to "a successful
  compromise of a privileged Microsoft Office 365 account" via
  spear-phishing of a privileged credential; The Register (Gareth
  Corfield) repeats the Office-365-account-takeover framing. The
  Darktrace background blog (2021-02-24) notes that LockBit
  intrusions typically begin with one compromised privileged
  credential obtained via brute-force against an externally-facing
  device or phishing. `credential_theft` is the best-fitting
  vocabulary value; `phishing` is a plausible alternative if the
  specific Office-365 access was obtained via a spear-phishing lure
  rather than brute-force, but no source pins down the method
  further — `credential_theft` captures the "account takeover via
  compromised privileged credentials" fact set without overstating.

  malware: LockBit, family LockBit (pre-2.0 / ".abcd" era; April
  2021 predates LockBit 2.0's debut in June 2021). MITRE ATT&CK
  has Software entries S1199 (LockBit 2.0) and S1202 (LockBit 3.0)
  plus S1200 (StealBit), but no distinct Software ID for the
  original 2019-2021 LockBit build used here. `mitre_software_id`
  therefore kept null (the orchestrator prompt's suggestion of
  S0372 / S1073 appears erroneous: S0372 is LockerGoga; S1073 is
  unrelated).

  threat_actor: LockBit gang. Russian-language forum origins
  (Wikipedia). US DOJ/UK NCA 2024 unmasked group administrator
  "LockBitSupp" as Dmitry Yuryevich Khoroshev of Voronezh, Russia
  (Krebs on Security 2024). However, as of the 2021 Merseyrail
  incident, no formal nation-state attribution existed; Wikipedia
  and Brandefense note that members have publicly claimed non-
  Russian origins (the group self-reported as "located in the
  Netherlands"). Taking `threat_actor_country` as null here
  (honest over-assertion avoidance) and `attribution_confidence`
  at `reported` (the LockBit attribution rests on the attacker's
  own email subject-line branding + the image proof + BleepingComputer
  first-hand coverage — widely reported but not independently
  forensically confirmed).

  MITRE ATT&CK techniques asserted: T1078.004 (Valid Accounts:
  Cloud Accounts — compromised Office 365 privileged MD account);
  T1114 (Email Collection — attacker used the compromised mailbox
  to send outbound messages; covers mailbox access + Email
  Forwarding behaviour documented by Computer Weekly/The Register);
  T1486 (Data Encrypted for Impact — LockBit's canonical payload
  behaviour, supported by Darktrace); T1657 (Financial Theft —
  the extortion/ransom component). Additional LockBit-generic
  techniques (T1566 Phishing; T1110 Brute Force; T1021.002
  SMB/Windows Admin Shares; T1490 Inhibit System Recovery) are
  deliberately not asserted — Darktrace's general LockBit write-up
  enumerates them but no Merseyrail-specific public source pins
  them to this intrusion, and the draft conforms to the repo's
  "prefer null over invention" rule.

  motive = `financial` (standard ransomware monetisation).
  extortion = true (explicit ransom threat + data-theft coercion
  via the mass email). data_published = `false`: LockBit did not
  post Merseyrail data on its leak site ("Happy Blog" /
  subsequent leak sites) — public record shows only the attacker-
  sent email with an embedded employee screenshot, not a dark-web
  data dump. data_compromise.customer_data = true and
  organizational_data = true are asserted because the attacker
  message (quoted verbatim across Computer Weekly / The Register /
  Graham Cluley / BleepingComputer) explicitly claimed theft of
  both employee and customer personal data, with an embedded
  single-employee screenshot provided as proof. data_compromise.
  intellectual_property = false: no IP/trade secret/design
  exfiltration claim or leaked sample.

  affected_systems = [internal_communication, data]. The MD's
  Office 365 mailbox is an internal-communication system that
  was definitively compromised (attacker sent internal emails
  from it to Merseyrail staff); data is supported by the personal-
  data exfiltration claim and embedded image. No source attests
  compromise of station IT, passenger information, train-driver
  communication, ticketing/payment, website, train tracking or
  rail-operations systems — consistent with Merseyrail's own
  public statement that "this does not affect the operation of
  our services".

  impact.scope = `regional`: Merseyrail serves the Liverpool City
  Region and adjacent counties (Merseyside, Halton, Cheshire,
  Lancashire fringe), i.e. a metropolitan-regional footprint
  within the UK rather than the national rail network.
  duration_hours left null — the "weekend outage" referenced in
  the attacker email is not quantified. affected_trains and
  affected_passengers null (no operational disruption reported;
  Merseyrail stated services continued). monetary_damage_eur
  null (no public figure).

  confirmation_status = `confirmed`: Merseyrail's own public
  statement confirmed the cyber-attack and the notification to
  relevant authorities; the UK ICO confirmed receipt of the
  breach report. This meets the highest tier of confirmation.

  German-language press coverage was not located (heise.de,
  Golem.de, Tagesschau, Süddeutsche searches returned no
  Merseyrail 2021 article). The DZSF entry is the sole German-
  language primary anchor; noted as a coverage gap rather than
  a substantive discrepancy. Native Russian-language coverage
  also not located beyond generic LockBit-group write-ups.

  No CVE/CERT advisory was issued — the Merseyrail attack is
  characterised as a privileged-credential compromise plus
  commodity ransomware deployment rather than exploitation of a
  disclosed vulnerability; NCSC did not issue a Merseyrail-
  specific advisory. No long-term ICO enforcement action is in
  the 2021-2026 public record.
