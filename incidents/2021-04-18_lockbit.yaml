description_en: >
  On 18 April 2021 the LockBit ransomware gang used a compromised
  Microsoft Office 365 email account belonging to Merseyrail managing
  director Andy Heath to email Merseyrail employees, BleepingComputer,
  and several UK national newspapers under the subject line "Lockbit
  Ransomware Attack and Data Theft". Merseyrail is the train-operating
  company for the Liverpool City Region — a 50:50 concession joint
  venture between Serco and Transport UK Group (formerly Abellio),
  running urban/commuter rail across 68 stations on the Northern and
  Wirral Lines under a Merseytravel concession. The attacker-sent
  message, impersonating the MD, stated that a preceding weekend IT
  outage had in fact been caused by a ransomware intrusion, that
  employee and customer personal data had been stolen, and linked to
  an image of a single employee's personal details as proof of
  exfiltration. Merseyrail publicly confirmed the cyber-attack on
  28 April 2021, stating that a full investigation had been launched,
  that relevant authorities had been notified, and that the incident
  "does not affect the operation of our services, which will continue
  to run as advertised." The UK Information Commissioner's Office
  (ICO) confirmed that Merseyrail had reported the incident and said
  it was assessing the information provided. Trade press (Computer
  Weekly; The Register) attributed the initial access to a
  compromised privileged Office 365 credential — either spear-phishing
  of the MD or brute-force against an externally-facing account —
  consistent with Darktrace's prior observation that LockBit
  intrusions commonly begin from a single compromised privileged
  credential. No ransom-payment outcome, ransom amount, affected-
  server count, downtime figure or subsequent ICO enforcement action
  is publicly documented, and LockBit never posted Merseyrail data
  on its leak site; the exfiltration claim rests on the attacker-
  sent email and the single-employee image shared in that email.
description_de: >
  Am 18. April 2021 nutzte die Ransomware-Gruppe LockBit ein zuvor
  kompromittiertes Microsoft-Office-365-Konto des Merseyrail-
  Geschäftsführers Andy Heath, um Merseyrail-Mitarbeitende,
  BleepingComputer und mehrere britische Tageszeitungen unter dem
  Betreff „Lockbit Ransomware Attack and Data Theft" anzuschreiben.
  Merseyrail ist die Zugbetreibergesellschaft für die Liverpool City
  Region — ein paritätisches (50:50) Konsortium aus Serco und
  Transport UK Group (vormals Abellio), das im Rahmen einer
  Merseytravel-Konzession den städtischen/regionalen Nahverkehr auf
  den Linien Northern Line und Wirral Line mit 68 Stationen betreibt.
  In der vom Angreifer unter falschem Absender verschickten Nachricht
  wurde behauptet, eine IT-Störung am vorangegangenen Wochenende sei
  in Wahrheit durch einen Ransomware-Einbruch verursacht worden, und
  personenbezogene Daten von Mitarbeitenden und Kunden seien
  entwendet worden; als Beleg war ein Bildausschnitt mit Daten
  einer einzelnen beschäftigten Person beigefügt. Merseyrail
  bestätigte den Angriff öffentlich am 28. April 2021 und erklärte,
  eine umfassende Untersuchung sei eingeleitet, die zuständigen
  Behörden seien benachrichtigt und der Zugbetrieb werde planmäßig
  fortgeführt. Das britische Information Commissioner's Office (ICO)
  bestätigte den Eingang der Meldung und wertete die vorgelegten
  Informationen aus. Fachmedien (Computer Weekly; The Register)
  ordneten den Erstzugriff einem kompromittierten privilegierten
  Office-365-Zugang zu — entweder per Spear-Phishing des MDs oder
  Brute-Force gegen ein extern erreichbares Konto — analog zu
  Darktrace-Vorveröffentlichungen, wonach LockBit-Einbrüche
  regelmäßig mit einem einzigen kompromittierten privilegierten
  Zugangsdatum beginnen. Ein Lösegeldausgang, eine Lösegeldsumme,
  die Anzahl betroffener Systeme, Ausfallzeiten oder eine spätere
  ICO-Sanktion sind nicht öffentlich dokumentiert; LockBit
  veröffentlichte keine Merseyrail-Daten auf seiner Leak-Seite, die
  Exfiltrationsbehauptung stützt sich allein auf die Angreifer-Mail
  und den darin verlinkten Einzel-Screenshot.
