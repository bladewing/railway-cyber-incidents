notes: >
  Identification: the original DZSF raw-data row (ES, 2020-07-23,
  extortion=true, affected_systems=[data]) unambiguously maps to the
  REvil/Sodinokibi leak-site extortion of Administrador de
  Infraestructuras Ferroviarias (ADIF). The REvil "Happy Blog" post
  and first media coverage are dated 22 July 2020 (elhacker.NET,
  MuySeguridad); ADIF's confirmation and the bulk of secondary
  coverage fall on 22-23 July 2020. No other Spanish railway cyber
  incident is publicly attested for this date range.

  Date handling: event_date set to 2020-07-22, the day REvil publicly
  posted ADIF as a victim on its leak site (earliest documented date
  in the public record — elhacker.NET 2020-07-22; Ransom Leaks tweet
  2020-07-22). The DZSF raw row used 2020-07-23, which corresponds to
  ADIF's public confirmation and the first Spanish mainstream coverage
  (MuySeguridad, Xataka, INCIBE-CERT). The actual intrusion date
  (when REvil gained initial access and began exfiltrating) is not
  publicly known and is presumably earlier than either. reported_date
  equals event_date (same-day disclosure via leak site).

  attack_vector kept as `unknown`: no source identifies the specific
  initial-access method. iTWire and Cyble both speculated about a
  Windows privilege-escalation issue, but neither ADIF nor INCIBE-CERT
  confirmed any CVE, vendor advisory, phishing lure or credential
  abuse. Leaving the field as `unknown` is the schema-compliant honest
  position.

  malware: REvil / Sodinokibi, MITRE ATT&CK Software ID S0496,
  family Sodinokibi (aliases: Sodin, REvil). Canonical encryption-
  for-extortion RaaS operation attributed by US government, CrowdStrike,
  SecureWorks (GOLD SOUTHFIELD) and others to Russia-based actors.
  threat_actor_country set to RU per MITRE, Wikipedia, Krebs, Bloomberg
  and 2026 German BKA doxing of group principal Daniil Shchukin as a
  Krasnodar resident — attribution_confidence kept at `reported`
  because no Spanish or EU judicial attribution was issued for this
  specific case at the time; the Russian-origin attribution is the
  industry-wide consensus for the group rather than a Spain-specific
  finding.

  MITRE ATT&CK techniques asserted: T1486 (Data Encrypted for Impact)
  — REvil's canonical payload behaviour; T1567 (Exfiltration Over
  Web Service) — applicable because REvil used its own Tor leak-site
  infrastructure ("Happy Blog") to publish sample data and demand
  payment. Additional REvil-associated techniques (T1190/T1566/T1078
  for initial access, T1059.001 PowerShell, T1562.001 Impair Defenses,
  T1490 Inhibit System Recovery) are deliberately NOT asserted because
  no source ties them to the ADIF intrusion specifically — generic
  REvil TTPs are catalogued at https://attack.mitre.org/software/S0496/
  for reference but only techniques directly observable in public
  reporting of this incident are encoded here.

  motive = financial: textbook double-extortion ransomware (encrypt +
  leak). extortion = true (explicit ransom threat and data-leak
  coercion). data_published = true: REvil posted a sample batch
  (~8 GB of 800 GB claimed) on its leak site as proof.
  data_compromise.customer_data = true (customer phone numbers,
  contact data) and organizational_data = true (employee
  correspondence, HR, financial department, contracts, property
  records, project plans). intellectual_property = false (no
  IP/signalling-system blueprints reported as leaked in the sample
  or in subsequent coverage).

  affected_systems kept as [data] only. ADIF's own statement stresses
  that rail infrastructure and signalling were unaffected; this is
  consistent with REvil's standard playbook of corporate IT
  compromise with data exfiltration rather than OT/rail-operations
  impact. No station IT, passenger information, internal
  communications or rail-operations outage is reported.

  impact.scope = national: ADIF is the sole national infrastructure
  manager for Spain, so a compromise of its corporate IT affects a
  national-scope data set. duration_hours, affected_trains and
  affected_passengers left null because no operational disruption was
  reported (ADIF explicitly denied operational impact) and no financial
  damage figure is public.

  industry_sector = `infrastructure_manager` (exact vocab match —
  ADIF is an EU-mandated unbundled infrastructure manager, legal
  successor to the GIF/Feve/Renfe infrastructure functions created
  2005-01-01 under the EU's rail-sector-unbundling regime).
  operator_type = `public_authority` (state-owned entity reporting to
  Spain's Ministry of Transport and Sustainable Mobility; not an
  "incumbent national operator" because it does not run trains —
  Renfe Operadora does). supply_chain = false (kept; no third-party
  software compromise reported — REvil hit ADIF directly).

  confirmation_status = `confirmed`: ADIF itself confirmed the attack
  publicly on 22-23 July 2020 (quoted verbatim by Spanish and
  international outlets) and INCIBE-CERT (Spain's national
  cybersecurity authority) wrote it up in its Cybersecurity Highlights
  section. This is the highest tier of confirmation available.

  German-language press did not cover the ADIF case independently:
  heise.de, Golem.de, Tagesschau and Süddeutsche searches surfaced
  no ADIF 2020 entry; Railway-News.com carried a general Deutsche
  Bahn WannaCry recap rather than an ADIF piece. The DZSF entry and
  the present record are therefore the main German-language anchors
  for the incident; this is noted rather than treated as evidence of
  a different event. No CVE/CERT advisory was issued — the public
  record relies on INCIBE-CERT's narrative write-up plus extensive
  industry-press coverage.
