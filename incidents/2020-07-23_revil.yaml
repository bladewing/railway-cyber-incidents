description_en: >
  On 22 July 2020 the REvil/Sodinokibi ransomware-as-a-service group
  (MITRE ATT&CK Software S0496; Russia-based, operated by the
  GOLD SOUTHFIELD/UNKN operators) posted an entry on its "Happy Blog"
  dark-web leak site claiming to have compromised Administrador de
  Infraestructuras Ferroviarias (ADIF), Spain's state-owned national
  railway infrastructure manager. REvil asserted it had exfiltrated
  approximately 800 GB of corporate data — including contracts,
  invoices, certificates, internal correspondence, employee and customer
  contact details, financial-department records, property records,
  high-speed hiring-committee contracts and project action plans — and
  published an initial sample batch (reported around 8 GB) as proof
  while threatening a full release and a "third attack" if ADIF did not
  negotiate. ADIF publicly confirmed the ransomware incident on
  22-23 July 2020, stating that it had been "controlled by its internal
  security services" without payment, that no railway infrastructure had
  been affected, and that train operations and signalling services
  continued normally throughout the event. Spain's national
  cybersecurity institute INCIBE/INCIBE-CERT acknowledged the case in
  its Cybersecurity Highlights publication. No CVE, patch advisory or
  specific initial-access vector was publicly disclosed; contemporary
  reporting (iTWire, Cyble) speculated about an unpatched Windows
  privilege-escalation issue but this was not corroborated by ADIF or
  INCIBE-CERT.
description_de: >
  Am 22. Juli 2020 veröffentlichte die Ransomware-as-a-Service-Gruppe
  REvil (auch bekannt als Sodinokibi; MITRE ATT&CK Software S0496;
  russischsprachige Betreiber, GOLD SOUTHFIELD/UNKN) auf ihrer
  Darknet-Leakseite „Happy Blog" einen Eintrag, in dem sie den Angriff
  auf die Administrador de Infraestructuras Ferroviarias (ADIF), den
  staatlichen spanischen Eisenbahninfrastrukturbetreiber, für sich
  reklamierte. REvil gab an, rund 800 GB an Unternehmensdaten
  exfiltriert zu haben — Verträge, Rechnungen, Zertifikate, interne
  Korrespondenz, Mitarbeiter- und Kundendaten, Unterlagen der
  Finanzabteilung sowie Vergabeunterlagen zu Hochgeschwindigkeits­
  ausschreibungen und Projektpläne — und stellte eine erste Teilmenge
  (berichtet rund 8 GB) als Beweis online, verbunden mit der Drohung
  einer vollständigen Veröffentlichung und eines „dritten Angriffs",
  falls ADIF nicht verhandle. ADIF bestätigte den Vorfall am
  22.–23. Juli 2020 öffentlich: Der Angriff sei durch die internen
  IT-Sicherheitsdienste abgefangen worden, es sei kein Lösegeld gezahlt
  worden, die Bahninfrastruktur bleibe unbeeinträchtigt und der
  reguläre Bahnbetrieb gewährleistet. Das spanische nationale
  Cybersicherheitsinstitut INCIBE/INCIBE-CERT nahm den Fall in seine
  „Cybersecurity Highlights" auf. Ein konkreter Einstiegsvektor, CVE
  oder ein Patch-Advisory wurden nicht öffentlich bekannt; Spekulationen
  über eine nicht gepatchte Windows-Rechteausweitungs-Lücke (iTWire,
  Cyble) wurden weder von ADIF noch von INCIBE-CERT bestätigt.
