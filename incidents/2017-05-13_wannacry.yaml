notes: >
  Collateral-damage case: neither Deutsche Bahn nor Russian Railways was
  the specific target of WannaCry; the worm spread indiscriminately via
  the EternalBlue SMBv1 exploit (CVE-2017-0144, MS17-010) after Shadow
  Brokers leaked the underlying NSA toolkit in April 2017. DB's infected
  machines were reported to be running unpatched Windows versions
  (including Windows XP / outdated Windows 7) in protected network
  segments that had not received Microsoft's March 2017 patch.
  Deutsche Bahn publicly stated that safety-critical signalling, train
  control and interlocking systems (LST, ESTW) were not affected and no
  ransom was paid; display-board repairs reportedly took several days to
  complete across the ~5,400 station estate, but most user-facing
  outages were resolved within about 48 hours.
  The BSI (CERT-Bund, arm of the German federal government) issued
  cybersecurity advisories on 13 May 2017; BSI President Arne Schönbohm
  said Germany had "got off lightly" and called the attack a "wake-up
  call". The BKA (Bundeskriminalamt) opened an investigation with
  Europol/Eurojust support.
  Russian Railways (RZD) was among the largest Russian organisations
  that publicly acknowledged WannaCry infections; RZD confirmed the
  event but said it was confined to office computers, did not affect
  rail operations, and was cleaned without paying.
  Attribution: the US White House (18 Dec 2017, Tom Bossert), the UK
  Foreign Office, Canada, Australia, New Zealand and Japan formally
  attributed WannaCry to the DPRK's Lazarus Group; Kaspersky Lab and
  Symantec previously (May 2017) reported code-reuse evidence linking
  WannaCry samples to earlier Lazarus tools (Contopee, Brambul). On
  6 Sep 2018 the U.S. DoJ publicly indicted North Korean programmer
  Park Jin Hyok for conspiracy tied to WannaCry, the 2014 Sony Pictures
  hack and the 2016 Bangladesh Bank heist. Because no court conviction
  has occurred and several researchers (e.g. Cybereason) questioned the
  evidence, `attribution_confidence` is recorded as `reported`, not
  `confirmed`. `motive: financial` reflects the immediate extortion
  modality; the broader state-sponsored context is captured in the
  actor fields.
  MITRE ATT&CK technique mapping follows MITRE's S0366 software page
  (accessed 2026-04-19). The original DZSF entry listed T1190
  (Exploit Public-Facing Application); this has been corrected to
  T1210 (Exploitation of Remote Services), which is the ATT&CK mapping
  for EternalBlue SMB exploitation. `affected_trains` is recorded as 0
  because multiple sources explicitly confirm that no trains or
  safety-critical systems were affected.
