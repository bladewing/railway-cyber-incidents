description_en: >
  On the evening of Friday 12 May 2017 the WannaCry ransomware worm spread
  globally by exploiting the EternalBlue SMBv1 vulnerability (MS17-010) in
  unpatched Windows systems. At Deutsche Bahn AG roughly 450 computers
  became infected, knocking out digital passenger-information displays at
  numerous stations (including Frankfurt Central Station), several ticket
  vending machines, video-surveillance equipment operated on behalf of the
  Federal Police, and all control systems at the DB Netz AG operating
  centre in Hanover. DB emphasised that safety-critical signalling and
  rail operations were not affected and no ransom was paid. Russian
  Railways (RZD / ОАО РЖД) simultaneously reported WannaCry infections on
  office computers on 12 May 2017; RZD President Oleg Belozerov stated
  that the attack was localised, did not impact rail services, and was
  neutralised without paying the ransom.
description_de: >
  Am Abend des Freitags, 12. Mai 2017, verbreitete sich die Ransomware
  WannaCry weltweit, indem sie die SMBv1-Schwachstelle EternalBlue
  (MS17-010) in nicht gepatchten Windows-Systemen ausnutzte. Bei der
  Deutschen Bahn AG wurden rund 450 Rechner infiziert; betroffen waren
  digitale Fahrgastinformationsanzeigen an zahlreichen Bahnhöfen
  (darunter Frankfurt Hauptbahnhof), einzelne Fahrkartenautomaten, das
  Videoüberwachungssystem der Bundespolizei sowie sämtliche Leitsysteme
  der DB Netz AG Betriebszentrale Hannover. Der Zugbetrieb war laut DB
  nicht beeinträchtigt, Lösegeld wurde nicht gezahlt. Auch die
  Russischen Eisenbahnen (RZD / ОАО РЖД) meldeten am 12. Mai 2017
  WannaCry-Infektionen auf Büro-PCs; RZD-Präsident Oleg Beloserow
  erklärte, der Angriff sei lokal begrenzt gewesen, habe den
  Bahnverkehr nicht beeinträchtigt und sei ohne Lösegeldzahlung
  beseitigt worden.
