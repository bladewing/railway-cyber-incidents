description_en: >
  On 12 May 2017, ticket machines and passenger information displays of
  Deutsche Bahn were infected with the WannaCry ransomware as collateral
  damage during the global outbreak exploiting the EternalBlue SMB flaw.
  Train operations themselves were not affected. Russian Railways (RZD)
  also reported WannaCry infections on office systems on the same day.
description_de: >
  Am 12. Mai 2017 wurden Fahrkartenautomaten und Anzeigetafeln der
  Deutschen Bahn im Rahmen der globalen WannaCry-Welle (EternalBlue-SMB)
  als Kollateralschaden infiziert. Der Zugbetrieb war nicht betroffen.
  Auch die Russischen Eisenbahnen (RZD) meldeten am gleichen Tag
  WannaCry-Infektionen auf Büro-IT.
