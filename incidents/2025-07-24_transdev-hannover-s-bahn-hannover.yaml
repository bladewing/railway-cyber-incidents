description_en: >
  On 24 July 2025, a cyberattack disrupted the public website of
  Transdev Hannover GmbH (operator of S-Bahn Hannover in the Hannover
  region of Lower Saxony, Germany), rendering it unreachable for
  several hours. No operational impact on train services was
  reported. This was the second cyber incident to affect the same
  website within a month, following an earlier incident on 9 July
  2025 (tracked as a separate entry). No threat actor claimed
  responsibility publicly.
