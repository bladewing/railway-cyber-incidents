description_en: >
  On the morning of Thursday 19 December 2024, Pittsburgh Regional
  Transit (PRT) — the public authority operating light-rail ("the T"),
  bus and incline services in Allegheny County, Pennsylvania —
  experienced a ransomware intrusion that disrupted the operations-
  control applications used by dispatchers to track vehicles on the
  light-rail network. Light-rail services ran with delays exceeding
  20 minutes until manual workarounds were put in place; bus
  operations were largely unaffected. PRT initially attributed the
  issue to a "computer glitch" but confirmed the ransomware nature of
  the incident in a public notice on 23 December 2024. The customer-
  facing telephone system, real-time arrival boards and some
  internal corporate systems were also intermittently affected during
  the response. On 8 January 2025 PRT filed a supplementary breach
  notification confirming that personal data belonging to 69 current
  employees, former employees and job applicants had been accessed.
  No ransomware group publicly claimed the attack and no leak-site
  listing has been observed as of April 2026.
description_de: >
  Am Morgen des Donnerstag, 19. Dezember 2024, kam es bei Pittsburgh
  Regional Transit (PRT) — der öffentlich-rechtlichen Verkehrsbehörde
  für Stadtbahn ("the T"), Bus und Standseilbahn im Allegheny County,
  Pennsylvania — zu einem Ransomware-Einbruch, der die
  Leitstandsoftware für die Fahrzeugverfolgung im Stadtbahnnetz
  beeinträchtigte. Die Stadtbahn fuhr bis zur manuellen Ersatzsteuerung
  mit über 20 Minuten Verspätung; der Busbetrieb war weitgehend
  unberührt. PRT sprach zunächst von einer "Computerstörung", bestätigte
  die Ransomware-Natur aber am 23. Dezember 2024 öffentlich. Auch
  das Telefonsystem, Echtzeit-Abfahrtsanzeigen und einzelne interne
  Systeme waren zeitweilig betroffen. Am 8. Januar 2025 meldete PRT
  nach, dass personenbezogene Daten von 69 aktiven und ehemaligen
  Beschäftigten sowie Bewerbenden abgeflossen seien. Keine
  Ransomware-Gruppe hat den Angriff bislang öffentlich bekannt gemacht;
  Leak-Site-Einträge sind bis April 2026 nicht bekannt.

