description_en: >
  On 21 September 2021 the departmental portal `www.cnbnc.in` of the
  South Western Railway (SWR) zone of Indian Railways was defaced. Per
  The New Indian Express (Lalitha 2021) the site is run by SWR's
  Personnel Department (the article's lede calls it the "construction
  department" — an internal inconsistency) and holds "details of
  employees, policy circulars, non-gazetted orders, rest house allotment
  and other details". The defacement left a verbatim message signed by
  "Islamic State": "Islamic State has hacked this site. Message to the
  Alliance: Your government, military, important secured sites are under
  our cyber attack. As long as you fight the Islamic State, your failed
  system will continue to be hacked." The New Indian Express describes
  the actor only as "an extremist organisation"; no formal attribution
  by SWR, Indian police, CERT-In or any other authority is reported.
  SWR General Manager Sanjeev Kishore told the paper "The software
  handling our tenders and other operations are quite secure. We have
  decided to close it down now" — implying the portal was taken offline
  around the reporting date (01 October 2021, ~10 days after the
  defacement). An official SWR statement added only that "Our cyber cell
  in the Bengaluru Division is aware of the issue". An unnamed railway
  source told the paper that "None of the data has been stolen" — the
  basis for the no-exfiltration claim is not documented. The article
  also records that this was the second such attack on `cnbnc.in`; the
  first occurred in 2017 (no further detail given). No other SWR or
  Indian Railways systems were reported affected; train operations,
  station IT, payment/ticketing (IRCTC, UTS), radio communications,
  internal train tracking and signalling were not involved. The DZSF
  AP1 project report (Möller, Iffländer, Nord et al. 2022, section
  2.8.7 "Angriff auf South Western Railway (Indien)") is the only other
  attested source of this incident; it paraphrases the defacement as
  coming from "eine islamistische Organisation" and also states data
  theft was ruled out. Extensive further searches in English, German
  and Hindi across trade press, CERT advisories, Indian national and
  regional newspapers, MEMRI Cyber & Jihad Lab, SITE Intelligence, the
  South Asia Terrorism Portal, and DZSF-independent academic venues
  returned no second independent corroboration. The incident is
  therefore attested by one mainstream-media source (Lalitha / TNIE)
  plus the DZSF project lineage. Because this is one short of the
  enrichment pass's ≥ 2 independent-non-DZSF threshold,
  `confirmation_status: reported`, `attribution_confidence: reported`
  and `needs_review: true` are retained and a standing escalation entry
  remains in ESCALATIONS.md.
description_de: >
  Am 21. September 2021 wurde das Abteilungs-Portal `www.cnbnc.in` der
  Zone South Western Railway (SWR) der Indian Railways defaced. Laut
  The New Indian Express (Lalitha 2021) wird die Seite von der
  SWR-Personalabteilung betrieben (die Artikel-Lede spricht
  widersprüchlich von der „Construction Department") und enthält
  „Mitarbeiterdaten, Richtliniensammlungen, nicht-gazettierte
  Dienstanweisungen, Rasthaus-Zuweisungen und weitere Details". Auf der
  Webseite wurde eine wörtliche, vom „Islamischen Staat" signierte
  Botschaft hinterlassen: „Islamic State has hacked this site. Message
  to the Alliance: Your government, military, important secured sites
  are under our cyber attack. As long as you fight the Islamic State,
  your failed system will continue to be hacked." Die New Indian
  Express beschreibt den Angreifer lediglich als „eine extremistische
  Organisation"; eine formelle Zuordnung durch SWR, die indische
  Polizei, CERT-In oder sonstige Behörden ist nicht berichtet. GM SWR
  Sanjeev Kishore äußerte gegenüber der Zeitung „The software handling
  our tenders and other operations are quite secure. We have decided to
  close it down now" — was impliziert, dass das Portal um den
  Berichtstag (01. Oktober 2021, ca. 10 Tage nach dem Defacement) vom
  Netz genommen wurde. Die offizielle SWR-Stellungnahme beschränkte
  sich auf den Hinweis, „unsere Cyber-Zelle in der Bangalore Division"
  sei „mit der Sache befasst". Eine namentlich nicht genannte Quelle
  aus dem Bahnumfeld erklärte, „keine Daten wurden entwendet" — die
  Grundlage für diese Aussage ist nicht dokumentiert. Der Artikel
  vermerkt ferner, dass `cnbnc.in` zum zweiten Mal angegriffen wurde;
  der erste Vorfall datierte auf 2017 (ohne weitere Details). Kein
  weiteres SWR- oder Indian-Railways-System war betroffen; Zugbetrieb,
  Bahnhofs-IT, Ticketsysteme (IRCTC, UTS), Funkkommunikation,
  Zugverfolgung und Leit-/Sicherungstechnik blieben unbeeinflusst. Der
  DZSF-AP1-Zwischenbericht (Möller, Iffländer, Nord et al. 2022, Abschn.
  2.8.7 „Angriff auf South Western Railway (Indien)") — der einzige
  weitere Anker des Vorfalls — fasst den Angriff dahingehend zusammen,
  dass „eine islamistische Organisation" die Verantwortung übernommen
  habe und Datendiebstahl ausdrücklich ausgeschlossen wurde. Weitere
  Recherchen in englischer, deutscher und hindi-sprachiger
  Fach- und Tagespresse sowie bei MEMRI, SITE, SATP und
  DZSF-unabhängigen akademischen Foren ergaben keine zweite
  unabhängige Quelle. Der Vorfall ist damit durch einen mainstream-
  journalistischen Artikel (Lalitha/TNIE) plus die DZSF-Linie belegt —
  eine Quelle weniger als die ≥ 2-Schwelle dieser
  Anreicherungsrunde. `confirmation_status: reported`,
  `attribution_confidence: reported` und `needs_review: true` werden
  daher beibehalten; der Eintrag bleibt in ESCALATIONS.md offen.
