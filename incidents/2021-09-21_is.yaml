target_organization: >-
  South Western Railway (SWR) — a zone of Indian Railways, owned by the Ministry
  of Railways of the Government of India; headquartered at Hubballi (Hubli),
  Karnataka. The specific web property affected was `www.cnbnc.in`, whose
  Google-indexed title is "Personnel Department Construction Organisation,
  South Western Railway" — i.e. the Construction Organisation unit within the
  SWR Personnel Department. This reconciles the TNIE article's internal
  inconsistency (lede says "construction department", body says "Personnel
  Department") — the portal belongs to both. It hosted "details of employees,
  policy circulars, non-gazetted orders, rest house allotment and other
  details" per Lalitha 2021. GM SWR at the time of the incident was Sanjeev
  Kishore (appointed July 2021).
