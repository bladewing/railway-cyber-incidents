threat_actor: >-
  Self-identified as "Islamic State" on the defacement page. The verbatim
  message left by the attackers (quoted in Lalitha 2021) read "Islamic State
  has hacked this site. Message to the Alliance — Your government, military,
  important secured sites are under our cyber attack. As long as you fight
  the Islamic State, your failed system will continue to be hacked." The
  New Indian Express describes the actor only as "an extremist organisation";
  no formal attribution by SWR, police, CERT-In or any authority is reported.
  The self-identification cannot be independently verified and may be a
  pretender; no specific sub-group (ISHD, United Cyber Caliphate, ISIS Cyber
  Caliphate, IS Khorasan cyber wing) is named. The DZSF Rohdaten record
  "IS?" with a trailing question mark is consistent with the article's
  framing.
