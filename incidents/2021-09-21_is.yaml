last_updated: '2026-04-19'
notes: >
  Identification. The DZSF raw-data row (20220824_Rohdaten_Cyber_Angriffe.xlsx,
  row 31: event 2021-09-21, country "Indien", Bestätigung=Ja,
  Supply-Chain=Nein, Angriffsmittel=empty, Malware=empty, Erpressung=Nein,
  Täter="IS?", Webseite=1, all other systems=0) maps onto the incident
  described in detail in the DZSF-internal AP1 project report
  (20220318_Bericht_Cyberanschläge,li.docx) at section 2.8.7 "Angriff auf
  South Western Railway (Indien)". The report paragraph reads: "Am 21.
  September 2021 wurde die Webseite www.cnbnc.in der indischen
  Bahngesellschaft South Western Railway angegriffen. Nach offiziellen
  Angaben wurde eine islamistische Organisation dafür verantwortlich
  gemacht, die eine Warnung bezüglich weiterer Cyber-Angriffe auf die
  indische Infrastruktur hinterließ. Außer der Webseite waren keine
  weiteren Systeme betroffen. Insbesondere wurde Datendiebstahl
  ausgeschlossen." Subsequent DZSF publications reduced this to a single
  row in Table 2 of the EI 8/2023 summary article (Iffländer, Buder,
  Buchetmann 2023, p. 18) with "21.09.2021 / Indien / Bestätigung x /
  Angriffsmittel-Kategorie: unklar / Täter: IS / Webseite=x". No other
  Indian railway cyber incident is publicly dated 21 September 2021.

  Interpretation of "IS". Post-batch the Lalitha / New Indian Express
  article surfaced the verbatim defacement text: "Islamic State has
  hacked this site. Message to the Alliance — Your government,
  military, important secured sites are under our cyber attack. As
  long as you fight the Islamic State, your failed system will continue
  to be hacked." The attackers therefore self-identified as "Islamic
  State" on the page itself. This is stronger than the DZSF paraphrase
  ("islamistische Organisation") but it is still a self-claim, not a
  third-party attribution: TNIE's lede only calls them "an extremist
  organisation" and no SWR, police or CERT-In formal attribution is
  reported. The draft therefore records the self-claim in the
  `threat_actor` field while keeping `attribution_confidence: reported`
  — appropriate for a publicly-made self-claim that has not been
  validated forensically. No specific sub-group (IS Hacking Division,
  United Cyber Caliphate, ISIS Cyber Caliphate, IS Khorasan cyber
  wing) is named either by the attackers or by any source; the DZSF
  Rohdaten cell records the attacker as "IS?" with a trailing
  question mark that is consistent with this uncertainty.

  Independent corroboration. The initial enrichment pass found zero
  independent non-DZSF sources despite five rounds of search (≈ 25
  distinct queries across English, German and Hindi terms, plus direct
  domain / archive.org / CSIS / KonBriefing / Recorded Future / CloudSEK /
  Threatpost / BleepingComputer / The Register / Hackread / CyberExpress /
  CyFirma / MEMRI / SATP / SITE Intelligence / CRITIS 2022 proceedings /
  heise / Golem / T-Online / Tagesschau / BSI Lagebericht / CERT-In /
  ENISA). On maintainer follow-up the DZSF AP1 report's footnote [59]
  was recovered and the underlying news source identified: S. Lalitha,
  "South Western Railway website hacked, no data stolen", The New Indian
  Express (Karnataka edition), 01 October 2021 — now added to `sources:`.
  The URL as copy-pasted from the DZSF bibliography had the German word
  "Webseite" inside the slug instead of "website" (a find-replace
  artifact in the DZSF manuscript); the real URL uses "Oct" (capitalised)
  and concatenates "railwaywebsite" without a hyphen — defeating the
  enrichment subagent's search indexing. The full article was retrieved
  on 2026-04-19 and its facts integrated into the draft:
  `www.cnbnc.in` is confirmed as a SWR-operated departmental portal
  (Lalitha's article attributes it to the Personnel Department in the
  body and to the Construction Department in the lede — an internal
  inconsistency — but explicitly frames it as "run by" SWR).
  The earlier subagent speculation that `CNBNC` read as `Kanpur Central
  (CNB) + North Central Railway (NCR)` and was therefore inconsistent
  with an SWR property turns out to be coincidental — the article
  documents two prior defacement incidents of the same domain (the
  earlier one in 2017) and treats SWR ownership as settled. The domain
  remains absent from the Wayback Machine but is no longer an
  independent red flag. With one mainstream-media non-DZSF source
  (Lalitha / TNIE) added, the incident is no longer DZSF-only-attested;
  the count nevertheless remains below the ≥ 2 independent-non-DZSF
  threshold used uniformly in this enrichment pass, so
  `needs_review: true` is retained and the escalation entry remains
  open (now framed as a one-source-short borderline case).

  Dates. event_date = 2021-09-21 kept exactly as in DZSF (and explicitly
  spelled out in the AP1 narrative "Am 21. September 2021"); precision =
  day. reported_date set to 2021-09-21 (same day — no other reporting
  date is available and the DZSF material implies same-day awareness).

  target_organization = South Western Railway (SWR). A zone of Indian
  Railways, established 1 April 2003 out of the southern portion of the
  Central Railway and the south-western portion of the Southern Railway.
  Headquartered at Hubballi (Hubli), Karnataka. Three operating
  divisions: Bangalore (SBC), Hubli (UBL), Mysuru (MYS). Reports to the
  Railway Board / Ministry of Railways, Government of India; the
  General Manager is an Indian Railway Service cadre officer. SWR is
  not a privatised train-operating company — it is a zone of the
  monolithic Indian-Railways national incumbent; therefore
  operator_type = `incumbent`. The domain www.cnbnc.in cited in the
  DZSF report is not a known SWR URL; whether it was an ancillary
  microsite, a contractor portal or a mis-transcription could not be
  determined.

  industry_sector = `regional_passenger`. SWR is predominantly a
  mixed passenger/freight regional zone of Indian Railways, operating
  regional/intercity passenger services and associated freight on its
  portion of the IR network. In the repo's enumeration
  (`regional_passenger` vs `long_distance_passenger` vs `freight` vs
  `infrastructure_manager` vs `urban_transit`) the best match for a
  zone of a monolithic national incumbent is `regional_passenger`;
  `other` is reserved for genuinely non-rail or genuinely mixed
  entities (rolling-stock manufacturers, research institutes, etc.).

  operator_type = `incumbent`. SWR is a Ministry-of-Railways zone of
  the Indian-Railways national incumbent, i.e. directly analogous to
  DB-Netz / DB-Regio under Deutsche Bahn, SNCF Réseau under SNCF, or
  Eesti Raudtee under the Estonian state. `public_authority` is
  reserved in the repo's usage for bodies like TfL, TTC or MTA
  (public-transport authorities that contract for services);
  `incumbent` is the correct tag for a national-railway zone.

  attack_vector = `unknown`. The DZSF narrative records that the
  website was "angegriffen" (attacked) but does not specify the
  initial-access technique — no phishing lure, exploited CVE,
  credential-theft, brute-force, insider or supply-chain vector is
  named. `unknown` is therefore preferred over invention.

  supply_chain = false. Nothing in the DZSF material suggests a
  supplier-side compromise; the attack is framed as directly targeting
  an SWR-associated website.

  malware = null. No malware name, family or hash is documented in
  the DZSF material. Website defacements often do not involve
  deployable malware (they can be achieved through CMS/credential
  compromise or web-shell plant-and-overwrite flows), so leaving
  `malware: null` is both conservative and consistent with the
  source.

  extortion = false, data_published = false. The DZSF narrative is
  explicit that data theft was ruled out ("Insbesondere wurde
  Datendiebstahl ausgeschlossen") and makes no mention of a
  monetary demand, ransom message or leak-site listing.

  motive = `hacktivism`. The attacker's stated purpose — leaving a
  warning on the page about "further cyber-attacks on Indian
  infrastructure" — is ideological / political signalling rather
  than financial extortion or state-level espionage, so `hacktivism`
  is the closest fit in the vocabulary. `mixed` or `disruption`
  were considered but the narrow single-website impact argues
  against a broader disruption motive, and there is no evidence of
  a parallel financial angle to justify `mixed`.

  mitre_attack_techniques = [T1491.002]. T1491.002 "Defacement:
  External Defacement" is the canonical MITRE ATT&CK technique for
  the publicly-visible modification of an external website with
  messaging content, matching the DZSF description exactly.
  T1491.001 "Internal Defacement" is rejected (the DZSF report
  describes a public / external website). No credential-access,
  execution, exfiltration or impact-beyond-defacement technique is
  documented, so the list is kept to the single external-defacement
  tag rather than speculating about the initial-access vector.

  threat_actor = "Unidentified Islamist organisation (per DZSF;
  originally recorded in the DZSF Rohdaten as 'IS?', i.e. an
  uncertain 'Islamic State'-class attribution; no specific group
  name, leak-site handle or self-branding is documented in the DZSF
  narrative and no independent public source names the group)".
  threat_actor_country = null (no country attribution is made in any
  DZSF material). attribution_confidence = `reported` (following the
  DZSF narrative phrasing "Nach offiziellen Angaben"); this is
  softer than `confirmed` because the underlying official statement
  could not be located, and harder than `suspected` because the
  DZSF's own narrative presents the attribution as a publicly-made
  claim rather than their own conjecture.

  confirmation_status = `reported` (downgraded from the original DZSF
  import value `confirmed`). Although the DZSF raw-data row records
  "Bestätigung = Ja", the complete absence of any independent
  corroborating source (press, CERT advisory, operator statement)
  for this incident means the draft should be conservative about
  confirmation. The downgrade from `confirmed` to `reported` reflects
  the fact that the only public-record anchor is the DZSF project
  itself.

  affected_systems = [`website`] — kept as the DZSF row had it. No
  other system is attested.

  impact.scope = `regional` (SWR footprint: Karnataka / Goa / southern
  Maharashtra / northern Tamil Nadu / sliver of AP — a multi-state
  regional zone, not a single-station/local footprint, and not the
  national footprint of all of Indian Railways). duration_hours left
  `null` — the DZSF material does not quantify how long the defaced
  page remained up. affected_trains = 0 (train operations were
  explicitly unaffected — only the website). affected_passengers,
  monetary_damage_eur: null. data_compromise.* = false across the
  board, consistent with the DZSF explicit statement that data theft
  was ruled out.

  Sources — the DZSF generic URL is retained as the primary citation
  (the AP1 report itself is DZSF-internal project material and not
  publicly downloadable; it can be obtained from DZSF on request via
  Forschung@dzsf.bund.de). The public-record DZSF anchor is the 2023
  EI / Eurailpress summary article (Iffländer, Buder, Buchetmann 2023,
  EI 8/2023) which lists the incident in Table 2. The incident-
  corroborating independent non-DZSF source is the 01 October 2021
  New Indian Express article by S. Lalitha cited as footnote [59] of
  the DZSF AP1 report — added to `sources:` on the post-batch update.
  Three further non-DZSF context URLs (Wikipedia SWR article, official
  SWR zonal portal, MITRE ATT&CK T1491.002) remain as structural
  context — they do NOT corroborate the incident itself and are
  flagged as context-only in their publisher strings. The incident-
  substantiating independent-non-DZSF-source count is therefore ONE
  (Lalitha/New Indian Express); `needs_review: true` is kept because
  the count is still below the ≥ 2 threshold.

  needs_review flag retention. Per the project's enrichment protocol,
  flipping `needs_review` from true → false requires ≥ 2 independent
  non-DZSF sources. This incident has one. needs_review is therefore
  kept at `true` and an escalation entry remains open in
  `incidents/.drafts/ESCALATIONS.md` (now framed as a one-source-short
  borderline case rather than a zero-source DZSF-only case).
  contributors is extended with "Lukas Iffländer" per the protocol's
  attribution rule — both ≥ 1 new non-DZSF incident-substantiating
  source (Lalitha 2021) and ≥ 3 fields moved off null / defaults are
  satisfied after the post-batch update.

  Vocabulary. No new vocabulary values are required for this draft.
  industry_sector `regional_passenger`, operator_type `incumbent`,
  attack_vector `unknown`, motive `hacktivism`, affected_systems
  `website`, impact.scope `regional`, source type `academic_paper`
  and `official_statement` and `other` are all existing values.
