notes: >
  Single-source, claimed-but-unverified incident. Metrospetstekhnika
  itself is not a transit operator but a supplier to Russian metro
  operators, so the direct impact scope is limited to the supplier's
  corporate data. event_date uses month precision because the exact
  breach date was not disclosed; the claim emerged mid-to-late April
  2022.
