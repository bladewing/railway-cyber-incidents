description_en: >
  In April 2022, the Anonymous-affiliated hacktivist collective GhostSec
  claimed to have breached Metrospetstekhnika, a Russian contractor
  providing maintenance equipment and services to metro (subway)
  systems. GhostSec stated the intrusion was conducted as part of the
  #OpRussia campaign launched by Anonymous in response to the Russian
  invasion of Ukraine. The group claimed to have exfiltrated internal
  corporate data and published samples on its public channels. No
  operational impact on Russian metro services was publicly reported.
  The breach was not independently verified by the victim organisation
  or by Russian authorities.
