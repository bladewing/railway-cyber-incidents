description_en: >
  On 7 April 2025, attackers compromised the IT infrastructure of
  Richard Scholz GmbH, a Berlin-based IT service provider contracted by
  Berliner Verkehrsbetriebe (BVG) - the public transport operator of
  the city of Berlin - and exfiltrated personal data of approximately
  180,000 BVG subscription customers. Exposed data included names,
  postal addresses, email addresses, customer numbers, and in some
  cases subscription contract numbers; according to the forensic
  assessment published by BVG, no dates of birth, bank account
  details, passwords, or contract financial details were accessed.
  BVG was informed of the incident by its service provider at the
  end of April 2025. BVG reported the data breach to the Berlin
  Commissioner for Data Protection and Freedom of Information on
  30 April 2025 and publicly disclosed the incident via a statement
  on 15 May 2025. Bus, tram, and U-Bahn services were not affected
  by the incident.
