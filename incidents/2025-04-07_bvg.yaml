notes: >
  Supply-chain incident: the directly compromised organisation was
  Richard Scholz GmbH (an IT service provider), not BVG; however,
  the affected data subjects were BVG subscription customers, which
  places the incident in scope for the railway/urban-transit dataset.
  BVG is classified as public_authority (owned by the State of
  Berlin). Renamed from the original discovery-pipeline draft slug
  "2025-05_bvg" (which reflected the public disclosure month) to
  "2025-04-07_bvg" once the actual attack date (7 April 2025) at
  Richard Scholz was identified; reported_date preserves the public
  disclosure date of 15 May 2025. No ransomware or extortion
  publicly reported; data-theft-only incident.
