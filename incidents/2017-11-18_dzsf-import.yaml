description_en: >
  Over the weekend of 18-19 November 2017, the Sacramento Regional Transit
  District (SacRT, operator of Sacramento's light-rail and bus network) was
  hit by a two-stage intrusion. On Saturday 18 November an attacker defaced
  the agency's public website with a message posing as a "good hacker"
  offering to help fix vulnerabilities (contact address
  nesddjerfn@protonmail.com); when SacRT technicians investigated on Sunday
  19 November, the intruder wiped approximately 30 million of SacRT's 100
  million files from its virtual servers, destroying programs used for
  employee dispatch and bus-route assignment, and then sent a Facebook
  message demanding a 1 BTC (~US$7,000–8,000) ransom ("hello, I will always
  attack your website, we are hackers. we can do everything. Pay us now to
  stop attacking"). SacRT refused to pay, took its website and credit-card
  payment systems offline, restored data from daily backups, and worked
  with the U.S. Department of Homeland Security on the investigation; bus
  and light-rail operations continued uninterrupted (staff reverted to
  manual dispatch) and no customer data was stolen.
description_de: >
  Am Wochenende vom 18./19. November 2017 wurde der Sacramento Regional
  Transit District (SacRT, Betreiber des Stadtbahn- und Busnetzes von
  Sacramento) Opfer eines zweistufigen Angriffs. Am Samstag, 18. November,
  verunstaltete ein Angreifer die öffentliche Website der Agentur mit einer
  Nachricht, die sich als "guter Hacker" ausgab und unter der Adresse
  nesddjerfn@protonmail.com Hilfe bei der Behebung von Schwachstellen
  anbot; als SacRT-Techniker am Sonntag, 19. November, den Schaden
  untersuchten, löschte der Eindringling rund 30 Millionen der insgesamt
  100 Millionen Dateien von den virtuellen Servern und damit Programme für
  die Personalausteilung und Busrouten-Zuweisung. Anschließend forderte er
  per Facebook-Nachricht ein Lösegeld von 1 BTC (ca. 7.000–8.000 US-$) an.
  SacRT zahlte nicht, nahm Website und Kreditkartenzahlung offline, stellte
  die Daten aus den täglichen Backups wieder her und arbeitete bei der
  Ermittlung mit dem US-Heimatschutzministerium (DHS) zusammen; der Bus-
  und Stadtbahnbetrieb lief ununterbrochen weiter (Disposition manuell),
  und Kundendaten wurden nicht entwendet.
