notes: >
  The DZSF raw-data row dated 2017-11-18 (US, extortion=true, motive
  financial, affected_systems website+data, confirmation=confirmed) matches
  the well-documented Sacramento Regional Transit (SacRT) intrusion of
  the 18-19 November 2017 Thanksgiving-week weekend. The DZSF stub is
  therefore resolved to SacRT. Chronology (from Mark Lonergan, SacRT COO,
  quoted in The Washington Times, Route Fifty, Government Technology and
  Bleeping Computer): Saturday 2017-11-18 — website defaced with a message
  pretending to be a white-hat ("I'm sorry to modify the home page, i'm
  good hacker, i I just want to help you fix these vulnerability …")
  together with the contact address nesddjerfn@protonmail.com. Sunday
  2017-11-19 — when SacRT IT staff logged in to investigate, the attacker
  wiped ~30 million of 100 million files from virtual servers and sent a
  Facebook private message demanding 1 BTC (≈US$7,000–8,000 depending on
  exchange rate at the time). SacRT refused, restored roughly 80 % of
  internal data from daily backups by Tuesday 2017-11-21 and recovered
  more over the following days; the remaining systems were fully back
  within about a week. Attack vector is recorded as `unknown`: no SacRT,
  DHS or vendor statement has publicly disclosed how the attacker gained
  initial access — the defacement itself could only have occurred after
  write access to the web server was obtained, and contemporaneous
  analysts (Tripwire, Help Net Security) speculated on unpatched
  internet-facing systems but did not confirm. `threat_actor` and
  `threat_actor_country` are `null`: no named individual or group has
  been publicly attributed; the nesddjerfn@protonmail.com address is a
  pseudonymous contact only. `mitre_attack_techniques` kept `null`
  because no primary / CERT / vendor source formally maps this incident
  into the ATT&CK framework; the technique inventory that best fits the
  public evidence would be T1491.002 (External Defacement), T1190
  (Exploit Public-Facing Application — suspected) and T1485 (Data
  Destruction), but that mapping is the subagent's inference rather than
  a cited one and per the codebook is therefore not committed. No
  malware family was publicly named (the "ransomware" framing in press
  coverage refers to the extortion demand; the destructive payload was a
  wiper rather than an encryptor), so `malware: null`. `data_published`
  is false and `customer_data` is false per SacRT's Twitter statement
  ("Network damage was limited, and no personal data was compromised");
  internal operational programs / dispatch data were destroyed rather
  than exfiltrated, so `organizational_data` is set to true.
  `affected_systems` expanded from the DZSF stub's [website, data] to
  also include `payment_system` (Connect Card credit-card top-ups were
  taken offline for several days) and `internal_communication` (SacRT
  confirmed internal dispatch/operations systems were disrupted);
  `rail_operations` is deliberately excluded because bus and light-rail
  service continued uninterrupted. `impact.scope` is `local` (single
  agency, single metropolitan area); `impact.magnitude.affected_trains`
  is set to 0 per SacRT's own statement; monetary damage is not
  quantified in any public source (the $8k ransom was never paid and
  remediation cost was not disclosed), so `monetary_damage_eur` is null.
