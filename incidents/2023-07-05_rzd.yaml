notes: >
  Cyber-Partisans have conducted repeated attacks against RZD and
  Belarusian Railway infrastructure since 2022; this entry covers the
  specific 5 July 2023 incident. The Record headline describes the
  attackers as "Ukrainian hackers", but subsequent reporting
  consistently attributes this operation to the Belarusian
  Cyber-Partisans collective (which operates in coordination with
  Ukrainian hacktivist groups).
