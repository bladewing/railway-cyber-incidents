description_en: >
  On 5 July 2023, the Belarusian hacktivist collective Cyber-Partisans
  claimed responsibility for an attack that disrupted the public
  website and online ticket-purchasing systems of Russian Railways
  (RZD / РЖД). Passengers reportedly could not buy tickets online
  for a period during the outage; rail operations themselves were not
  affected. The group framed the operation as part of its ongoing
  hacktivist campaign against Russian and Belarusian state
  infrastructure in response to the Russian invasion of Ukraine.
