description_en: >
  In a report published on 11 February 2016, Trend Micro researcher Kyle
  Wilhoit disclosed that samples of the KillDisk disk-wiping malware — and
  almost certainly the BlackEnergy 3 backdoor used to deliver it — had been
  found in the networks of a large Ukrainian railway company that is part of
  the national Ukrainian railway system, alongside a Ukrainian mining
  company. The KillDisk binary recovered from the rail operator (tsk.exe,
  SHA-1 f3e41eb94c4d72a98cd743bbb02d248f510ad925) matched the sample used
  in the 23 December 2015 attacks on the Ukrainian power distribution
  companies Prykarpattyaoblenergo, Kyivoblenergo and Chernivtsioblenergo,
  and the malware communicated with the same command-and-control
  infrastructure, leading Trend Micro to conclude that the same threat
  actor — widely attributed to the Russian state-linked Sandworm Team
  (Seashell Blizzard / APT44, GRU Unit 74455) — was behind the intrusions.
  Trend Micro characterised the railway and mining infections as apparently
  preliminary or test infections rather than a destructive disruption, and
  no public service outage was reported at the railway as a result.
description_de: >
  In einem am 11. Februar 2016 veröffentlichten Bericht meldete der
  Trend-Micro-Forscher Kyle Wilhoit, dass bei einem großen ukrainischen
  Eisenbahnunternehmen, das Teil des nationalen Schienennetzes der Ukraine
  ist (d. h. der Ukrzaliznytsia / der Ukrainischen Staatlichen Verwaltung
  für Eisenbahntransport), sowie bei einem ukrainischen Bergbaukonzern
  Proben der wiper-Malware KillDisk und sehr wahrscheinlich der
  Backdoor-Malware BlackEnergy 3 gefunden wurden. Die beim Bahnbetreiber
  sichergestellte KillDisk-Datei (tsk.exe, SHA-1
  f3e41eb94c4d72a98cd743bbb02d248f510ad925) stimmte mit derjenigen
  überein, die bei den Angriffen vom 23. Dezember 2015 auf die
  ukrainischen Stromverteiler Prykarpattyaoblenergo, Kyivoblenergo und
  Chernivtsioblenergo eingesetzt worden war, und kommunizierte mit
  derselben Command-&-Control-Infrastruktur. Trend Micro schloss daraus,
  dass derselbe Bedrohungsakteur — weithin der russlandnahen Gruppe
  Sandworm Team (Seashell Blizzard / APT44, GRU-Einheit 74455)
  zugeschrieben — auch hinter den Eindringversuchen bei Bahn und Bergbau
  stand. Die Infektionen wurden als mutmaßlich vorbereitende oder
  Test-Infektionen gewertet; eine öffentliche Betriebsstörung beim
  Bahnbetreiber wurde nicht gemeldet.
