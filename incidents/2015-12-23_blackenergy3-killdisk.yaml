notes: >
  The railway operator was never publicly named by Trend Micro, who
  described it only as "a large Ukrainian railway company that is part of
  the country's national railway system" — i.e. one of the six regional
  railways under the state holding Ukrzaliznytsia (Ukrainian State
  Administration of Railway Transport). A separate Ukrainian-language
  source (CyS Centrum, 6 January 2016) states that as early as 12 May
  2014 BlackEnergy-laden spear-phishing emails were delivered to all six
  Ukrzaliznytsia-managed railways, which helps explain the foothold that
  later produced the 2015 KillDisk findings. Trend Micro reported that
  the rail and mining infections appeared to be preliminary or test
  deployments rather than a destructive event: unlike at the three power
  distributors, there is no public report of operational disruption at
  the railway on or around 23 December 2015. The event_date kept here
  (2015-12-23) matches the DZSF import and the reference point used
  across the industry to cluster these KillDisk samples with the power
  grid campaign; the exact date on which the sample was observed on
  railway systems was never disclosed and the Trend Micro report only
  bounds it to "November and December 2015". The name "Sandwurm" in the
  DZSF raw data is the German-language rendering of Sandworm Team
  (MITRE G0034; aliases include Seashell Blizzard, APT44, Voodoo Bear,
  IRON VIKING, Telebots, ELECTRUM). Sandworm attribution is widely
  reported (iSight Partners, ESET, Trend Micro) but for this specific
  rail intrusion the link is inferred from shared C2 infrastructure and
  matching binaries, not from a confirmation by the affected operator,
  hence attribution_confidence: reported.
