notes: >
  industry_sector=other because FS is a holding group covering passenger
  (Trenitalia), freight (Mercitalia), and infrastructure (RFI); the
  attack affected the shared corporate IT stack rather than any single
  operating segment. attack_vector=phishing because Italian press
  (Open, Cybersecurity 360) reported that the malware was delivered via
  a malicious email attachment opened by an administrator; primary
  sources do not confirm this definitively so attribution_confidence
  stays at reported. Hive was a prolific RaaS operation subsequently
  dismantled by a coordinated FBI/BKA operation in January 2023
  (decryption keys seized by FBI covertly from mid-2022). Rail traffic
  was not interrupted; impact was confined to station-IT and back-office
  systems, so rail_operations is not tagged.
