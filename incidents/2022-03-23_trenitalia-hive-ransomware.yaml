description_en: >
  On the morning of 23 March 2022, Ferrovie dello Stato Italiane (FS)
  detected a ransomware intrusion affecting subsidiaries Trenitalia and
  Rete Ferroviaria Italiana (RFI). Self-service ticket machines, station
  ticket offices and the "Freccia Lounges" were knocked offline across
  Italy; online sales via trenitalia.com initially remained available and
  rail traffic itself continued to run, with station staff manually
  announcing arrivals and departures using megaphones. Investigators
  attributed the attack to the Hive ransomware-as-a-service gang; leaked
  negotiation chats (first published by Red Hot Cyber) showed a ransom
  demand of USD 5 million in Bitcoin, set to double to USD 10 million
  after three days. FS declined to pay. Most station-IT services were
  restored within 48 hours; the incident was reported to the Italian
  Postal Police (Polizia Postale) and the national cyber-security agency
  ACN.
description_de: >
  Am Morgen des 23. März 2022 entdeckte Ferrovie dello Stato Italiane
  (FS) einen Ransomware-Vorfall bei den Tochtergesellschaften Trenitalia
  und Rete Ferroviaria Italiana (RFI). Fahrkartenautomaten, Schalter und
  "Freccia Lounges" waren italienweit offline; der Online-Verkauf über
  trenitalia.com funktionierte weitgehend, der Zugbetrieb selbst lief
  weiter, Stationspersonal kündigte Ankünfte und Abfahrten per Megaphon
  an. Ermittler führten den Angriff auf die Ransomware-Gruppe Hive zurück;
  von Red Hot Cyber veröffentlichte Verhandlungs-Chats zeigen eine
  Lösegeldforderung von 5 Mio. USD in Bitcoin, die sich nach drei Tagen
  auf 10 Mio. USD verdoppeln sollte. FS zahlte nicht. Die Station-IT war
  nach ca. 48 Stunden weitgehend wiederhergestellt; der Vorfall wurde
  an Polizia Postale und die italienische Cybersicherheitsbehörde ACN
  gemeldet.

