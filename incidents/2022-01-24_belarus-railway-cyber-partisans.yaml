notes: >
  First widely publicised case of ransomware deployed as a hacktivist
  political-coercion tool rather than for financial extortion; the
  Cyber-Partisans' ransom demand was for release of political prisoners
  and withdrawal of Russian troops, not money. extortion is set to true
  because a ransom demand (non-monetary) was made, per the group's own
  Telegram statement. industry_sector=other because BCh operates both
  freight and passenger rail and the attack affected the corporate IT
  stack rather than any single segment. attack_vector left as unknown:
  the group hinted at insider assistance and a multi-month foothold but
  did not disclose initial access publicly.
