description_en: >
  On 24 January 2022, the Belarusian hacktivist collective Cyber-Partisans
  (Кіберпартызаны) announced they had encrypted the majority of servers,
  databases and workstations of the state-owned Belarusian Railway (BCh)
  with a self-built ransomware. The group said the intrusion disrupted
  internal traffic-control, customs and ticketing systems in order to
  slow Russian troop and materiel movements into Belarus in the run-up
  to the invasion of Ukraine. As political ransom, the Cyber-Partisans
  demanded the release of 50 political prisoners in need of medical
  care and a guarantee that Russian military units would not be allowed
  on Belarusian territory; independent OSINT analysts (including CyberKnow
  and Curated Intelligence) corroborated service degradation of BCh
  ticketing websites and internal systems during the following days.
description_de: >
  Am 24. Januar 2022 erklärte das belarussische hacktivistische Kollektiv
  Cyber-Partisans (Кіберпартызаны), die Mehrzahl der Server, Datenbanken
  und Arbeitsplatzrechner der staatseigenen Belarussischen Eisenbahn
  (Беларуская чыгунка, BCh) mit einer selbstentwickelten Ransomware
  verschlüsselt zu haben. Ziel war laut eigenen Angaben die Störung von
  Betriebsführung, Zoll- und Ticketingsystemen, um russische Truppen-
  und Materialbewegungen im Vorfeld des Angriffs auf die Ukraine zu
  verlangsamen. Als politisches Lösegeld forderte die Gruppe die Freilassung
  von 50 politischen Gefangenen sowie ein Verbot russischer Truppen auf
  belarussischem Staatsgebiet. OSINT-Analysten bestätigten Störungen der
  BCh-Ticketingsysteme in den Folgetagen.

