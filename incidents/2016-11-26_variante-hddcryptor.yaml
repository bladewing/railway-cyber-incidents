notes: >
  DZSF raw data carried the date 2016-11-26, but the attack was first
  detected on the evening of Friday 25 November 2016; it became publicly
  visible on 26 November when ticket machines across Muni stations
  displayed the "You Hacked, ALL Data Encrypted. Contact For Key
  (cryptom27@yandex.com)" message. The DZSF "threat_actor: @yandex.com"
  placeholder corresponds to the cryptom27@yandex.com / cryptom2016@yandex.com
  contact addresses used by the attacker under the pseudonym "Andy Saolis".
  Krebs on Security reported that a third-party security researcher broke
  into the attacker's Yandex mailboxes and found evidence pointing to Iran
  (Farsi-language notes, Iranian IP addresses, usernames "Alireza" and
  "Mokhi"); this remains unattributed and no law-enforcement action has
  publicly tied any named individual to the SFMTA incident, so
  `threat_actor_country` is left null. The exploitation vector was not
  confirmed by SFMTA, but Fortinet and CyberScoop reported that the
  HDDCryptor operators were running Oracle WebLogic / Primavera
  vulnerability scans against internet-exposed servers; the SFMTA itself
  stated it was likely a "spray and pray" rather than a targeted attack.
  No MITRE Software ID exists for HDDCryptor / Mamba in the MITRE ATT&CK
  knowledge base (checked 2026-04-19). MITRE techniques mapped: T1486
  (Data Encrypted for Impact) and T1490 (Inhibit System Recovery, via MBR
  overwrite). SFMTA publicly denied any data exfiltration, so
  `data_published` is false and `data_compromise.customer_data` /
  `organizational_data` are false; the attacker's 30 GB exfiltration claim
  was not substantiated. Monetary loss is hard to pin down: SFBay reported
  a potential fare loss of roughly US$559,000 per day of free rides and
  SFMTA later estimated about US$50,000 in lost fares over the weekend,
  but figures are not consistent enough to commit a single integer EUR
  value here. Trains (rail operations / signalling) were not affected.
