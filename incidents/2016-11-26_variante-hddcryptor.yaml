description_en: >
  On the evening of Friday 25 November 2016 (Thanksgiving weekend), the San
  Francisco Municipal Transportation Agency (SFMTA, operator of the "Muni"
  light-rail and bus network) was hit by the HDDCryptor / Mamba ransomware,
  which uses the open-source DiskCryptor utility to perform full-disk
  encryption and rewrites the Master Boot Record of each infected host.
  Roughly 2,112 of SFMTA's 8,656 Windows computers were affected, including
  office PCs, email servers, ticket-vending machines and schedule monitors;
  staff disabled faregates and let passengers ride for free through the
  weekend. The attacker, using the pseudonym "Andy Saolis" and the address
  cryptom27@yandex.com, demanded 100 BTC (≈US$73,000) and threatened to
  release 30 GB of allegedly-stolen data. SFMTA refused to pay, restored
  systems from backups by Monday 28 November, and later stated that trains
  were unaffected and no customer or server data had been accessed.
description_de: >
  Am Abend des 25. November 2016 (Thanksgiving-Wochenende) wurde die San
  Francisco Municipal Transportation Agency (SFMTA, Betreiberin der "Muni"
  Stadtbahn und Busnetze) Opfer der Ransomware HDDCryptor bzw. Mamba, die
  mit dem Open-Source-Tool DiskCryptor die Festplatten vollständig
  verschlüsselt und den Master Boot Record überschreibt. Rund 2.112 von
  8.656 Windows-Rechnern waren betroffen, darunter Büro-PCs, Mailserver,
  Fahrkartenautomaten und Fahrplananzeigen; die Bezahlschranken wurden
  abgeschaltet, sodass Fahrgäste über das Wochenende kostenlos fahren
  konnten. Der Täter verlangte unter dem Pseudonym "Andy Saolis" und der
  Adresse cryptom27@yandex.com 100 BTC (ca. 73.000 USD) und drohte mit
  Veröffentlichung von 30 GB angeblich erbeuteter Daten. SFMTA zahlte nicht,
  stellte die Systeme bis Montag, 28. November, aus Backups wieder her und
  erklärte, der Zugverkehr sei nicht betroffen gewesen und weder Kunden-
  noch Serverdaten seien abgeflossen.
