notes: >
  industry_sector=other because ÖBB-Holding includes passenger rail
  (ÖBB-Personenverkehr, Postbus), freight (Rail Cargo Austria) and
  the infrastructure manager (ÖBB-Infrastruktur); the DDoS hit the
  shared public web layer. motive=state_geopolitical: NoName057(16)
  is a pro-Russian hacktivist group targeting European supporters of
  Ukraine; the ÖBB attack fits its stated pattern. attack_vector=
  unknown since DDoS is not an enumerated value; MITRE T1498 (Network
  Denial of Service) is captured instead. duration_hours=6 approximates
  the window reported by multiple Austrian outlets (from roughly 06:30
  to 12:30 CET). NoName057(16) later claimed a much larger and
  multi-day DDoS campaign against Deutsche Bahn in February 2026
  (separately catalogued).
