description_en: >
  On Friday 16 December 2022, the public websites and online ticketing
  portal of Österreichische Bundesbahnen (ÖBB) suffered a sustained
  distributed denial-of-service (DDoS) attack, making oebb.at and
  tickets.oebb.at slow or unreachable from the morning until around
  12:30 local time. Customers reported that ticket purchases failed
  repeatedly and in some cases payments were debited multiple times.
  ÖBB confirmed the incident as a targeted DDoS attack affecting the
  entire online front-end. The pro-Russian hacktivist group
  NoName057(16) subsequently claimed responsibility on Telegram, listing
  ÖBB alongside other Austrian targets in a retaliation campaign linked
  to Austria's support for Ukraine. Rail operations, signalling and
  on-board systems were not affected; impact was confined to online
  services.
description_de: >
  Am Freitag, 16. Dezember 2022, wurden die öffentliche Website und das
  Online-Ticketingportal der Österreichischen Bundesbahnen (ÖBB) Ziel
  eines anhaltenden DDoS-Angriffs. oebb.at und tickets.oebb.at waren
  vom frühen Vormittag bis etwa 12:30 Uhr Ortszeit nur eingeschränkt
  oder gar nicht erreichbar; Kundinnen und Kunden berichteten von
  fehlgeschlagenen Buchungen und teilweise mehrfach belasteten
  Zahlungen. Die ÖBB bestätigten den Vorfall als gezielten DDoS-Angriff
  gegen das gesamte Online-Frontend. Die pro-russische Hacktivisten-
  gruppe NoName057(16) bekannte sich später auf Telegram zum Angriff
  und führte ÖBB neben weiteren österreichischen Zielen als Teil einer
  Vergeltungskampagne gegen Österreichs Unterstützung für die Ukraine
  auf. Zugbetrieb, Signaltechnik und Bordsysteme waren nicht betroffen.

