description_en: >
  Over the US Thanksgiving weekend of late November 2023, the Greater
  Richmond Transit Company (GRTC) - the public transit provider for
  central Virginia - experienced a network disruption subsequently
  confirmed to be a ransomware attack. The incident temporarily
  affected certain applications and parts of the GRTC network. GRTC
  IT staff and third-party cybersecurity specialists worked to
  investigate and restore systems; bus services continued to operate
  during the incident. The Play (PlayCrypt) ransomware group claimed
  responsibility and listed GRTC Transit System on its darknet leak
  site. GRTC was subsequently hit by a second, separate cyber
  incident in early 2024.
