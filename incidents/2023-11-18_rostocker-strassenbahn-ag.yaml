description_en: >
  On 18 November 2023, Rostocker Straßenbahn AG (RSAG) - the
  municipal tram and bus operator of the Hanseatic city of Rostock
  in Mecklenburg-Vorpommern, Germany - detected a cyberattack against
  its IT infrastructure. The attack affected internal administrative
  systems; tram and bus operations continued. No threat actor
  claimed responsibility publicly at the time of reporting. RSAG
  worked with IT security specialists to restore affected systems.
