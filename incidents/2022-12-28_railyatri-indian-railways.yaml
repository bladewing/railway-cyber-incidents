notes: >
  event_date=2022-12-28: date on which RailYatri says it "observed" the
  breach; exfiltration likely pre-dated this since the exposed server
  was long-standing. reported_date set to the first substantive Indian
  press coverage (MediaNama, 4 Jan 2023) after CERT-In's notification
  to the Ministry of Railways. supply_chain=true and operator_type=
  private because RailYatri is a private IRCTC-authorised partner
  rather than Indian Railways / IRCTC itself; the Ministry of Railways
  explicitly rejected claims that IRCTC's own systems were breached.
  data_published=true given the 16 Feb 2023 BreachForums sale and the
  HIBP listing. attack_vector=exploit reflects the "unprotected,
  internet-facing, no-authentication server" root cause; a "Meow bot"
  wipe subsequently deleted residual data on the exposed host. affected
  passenger count (31 M) and invoice count (37 k) are reported by
  RailYatri in a public statement relayed by The Cyber Express and
  Business Standard. Dataset already catalogues the 2014-12-25 and
  2019-01-01 12306.cn breaches for comparable B2C-ticketing data
  exposures in Asia.
