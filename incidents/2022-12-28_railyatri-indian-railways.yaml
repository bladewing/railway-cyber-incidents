description_en: >
  On 28 December 2022, the IRCTC-authorised third-party train-ticket
  booking platform RailYatri (operated by Stelling Technologies Pvt.
  Ltd.) suffered a data breach caused by an unprotected, internet-
  facing server with no authentication. Approximately 31 million user
  records and 37,000 invoices were exfiltrated; the data — including
  names, email addresses, phone numbers, genders, tickets purchased,
  fares and travel itineraries — was advertised for sale on
  BreachForums on 16 February 2023. India's CERT-In notified the
  Ministry of Railways, which in turn halted RailYatri's booking
  integration with the Indian Railway Catering and Tourism Corporation
  (IRCTC) and imposed a penalty; the app was restored only after
  RailYatri implemented remedial controls. The Ministry of Railways
  publicly maintained that IRCTC's own servers were not compromised
  and that the breach was confined to its third-party integrator.
description_de: >
  Am 28. Dezember 2022 erlitt die IRCTC-lizenzierte
  Drittanbieter-Ticketbuchungsplattform RailYatri (betrieben von
  Stelling Technologies Pvt. Ltd.) eine Datenschutzverletzung durch
  einen ungeschützten, aus dem Internet erreichbaren Server ohne
  Authentifizierung. Rund 31 Millionen Nutzerdatensätze und 37.000
  Rechnungen wurden entwendet; die Daten — Namen, E-Mail-Adressen,
  Telefonnummern, Geschlecht, gekaufte Tickets, Preise und
  Reiseverbindungen — wurden am 16. Februar 2023 in BreachForums
  zum Verkauf angeboten. Das indische CERT-In informierte das
  Eisenbahnministerium, das daraufhin die IRCTC-Buchungsanbindung
  von RailYatri aussetzte und eine Strafe verhängte; die App wurde
  erst nach Nachbesserungen wieder freigeschaltet. Das
  Eisenbahnministerium betonte öffentlich, dass die eigenen
  IRCTC-Server nicht kompromittiert worden seien.

