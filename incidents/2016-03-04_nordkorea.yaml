notes: >
  The National Intelligence Service's announcement on 8 March 2016 bundled
  three distinct DPRK cyber operations: (1) spear-phishing of employees
  at two provincial/regional railway operators — the incident catalogued
  here; (2) smartphone compromises of ~40 of 300 targeted senior foreign-
  affairs, security and military officials between late February and
  early March 2016; and (3) an intrusion attempt at a South Korean online-
  banking security-software vendor. Only (1) is in scope for this dataset.
  The exact day of the railway phishing wave is not publicly attested;
  phys.org dated the emails to January–February 2016 while the NIS
  detection and public announcement fall in early March, so event_date
  is given at month precision. The original DZSF day value of 2016-03-04
  could not be corroborated. The NIS did not name the two regional
  railway operators; consequently `target_organization` is kept null. No
  public source attributes the campaign to a specific named threat group
  (Lazarus, Kimsuky, Andariel, etc.); attribution is to the DPRK state
  at reported-confidence level, mirroring the NIS statement, and North
  Korea denied the accusations. No malware artefacts were publicly
  disclosed. `affected_systems` is set to `internal_communication`
  because the attested impact was limited to the email accounts of
  railway staff; the railway transport control system itself was
  reportedly not reached.
