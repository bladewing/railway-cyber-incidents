description_en: >
  In early 2016, North Korean hackers ran a spear-phishing campaign against
  the email accounts of employees at two South Korean provincial/regional
  railway operators in an attempt to steal their account credentials as
  a staging step toward a later cyberattack on the railway transport
  control system. South Korea's National Intelligence Service (NIS)
  announced on 8 March 2016 that it had detected the attempts, disabled
  the targeted accounts and prevented any follow-on access to the control
  network. The NIS characterised the operation as "a step to prepare for
  cyber terror against the railway transport control system"; no
  operational rail systems were confirmed to have been compromised, and
  North Korea publicly denied involvement.
description_de: >
  Anfang 2016 führten mutmaßlich nordkoreanische Angreifer eine
  Spear-Phishing-Kampagne gegen E-Mail-Konten von Beschäftigten zweier
  südkoreanischer Regionalbahn-Betreiber durch, um deren Zugangsdaten
  abzugreifen und damit einen späteren Angriff auf das Leitsystem des
  Bahnverkehrs vorzubereiten. Der südkoreanische Nachrichtendienst NIS
  teilte am 8. März 2016 mit, er habe die Versuche erkannt, die
  betroffenen Konten gesperrt und weitergehenden Zugriff verhindert. Eine
  Kompromittierung operativer Bahnsysteme wurde nicht bestätigt;
  Nordkorea bestritt die Vorwürfe.
