description_en: >
  On 19 October 2020 the Société de transport de Montréal (STM) — the
  public transit authority for the urban agglomeration of Montreal,
  Quebec, operating the four-line, 68-station rubber-tired Montreal
  Metro, 221 daytime and 23 night bus routes, the Transport adapté
  paratransit service and the Taxibus on-demand service — was hit by
  a highly automated ransomware attack using the RansomEXX (a.k.a.
  Defray777 / Ransom X) family. The intrusion reached STM by
  happenstance: the attackers had earlier compromised Acura Laval, an
  automobile dealership on Montreal's North Shore, exfiltrated its
  customer list and email mailboxes, and pushed a weaponised
  attachment to those customers; an STM procurement-division employee
  opened the attachment through his personal email account on a
  corporate device, detonating the payload inside STM's network. STM's
  security team isolated affected systems within four hours; 600 of
  1,600 servers (approximately 624 considered operationally sensitive)
  were encrypted, the corporate website, telephone lines and online
  customer-service platforms went offline, and the Transport adapté
  online reservation portal was knocked out for several days (phone
  reservations limited to medical trips until 25 October, when online
  reservations were restored). Bus and Metro revenue service continued
  without interruption throughout. On 28 October 2020, more than a
  week of silence after the intrusion, the RansomEXX operators issued
  a ransom demand of approximately US $2.8 million in cryptocurrency;
  CEO Luc Tremblay publicly refused to pay. A follow-on forensic
  investigation (announced 18 November 2020 and completed 16 November
  2020) disclosed that an automated exfiltration routine had pulled
  low-sensitivity personal data on 24 of STM's 11,000 employees and
  72 of its 645,000 customers from 5 of 6,500 computers and 38 of
  1,000 servers — mostly names, email addresses and phone numbers —
  and more sensitive data on 2 employees. No bulk data publication on
  the RansomEXX leak site has been documented. Server restoration
  cost STM approximately CA $2 million (≈ €1.5 million at late-2020
  FX) in goods and services plus lost-time costs; STM later filed a
  CA $5 million insurance claim. RansomEXX is attributed to the
  Sprite Spider / GOLD DUPONT big-game-hunting eCrime actor (Unit 42,
  CrowdStrike, SecureWorks), which rebranded Defray777 as RansomEXX
  in mid-2020 and hit Texas DOT, Konica Minolta, IPG Photonics,
  Tyler Technologies and Brazil's Superior Court of Justice the same
  year.
description_de: >
  Am 19. Oktober 2020 wurde die Société de transport de Montréal
  (STM) — die öffentliche Nahverkehrsbehörde des Ballungsraums
  Montreal (Quebec), die die vierlinige, 68 Stationen umfassende
  gummibereifte Métro de Montréal, 221 Tages- und 23 Nachtbuslinien,
  den Paratransit-Dienst Transport adapté sowie den Rufbus Taxibus
  betreibt — Ziel eines hochautomatisierten Ransomware-Angriffs mit
  der RansomEXX-Familie (auch bekannt als Defray777 bzw. Ransom X).
  Der Zugang kam zufällig zustande: die Täter hatten zuvor den
  Autohändler Acura Laval an der Nordküste Montreals kompromittiert,
  dessen Kundenliste und E-Mail-Postfächer abgezogen und den Kunden
  mit einem schadhaften Anhang ein Phishing-Mailing zugeschickt; ein
  Mitarbeiter der Beschaffungsabteilung der STM öffnete den Anhang
  auf einem Dienstgerät über sein privates E-Mail-Konto und löste so
  den Schadcode im STM-Netz aus. Die IT-Sicherheitsabteilung der STM
  konnte die betroffenen Systeme innerhalb von vier Stunden isolieren;
  600 von 1.600 Servern (rund 624 davon „operativ sensibel") wurden
  verschlüsselt, die Unternehmenswebsite, Telefonleitungen und
  Kundenservice-Plattformen waren offline, und das Online-
  Reservierungssystem des Transport adapté war mehrere Tage
  ausgefallen (telefonische Reservierungen waren bis 25. Oktober nur
  für medizinische Fahrten möglich, danach lief der Online-Dienst
  wieder). Bus- und Métro-Betrieb fuhren durchgängig weiter. Am
  28. Oktober 2020, nach über einer Woche Funkstille, forderten die
  RansomEXX-Betreiber rund 2,8 Mio. US-Dollar Lösegeld in Kryptowährung;
  Generaldirektor Luc Tremblay lehnte die Zahlung öffentlich ab. Die
  am 18. November 2020 veröffentlichte forensische Untersuchung
  ergab, dass ein automatisiertes Exfiltrationsmodul
  niedrigsensible Daten von 24 der 11.000 Beschäftigten und 72 der
  645.000 Kund:innen aus 5 von 6.500 Rechnern und 38 von 1.000
  Servern abgezogen hatte — im Wesentlichen Namen, E-Mail-Adressen
  und Telefonnummern — sowie sensiblere Daten von zwei Beschäftigten.
  Eine Massenveröffentlichung auf der RansomEXX-Leak-Site ist nicht
  dokumentiert. Die Wiederherstellung kostete die STM rund 2 Mio. CAD
  (≈ 1,5 Mio. EUR) zuzüglich Ausfallzeiten; später reichte die STM
  eine Versicherungsforderung über 5 Mio. CAD ein. RansomEXX wird
  dem als „Sprite Spider" / „GOLD DUPONT" bekannten finanziell
  motivierten eCrime-Akteur zugeschrieben (Unit 42, CrowdStrike,
  SecureWorks), der Defray777 Mitte 2020 als RansomEXX umbenannte
  und im selben Jahr das Texas DOT, Konica Minolta, IPG Photonics,
  Tyler Technologies und den brasilianischen Obersten Gerichtshof
  traf.
