notes: >
  Identification: the DZSF raw-data stub dated 2020-10-28 (Canada,
  malware=RansomExx, extortion=true, data_published=false,
  affected_systems=[internal_communication, website, data]) matches
  the Société de transport de Montréal (STM) RansomEXX ransomware
  incident of 19 October 2020 beyond reasonable doubt: STM is the
  only Canadian rail-operating transit entity publicly attributed to
  RansomEXX in 2020 (BleepingComputer, CBC, Global News, Radio-
  Canada, Le Devoir, L'Actualité, Infosecurity Magazine, Mass Transit
  Magazine, Progressive Railroading, Journal Métro, Tripwire,
  Intelligent CISO, TCRP Synthesis 158). The DZSF date 2020-10-28
  corresponds to the day the ≈US $2.8 M ransom demand was disclosed
  publicly (CBC, Global News, Radio-Canada all file 29 October 2020
  reports citing the prior day's demand); I have therefore retained
  2020-10-28 in the id/filename but set event_date to 2020-10-19
  (the afternoon of the actual intrusion and initial outage, per
  STM's 18 November 2020 press release and TCRP Synthesis 158) and
  reported_date to 2020-10-20 (STM's public confirmation the day
  after the intrusion, when it first described the incident as a
  ransomware attack).

  Not to be confused with the Metro Vancouver TransLink Egregor
  attack of early December 2020 — that is a distinct incident with a
  different ransomware family (Egregor, not RansomEXX).

  attack_vector `phishing`: the initial STM infection arrived via a
  phishing email with a malicious attachment opened by an STM
  procurement-division employee on his personal email account on a
  corporate device (Vigila, STM press release, Radio-Canada). The
  phishing mailing was itself sent from compromised mailboxes at the
  Acura Laval automobile dealership (supply-chain upstream of the
  phishing message), but the compromise of STM itself was a direct
  phishing event, not a software supply-chain compromise of an STM
  IT vendor. `supply_chain` therefore set to false.

  malware: RansomEXX (aliases Defray777, Ransom X; family RansomEXX).
  No MITRE ATT&CK Software ID is currently assigned to RansomEXX in
  the public MITRE ATT&CK catalogue (as of April 2026), so
  mitre_software_id is left null rather than guessing S0602 (which is
  Circles, an SS7 surveillance tool) or any other plausible but
  incorrect value.

  motive `financial`: classic double-extortion big-game-hunting RaaS
  — encrypt, demand cryptocurrency (US $2.8 M), threaten leak. No
  geopolitical or ideological motive reported.

  threat_actor: RansomEXX is attributed to the Sprite Spider /
  GOLD DUPONT actor group (CrowdStrike's and SecureWorks' respective
  naming conventions; also tracked by Unit 42 under "Defray777
  operators" and by Malpedia as the operator of win.ransomexx /
  elf.ransomexx). The actor emerged as a rebrand of Defray777 in
  mid-2020 and ran low-volume, targeted BGH campaigns.
  `attribution_confidence: reported` — the RansomEXX/Sprite Spider
  linkage is reported consistently by multiple private-sector
  researchers but has not been confirmed by a government indictment
  or court action tied to the STM incident specifically.

  threat_actor_country null: publicly-available attribution links
  RansomEXX/Sprite Spider to Russian-speaking eCrime ecosystems but
  stops short of a concrete country attribution in open-source
  reporting. Per the "prefer null over invention" rule I leave
  threat_actor_country unset rather than entering RU on the weaker
  inference.

  mitre_attack_techniques: list combines (a) the RansomEXX /
  Defray777 documented TTPs (Unit 42, Trend Micro, Kaspersky,
  Cybereason) and (b) the STM-specific behaviour documented by STM
  and Radio-Canada (initial access via spearphishing attachment,
  automated exfiltration):
    - T1566.001 Spearphishing Attachment (the Acura Laval-origin
      phishing email with malicious attachment)
    - T1078 Valid Accounts (Domain Admin exploitation — RansomEXX
      TTP; STM's "highly automated" encryption across 600 servers
      implies DC-level privilege)
    - T1021 Remote Services (lateral movement across the server
      estate)
    - T1059.001 PowerShell (Vatet loader stage)
    - T1486 Data Encrypted for Impact (the ransomware encryption of
      600 servers)
    - T1490 Inhibit System Recovery (RansomEXX standard TTP)
    - T1041 Exfiltration Over C2 Channel (the automated exfiltration
      that pulled 5 computers / 38 servers of data)
    - T1485 Data Destruction (inferred from file-encryption scope;
      documented RansomEXX capability)
  These are family-level TTPs mapped to the attested STM incident
  stages; no incident-specific forensic report IoC list is public.

  affected_systems: the DZSF triple (internal_communication, website,
  data) is retained and well-supported — STM's corporate phones and
  customer-service telephony went down (internal_communication),
  the public website stm.info was redirected to lastm.info during
  the outage (website), and organisational/customer data was
  exfiltrated automatically (data). The Metro (subway) revenue
  operation itself was unaffected, so rail_operations,
  train_driver_communication and internal_train_tracking are NOT
  claimed.

  data_published false: per STM's own 18 November 2020 investigation
  the exfiltration was limited and no bulk publication on the
  RansomEXX leak site has been documented in open-source reporting
  (ransomware.live victim index lists STM without a public leak).
  data_compromise.customer_data true (72 customers' low-sensitivity
  PII) and .organizational_data true (24 employees + 2 with
  higher-sensitivity data); .intellectual_property false (no
  proprietary tech).

  industry_sector `urban_transit`: STM is a metropolitan public-
  transit authority running the Montreal Metro (rubber-tired rapid
  transit, classified as urban metro) plus bus, paratransit and
  Taxibus — best-fit `urban_transit`. The Montreal Metro is rubber-
  tired but is still classified as a heavy-rail rapid-transit
  metro system for industry-sector purposes.

  operator_type `public_authority`: STM is a public-sector transit
  authority of the Ville de Montréal, created under Quebec's
  municipal-transit law. It is neither an incumbent national
  operator nor a private operator.

  confirmation_status `confirmed`: STM publicly confirmed the attack
  (press releases 21 October and 18 November 2020); TCRP
  Synthesis 158 (National Academies, 2022) catalogues it;
  BleepingComputer, CBC, Global News, Radio-Canada, Le Devoir,
  L'Actualité, Infosecurity Magazine, Mass Transit Magazine,
  Progressive Railroading, Journal Métro, Tripwire and Intelligent
  CISO all report it as a confirmed incident with a named ransomware
  family.

  monetary_damage_eur 1500000: CA $2 M restoration cost reported by
  STM (18 November 2020 press release, corroborated by Radio-Canada
  and Le Devoir) converted at late-2020 FX (≈ CA $1 = €0.65) yields
  ≈ €1.3-1.5 M. I use €1.5 M as a rounded-up integer estimate; it is
  a direct-restoration cost only and does not include lost time or
  the later CA $5 M insurance claim. This is an approximate figure
  reflecting publicly reported values.

  German-language press: German-language searches (heise.de, Golem.de,
  Eurailpress) returned no dedicated STM 2020 coverage. The DZSF
  catalogue is therefore the only German-language anchor; this is
  consistent with the low salience of a Canadian transit incident in
  German rail-trade press. No escalation is warranted.
