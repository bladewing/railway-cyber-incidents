notes: >
  The DZSF raw import recorded only "July 2015, UK, unclear system" with
  month-precision. Public reporting strongly ties this to the cluster of
  four reconnaissance intrusions on UK rail networks disclosed by Darktrace
  on 12 July 2016, covering roughly July 2015 – July 2016. The DZSF date
  likely marks the first of the four attacks; specific attack dates inside
  the window were never made public. No victim organisation was named:
  Darktrace covered "much of the UK's rail network" but Network Rail was
  explicitly not a customer, and named Darktrace rail customers at the time
  included Virgin Trains (announced 2014-10-07). Attribution to a
  nation-state actor came from Darktrace and quoted third-party experts
  (Kaspersky, ESET) but was never formally confirmed by any government
  body, so attribution_confidence is set to "suspected" and the threat
  actor / country are left null. One of the four attacks reportedly
  involved a dictionary attack attempting to set a signal state, per
  Darktrace — this was characterised as reconnaissance rather than a
  successful compromise, so attack_vector is kept as "unknown" (the method
  of initial access for any of the four was never disclosed).
  industry_sector is set to "other" because the disclosure described a
  cluster across multiple UK rail networks rather than a single
  sector-specific victim. motive is set to "espionage" based on the
  explicit Darktrace framing as reconnaissance for a potential APT rather
  than for financial or disruptive ends.
