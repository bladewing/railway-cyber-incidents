description_en: >
  Between approximately July 2015 and July 2016, UK-based cybersecurity firm
  Darktrace — which monitored "much of the UK's rail network" — detected four
  separate network intrusions on British railway IT networks, disclosed
  publicly via a Telegraph interview on 12 July 2016 with Darktrace CTO Dave
  Palmer. The incidents were characterised as exploratory reconnaissance
  (for example, one attempt used a dictionary attack against a signalling
  system component) rather than destructive actions, and Darktrace and
  third-party experts (Kaspersky, ESET) speculated nation-state origin while
  stopping short of formal attribution. No service disruption, no confirmed
  data exfiltration, and no named victim organisation was reported; Network
  Rail publicly stated it was not a Darktrace customer and that "Britain has
  the safest major railway in Europe". The DZSF bulk-import entry dated
  "July 2015" likely represents the earliest of the four attacks in this
  12-month cluster.
description_de: >
  Zwischen etwa Juli 2015 und Juli 2016 entdeckte die britische
  IT-Sicherheitsfirma Darktrace — die nach eigenen Angaben "weite Teile des
  britischen Eisenbahnnetzes" überwachte — vier separate Netzwerkeinbrüche
  in IT-Systemen britischer Bahnbetreiber. Darktrace-CTO Dave Palmer machte
  die Vorfälle am 12. Juli 2016 gegenüber dem Daily Telegraph öffentlich.
  Die Angriffe wurden als explorative Aufklärung beschrieben (ein Angriff
  nutzte z. B. einen Wörterbuchangriff gegen eine Signalkomponente) und
  nicht als destruktiv. Darktrace und externe Experten (Kaspersky, ESET)
  vermuteten staatliche Akteure, ohne formell zu attribuieren. Kein Ausfall,
  kein bestätigter Datenabfluss und keine namentliche Nennung des
  betroffenen Unternehmens; Network Rail erklärte öffentlich, nicht
  Kunde von Darktrace zu sein. Der DZSF-Masseneintrag mit Datum Juli 2015
  dürfte den ersten der vier Angriffe dieses Zwölf-Monats-Clusters abbilden.
