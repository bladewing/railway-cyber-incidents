notes: >
  The DZSF raw-data entry dated this incident 2017-10-12 (day-precision);
  publicly, the primary attack actually began in the early hours of
  Wednesday 11 October 2017 against Trafikverket (discovered around 02:00
  local time according to SVT and Aktuell Säkerhet) and continued on
  Thursday 12 October against Transportstyrelsen and Västtrafik, with a
  further Västtrafik wave on Friday 13 October that was mitigated.
  event_date is therefore set to the earliest public trigger (2017-10-11);
  the DZSF id "2017-10-12" is retained to preserve traceability to the
  import.

  affected_systems kept `internal_communication` (email outage at
  Trafikverket), `internal_train_tracking` (automatic train-position
  system crashed), `passenger_information` (road-traffic map, Västtrafik
  journey planner), `website` (public portals) and `rail_operations`
  (dispatch order generation was disrupted, forcing manual operation);
  `payment_system` is added for Västtrafik's ticket-booking app. `data`
  is *not* selected because no customer or corporate data was accessed or
  exfiltrated — this was a pure availability attack. DZSF's original
  `supply_chain: true` flag is corrected to `false`: while the DDoS was
  delivered via Trafikverket's two ISPs (TDC, DGC) owned by Tele2, there
  was no third-party software/vendor compromise, only a bandwidth flood
  at the upstream network layer, which does not meet the supply-chain
  compromise definition used elsewhere in this dataset.

  Attribution: no perpetrator has been officially identified. DGC
  business-unit manager Patrik Gylesjö publicly described such floods as
  "a fairly common phenomenon" that can be ordered online; Computer
  Weekly (Jan 2018) quoted him acknowledging attribution ambiguity.
  Several secondary outlets (BleepingComputer, Security Affairs, SC
  Media) noted that the attacks followed Russia's Zapad-2017 military
  exercise in the Baltic region by about a week, but no government body
  has confirmed a Russian nexus for this incident. threat_actor,
  threat_actor_country and attribution_confidence are therefore left
  null / `unknown`. motive is set to `disruption` because the attack was
  purely availability-focused with no ransom demand, no data
  exfiltration, and no known financial gain.

  attack_vector is set to `exploit` (as the closest match in the current
  vocabulary for a volumetric bandwidth flood targeting network-stack
  availability at the ISP level, consistent with MITRE T1498 mapping);
  the Codebook does not yet contain a dedicated `network_dos` vocabulary
  value — no vocabulary addition is proposed here because the attack
  vector classification is about *initial access method*, and DDoS is
  arguably not an access vector at all (it is an effect). Maintainers
  may wish to add a dedicated value in a future schema iteration.

  industry_sector is set to `infrastructure_manager`: Trafikverket is
  Sweden's national rail and road infrastructure manager, and is the
  primary affected entity. Västtrafik (regional_passenger / urban_transit
  mix) and Transportstyrelsen (regulator) are co-impacted but secondary.
  operator_type is set to `public_authority` because all three are
  government bodies.

  impact.duration_hours left null: sources describe restoration "within
  hours" for Trafikverket and "brief" outages for Västtrafik, but no
  single duration was published across all three victims.
