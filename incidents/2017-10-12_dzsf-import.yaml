description_en: >
  On 11 October 2017 a distributed denial-of-service (DDoS) attack hit the
  Swedish Transport Administration (Trafikverket) via its two internet
  service providers TDC and DGC, knocking out the IT system that tracks
  train positions and issues dispatch orders, as well as the agency's
  public website, email system and road-traffic information. Train traffic
  across Sweden was disrupted for several hours and had to be managed
  manually using back-up procedures, which contributed to punctuality
  dropping to 86.2 % that day. On 12 October 2017 further DDoS waves hit
  the Swedish Transport Agency (Transportstyrelsen) website and the
  western-Sweden public-transport operator Västtrafik, briefly crashing
  Västtrafik's "To Go" ticket app and journey planner; a follow-up wave on
  13 October was successfully mitigated. No data exfiltration or
  destructive impact was reported, and no perpetrator was identified; an
  industry source (DGC) publicly speculated about motive ranging from a
  prank to a deliberate probe of Swedish transport resilience, while
  wider coverage linked the timing to the Russian Zapad-2017 exercise
  in the Baltic region.
description_de: >
  Am 11. Oktober 2017 traf ein Distributed-Denial-of-Service-Angriff (DDoS)
  die schwedische Verkehrsverwaltung Trafikverket über ihre beiden
  Internet-Dienstleister TDC und DGC. Das IT-System zur automatischen
  Zugortung und Disposition, die öffentliche Website, der E-Mail-Dienst
  sowie die Verkehrsinformationen fielen aus. Der Zugverkehr in ganz
  Schweden wurde mehrere Stunden gestört und musste manuell im
  Rückfallverfahren abgewickelt werden; die Pünktlichkeit sank an diesem
  Tag auf 86,2 %. Am 12. Oktober 2017 folgten weitere DDoS-Wellen gegen
  die Website der Verkehrsaufsichtsbehörde Transportstyrelsen und den
  westschwedischen ÖPNV-Betreiber Västtrafik, dessen Ticket-App „To Go"
  und Reiseplaner kurzzeitig ausfielen; eine Nachfolgewelle am 13. Oktober
  konnte abgewehrt werden. Es wurden keine Datenabflüsse oder
  zerstörerischen Effekte gemeldet; der Angreifer blieb unbekannt. Ein
  Branchen-Sprecher (DGC) nannte als mögliche Motive eine Streich-Aktion
  bis hin zu einer gezielten Sondierung schwedischer Verkehrsresilienz;
  internationale Berichterstattung stellte einen zeitlichen Bezug zur
  russischen Zapad-2017-Übung im Ostseeraum her.
