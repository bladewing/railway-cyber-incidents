notes: >
  The 2026-04 research pass initially planned this entry for January 2024
  (a separate NoName057(16) wave timed around WEF Davos and Zelenskyy's
  2024 visit). However, the explicit SBB impact was in the 12 June 2023
  wave; the January 2024 campaign primarily targeted the federal
  administration and municipalities, with SBB only mentioned as a
  previous victim. industry_sector=other (SBB runs passenger rail,
  freight via SBB Cargo, and the national infrastructure manager within
  one integrated group). attack_vector=unknown — DDoS is not in the
  vocabulary; captured via MITRE T1498 (Network Denial of Service) and
  T1498.001 (Direct Network Flood). confirmation_status=confirmed
  because both SBB and the NCSC published confirmations. Part of the
  same NoName057(16) campaign that the dataset records for ÖBB
  (2022-12-16) and Deutsche Bahn (2026-02-17).
