description_en: >
  On Monday 12 June 2023, the public website (sbb.ch) and online portal
  of Schweizerische Bundesbahnen (SBB) were targeted by a layer-7
  distributed denial-of-service (DDoS) campaign conducted by the
  pro-Russian hacktivist collective NoName057(16) using its DDoSia tool.
  The attack was part of a broader wave also affecting the Swiss federal
  administration, the Swiss Parliament and Swiss Post, timed around
  Ukrainian President Volodymyr Zelenskyy's video address to the Swiss
  Parliament on 15 June 2023. SBB's customer-facing web services were
  intermittently unreachable for short periods; no rail-operational,
  signalling or on-board systems were affected. The Swiss National
  Cyber Security Centre (NCSC) published a detailed post-incident
  analysis of the NoName057(16) / DDoSia campaign attributing the
  activity to the same pro-Russian group that later targeted ÖBB
  (2022-12-16) and Deutsche Bahn (2026-02-17).
description_de: >
  Am Montag, 12. Juni 2023, wurden die öffentliche Website (sbb.ch)
  und das Online-Portal der Schweizerischen Bundesbahnen (SBB) Ziel
  einer Layer-7-DDoS-Kampagne der pro-russischen Hacktivistengruppe
  NoName057(16) mit deren DDoSia-Werkzeug. Der Angriff war Teil einer
  breiteren Welle, die auch die schweizerische Bundesverwaltung, das
  Parlament und die Schweizerische Post traf und zeitlich mit der
  Videoansprache des ukrainischen Präsidenten Wolodymyr Selenskyj
  am 15. Juni 2023 vor dem Schweizer Parlament zusammenfiel.
  Kundenseitige Webdienste der SBB waren kurzfristig nicht erreichbar;
  Betrieb, Signaltechnik und Bordsysteme waren nicht betroffen. Das
  Nationale Zentrum für Cybersicherheit (NCSC) veröffentlichte eine
  ausführliche Nachanalyse der NoName057(16)-/DDoSia-Kampagne.

