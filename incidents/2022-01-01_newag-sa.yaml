notes: >
  Atypical entry: the alleged threat actor is the rolling-stock OEM
  itself, and the "attack" is embedded manufacturer code that disables
  trains under conditions favouring the OEM's own service business,
  not an external intrusion. Classified here under attack_vector:
  insider because the malicious logic was introduced by someone with
  authorised access to the product software-supply chain (Newag
  engineering, per the Dragon Sector allegation). Newag disputes the
  allegations and has sued; the matter remains in civil litigation at
  the accessed_date. event_date uses year precision because the lock-
  out logic was identified across multiple Impuls units with different
  delivery and activation dates; the earliest observed lock-out was
  in 2022, and Dragon Sector's investigation began May 2022.
