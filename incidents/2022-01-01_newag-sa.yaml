description_en: >
  In 2022, Polish regional rail operators began experiencing unexplained
  failures of Impuls-class electric multiple units manufactured by
  Newag S.A. after the trains were sent for maintenance to
  independent third-party workshops (notably SPS) rather than to Newag
  itself. Dragon Sector, a Polish security research team hired by SPS
  in May 2022, reverse-engineered the PLC firmware and in August 2022
  identified logic embedded in the train control software that caused
  the trains to refuse to start under specific conditions: if the
  train had stayed for more than a threshold number of days in GPS
  coordinate ranges corresponding to third-party repair facilities
  competing with Newag's own service arm, and/or after certain
  calendar dates. Dragon Sector publicly disclosed their findings at
  the Chaos Communication Congress (37C3) in December 2023. At least
  30 Impuls units across several Polish operators were confirmed
  affected by lock-out conditions. Newag denies the allegations,
  asserts the findings are a "slander from our competition," and has
  filed civil lawsuits against the Dragon Sector researchers for
  intellectual property infringement and unfair competition.
