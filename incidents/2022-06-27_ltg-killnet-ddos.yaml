description_en: >
  On 27 June 2022, the pro-Russian hacktivist collective Killnet launched
  a large-scale distributed denial-of-service (DDoS) campaign against
  Lithuanian state and private institutions in retaliation for Lithuania's
  18 June 2022 enforcement of EU sanctions on rail-and-road transit of
  restricted goods (steel, metals) to the Russian exclave of Kaliningrad.
  The campaign included the website and online ticketing portal of the
  state-owned Lithuanian Railways (Lietuvos geležinkeliai, LTG), rendering
  passenger ticket purchases temporarily unavailable. The Lithuanian
  National Cyber Security Centre (NKSC) confirmed the incident and
  described the DDoS traffic as among the most intense ever recorded
  against Lithuania. Killnet publicly demanded on Telegram that Vilnius
  reinstate the Kaliningrad transit routes and claimed it had "demolished
  1,652 web resources" during the campaign; rail operations themselves
  were unaffected.
description_de: >
  Am 27. Juni 2022 startete das pro-russische Hacktivistenkollektiv
  Killnet eine großangelegte DDoS-Kampagne gegen litauische staatliche
  und private Einrichtungen — als Reaktion auf Litauens Durchsetzung
  der EU-Sanktionen zum Transit von Stahl und weiteren Gütern in die
  russische Exklave Kaliningrad (18. Juni 2022). Betroffen waren u. a.
  die Website und das Online-Ticketportal der staatlichen Litauischen
  Eisenbahn (Lietuvos geležinkeliai, LTG), sodass Fahrkartenkauf
  zeitweise nicht möglich war. Das litauische Nationale Cybersicherheits-
  zentrum (NKSC) bestätigte den Vorfall und bezeichnete die DDoS-Flut
  als eine der intensivsten, die jemals gegen Litauen registriert wurde.
  Killnet forderte auf Telegram öffentlich die Wiederherstellung des
  Kaliningrad-Transits und behauptete, "1.652 Web-Ressourcen zerstört"
  zu haben; der Zugbetrieb selbst war nicht betroffen.

