notes: >
  industry_sector=other: LTG Group operates both freight (LTG Cargo —
  especially Kaliningrad transit) and passenger (LTG Link) segments;
  the attack affected the group's public web presence. motive is
  state_geopolitical because Killnet explicitly conditioned the attack
  on a Lithuanian policy decision (EU sanctions enforcement against
  Russia / Kaliningrad). attack_vector=unknown — DDoS does not map
  cleanly to the vocabulary; captured under mitre_attack_techniques
  as T1498 (Network Denial of Service). extortion=false: Killnet's
  demand was for policy reversal, not ransom. The Lithuanian NKSC
  characterised the broader campaign as the largest DDoS activity
  ever seen against Lithuania, though no rail-operational or safety
  systems were reached.
