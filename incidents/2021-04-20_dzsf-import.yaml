notes: >
  Identification: the DZSF raw-data row (US, event_date 2021-04-20,
  confirmation_status confirmed, affected_systems unclear_system) is
  mapped here to the Metropolitan Transportation Authority (MTA, New
  York) Pulse Connect Secure intrusion that MTA internally learned of
  from an FBI/NSA/CISA joint alert issued on the evening of
  20 April 2021 (MTA official quote: the alert arrived "at around
  8 p.m. on April 20"). No other US rail/transit cyber incident
  with an event or report date of 20 April 2021 is publicly attested;
  the DZSF entry's date exactly matches the MTA-internal alert
  arrival date and the same-day CISA AA21-110A publication. This is
  NOT a duplicate of 2021-04-18_lockbit (Merseyrail, UK; LockBit
  ransomware) or of the 2021-03-19_dzsf-import (Správa železnic)
  entry; both differ in country, target and actor.

  Date handling: event_date kept at 2021-04-20 (FBI/NSA/CISA alert
  arrival at MTA + CISA AA21-110A publication + Mandiant "Check Your
  Pulse" report). The actual intrusion dates are earlier — MTA
  forensic work places two separate intrusions in the "second week
  of April 2021" (~12-18 April), and the broader UNC2630/APT5
  exploitation of Pulse Secure appliances dates back to June 2020
  or earlier per CISA and Mandiant. reported_date set to
  2021-06-02, the day the breach was first made public via a New
  York Times report which triggered the same-day MTA statement by
  CTO Rafail Portnoy.

  target_organization: the New York State Metropolitan Transportation
  Authority, a public-benefit corporation running North America's
  largest public-transit network. operator_type = public_authority
  (the MTA is a state-established public-benefit corporation, not a
  private operator). industry_sector = urban_transit because
  MTA's primary public identity is as NYC's subway/bus authority and
  its subsidiaries — NYC Transit (subway), Staten Island Railway,
  LIRR and Metro-North — are all commuter / rapid-transit operations
  serving a single metropolitan region, not long-distance passenger
  rail; the schema allows only one value. Subsidiaries explicitly
  named by press and MTA itself as impacted: NYC Transit (subway +
  buses), Long Island Rail Road, Metro-North Railroad.

  attack_vector = exploit (authenticated / unauthenticated
  exploitation of a chain of Pulse Connect Secure vulnerabilities,
  primarily CVE-2021-22893 authentication-bypass; also
  CVE-2019-11510, CVE-2020-8260, CVE-2020-8243). Not
  credential_theft, even though compromised credentials were a
  downstream consequence — the initial access vector is exploitation
  of a software vulnerability in the Pulse Secure appliance itself.

  malware: SLOWPULSE (MITRE S1104), PULSECHECK (S1108) and PACEMAKER
  (S1109) — the three Mandiant-tracked Pulse-Secure-specific
  implants that are also catalogued as MITRE ATT&CK Software IDs and
  are attributed to APT5/UNC2630. Additional families enumerated by
  Mandiant (RADIALPULSE, SLIGHTPULSE, ATRIUM, THINBLOOD, HARDPULSE,
  QUIETPULSE, PULSEJUMP, STEADYPULSE, LOCKPICK, BLOODMINE,
  BLOODBANK, CLEANPULSE, RAPIDPULSE) do not yet have public MITRE
  Software IDs as of the 2026-04-19 research cut-off and are
  therefore omitted from the structured `malware` block but
  mentioned in the narrative. No MTA-specific enumeration of which
  of these implants were actually found on MTA Pulse appliances has
  been published — so this reflects campaign-level rather than
  victim-level attribution.

  threat_actor: APT5 / UNC2630 (MITRE ATT&CK G1023; aliases Mulberry
  Typhoon, MANGANESE, BRONZE FLEETWOOD, Keyhole Panda). Mandiant
  explicitly notes that UNC2630's Pulse Secure activity overlaps
  strongly with historic APT5 tradecraft dating to 2014-2015. A
  separate cluster UNC2717 exploited the same zero-day against
  European / US government targets but press coverage ties the MTA
  intrusion specifically to UNC2630 rather than UNC2717.
  threat_actor_country = CN (Mandiant, FireEye, CISA and NYT all
  describe the actor as Chinese state-linked; the Chinese
  government denied involvement).

  attribution_confidence = reported: the Chinese/APT5/UNC2630
  attribution rests on Mandiant / FireEye technical analysis and
  CISA/FBI/NSA advisories — strong primary-source reporting but not
  a court judgement or US DOJ indictment; the Wikipedia article on
  the Pulse Connect Secure data breach still describes attribution
  as "suspected Chinese-state-backed." `confirmed` reserved for the
  fact of the breach itself (MTA CTO public statement,
  NYT reporting, CISA advisory).

  motive = espionage. This is the point of strongest divergence
  from surrounding ransomware entries: no ransom note, no leak site
  posting, no extortion demand, no encryption payload. APT5's
  mission profile (Mandiant, MITRE G1023) is long-standing
  espionage against telecom, aerospace, defence and critical-
  infrastructure targets — not financial. extortion = false;
  data_published = false; data_compromise.intellectual_property /
  organizational_data / customer_data all FALSE because both MTA
  forensic findings and Mandiant's assessment of this intrusion in
  particular state that no data loss occurred; distinguish from
  access achieved (three systems touched) versus data exfiltrated
  (none attested). Magnitude.affected_trains and
  affected_passengers set to 0 (MTA stated services were never
  disrupted and rider safety was never at risk).

  affected_systems = [internal_communication, data]. The three
  compromised systems were not individually identified by MTA but
  the public description — Pulse Connect Secure remote-access VPN,
  password-reset required for 3,700 employees + contractors,
  forensic review of email/file-share data stores — maps to
  internal_communication (VPN + email + remote-access) and data
  (corporate/administrative file stores reviewed for exfiltration).
  Rail operations / signalling / train-control, passenger
  information, ticketing/payment, train-driver communication, and
  public website are all explicitly excluded by the MTA public
  statement ("no evidence operational systems were impacted …
  hackers did not gain access to systems that control subway cars
  or commuter rail trains").

  impact.scope = regional: MTA covers the New York metropolitan
  region including 12 NY counties and two Connecticut counties
  served by Metro-North. Though MTA is North America's largest
  transit network by volume, the footprint is a single
  metropolitan region rather than national/international, and no
  service disruption occurred.

  MITRE ATT&CK techniques asserted: T1190 (Exploit Public-Facing
  Application — Pulse Secure appliance exploitation); T1505.003
  (Server Software Component: Web Shell — PULSECHECK / SLIGHTPULSE
  / STEADYPULSE / ATRIUM webshell deployment); T1133 (External
  Remote Services — Pulse Connect Secure VPN abused as initial-
  access vector); T1556.004 (Modify Authentication Process:
  Network Device Authentication — SLOWPULSE modifying Pulse VPN
  authentication binaries); T1111 (Multi-Factor Authentication
  Interception — SLOWPULSE bypassing single + 2FA flows); T1003
  (OS Credential Dumping — PACEMAKER / BLOODBANK credential
  extraction); T1070 (Indicator Removal — THINBLOOD log wiping);
  T1562 (Impair Defenses — CLEANPULSE memory patching to suppress
  log events). Additional techniques enumerated in Mandiant's 23-
  technique table (T1016, T1021.001, T1027, T1036.005, T1048,
  T1049, T1053, T1057, T1059.003, T1071.001, T1082, T1105, T1098,
  T1134.001, T1136, T1140, T1518, T1569.002, T1574, T1592.004)
  are deliberately not asserted at the incident level — they
  describe campaign-wide tradecraft, not MTA-specific artefacts.
  This follows the repo's "prefer null over invention" rule.

  German-language coverage of the MTA incident specifically was
  not located on heise.de, Golem.de, Tagesschau or Süddeutsche
  (searches returned hits for the broader Pulse Secure / Chinese
  hacking campaign but no dedicated MTA-NY article). The DZSF
  entry remains the only German-language primary anchor. Noted
  as a coverage gap, not a substantive discrepancy.

  No ransomware payment, fine, enforcement action or subsequent
  breach litigation has been publicly documented. MTA continued
  to hold up the 2021 Pulse Secure incident as "the third
  cyberattack" on its network by foreign-linked actors in recent
  years (NYT / BleepingComputer), but the prior two incidents are
  not publicly detailed.
