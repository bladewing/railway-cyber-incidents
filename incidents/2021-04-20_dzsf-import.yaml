description_en: >
  On 20 April 2021, at approximately 20:00 local time, the New York
  Metropolitan Transportation Authority (MTA) received a joint
  FBI / NSA / CISA alert warning that Chinese state-linked threat
  actors (tracked by Mandiant / FireEye as UNC2630, overlapping
  strongly with the APT5 cluster, and a second cluster UNC2717)
  had been exploiting a chain of Pulse Connect Secure VPN
  vulnerabilities — including the newly-disclosed zero-day
  CVE-2021-22893 (authentication-bypass) plus the older
  CVE-2019-11510, CVE-2020-8260 and CVE-2020-8243 — to place
  custom webshells (PULSECHECK, SLIGHTPULSE), credential-harvesting
  implants (SLOWPULSE, PACEMAKER, RADIALPULSE) and log-wiping
  utilities (THINBLOOD) on Pulse Secure appliances at U.S.
  government agencies and critical-infrastructure operators,
  activity dating back to June 2020 or earlier. Forensic work by
  the MTA in cooperation with IBM and Mandiant found that the
  attackers had reached three of the MTA's 18 computer systems
  across NYC Transit, the Long Island Rail Road and Metro-North
  Railroad during two separate intrusions in the second week of
  April 2021, but had not touched the safety-critical rail
  operations / signalling / train-control environment, nor the
  employee or customer data stores. MTA applied the Pulse Secure
  mitigation on 21 April 2021 (the day after Pulse Secure issued
  its advisory), force-reset passwords for roughly 3,700 users
  (about 5 % of its workforce) and migrated affected remote
  users to alternate VPN solutions. The breach was first made
  public on 2 June 2021 by The New York Times; MTA Chief
  Technology Officer Rafail Portnoy issued a public statement
  the same day confirming the intrusion, the engagement of
  Mandiant, and the absence of data loss or operational impact.
  The MTA incident was one entry on a far-wider victim list
  (defence contractors, financial firms, municipal governments,
  at least five US federal agencies) compiled by CISA under
  Alert AA21-110A and Emergency Directive 21-03.
description_de: >
  Am 20. April 2021 gegen 20:00 Ortszeit wurde die New Yorker
  Metropolitan Transportation Authority (MTA) durch eine
  gemeinsame FBI/NSA/CISA-Warnmeldung darüber informiert, dass
  staatlich verbundene chinesische Akteure (von Mandiant /
  FireEye als UNC2630 geführt, mit starker Überlappung zur
  APT5-Gruppe, sowie ein separater Cluster UNC2717) eine Kette
  von Schwachstellen in Pulse-Connect-Secure-VPN-Appliances
  ausnutzten — neben dem frisch offengelegten Zero-Day
  CVE-2021-22893 (Authentifizierungs-Umgehung) auch die älteren
  CVE-2019-11510, CVE-2020-8260 und CVE-2020-8243. Auf
  kompromittierten Geräten wurden maßgeschneiderte Webshells
  (PULSECHECK, SLIGHTPULSE), Credential-Diebstahl-Implants
  (SLOWPULSE, PACEMAKER, RADIALPULSE) und ein
  Log-Wiping-Werkzeug (THINBLOOD) platziert; die Aktivität
  reichte mindestens bis Juni 2020 zurück und traf US-
  Behörden und Kritis-Betreiber breit. Die von MTA gemeinsam
  mit IBM und Mandiant durchgeführte forensische Analyse
  ergab, dass die Angreifer in zwei Einbrüchen in der zweiten
  Aprilwoche 2021 drei der 18 MTA-Systeme erreicht hatten —
  verteilt über NYC Transit, Long Island Rail Road und
  Metro-North Railroad —, aber die sicherheitskritische
  Betriebs- und Signaltechnik sowie die Beschäftigten- und
  Kundendaten nicht kompromittiert worden waren. MTA spielte
  den Pulse-Secure-Mitigation-Patch am 21. April 2021 ein,
  setzte rund 3.700 Benutzerpasswörter (~5 % der Belegschaft)
  zurück und stellte betroffene Fernzugänge auf alternative
  VPN-Lösungen um. Öffentlich wurde der Vorfall erstmals am
  2. Juni 2021 durch die New York Times; MTA-Technikvorstand
  Rafail Portnoy bestätigte den Einbruch am selben Tag und
  betonte das Fehlen von Datenabfluss oder betrieblichen
  Auswirkungen. Der MTA-Angriff war ein Fall in einer weit
  größeren Opferliste (Rüstungslieferanten, Finanzdienstleister,
  Kommunalverwaltungen, mindestens fünf US-Bundesbehörden),
  die CISA unter Alert AA21-110A und Emergency Directive
  21-03 zusammengestellt hatte.
