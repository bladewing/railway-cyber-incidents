description_en: >
  On 25 December 2014, Chinese vulnerability-reporting platform Wooyun
  disclosed that a file containing roughly 131,653 records of 12306.cn users
  — including usernames, plaintext passwords, ID card numbers, phone numbers,
  email addresses and security-question answers — was circulating online. The
  operator of 12306.cn, China Railway Corporation, confirmed the leak but
  attributed it to credential-stuffing (撞库) using account data stolen from
  unrelated websites, not to a direct compromise of its own database.
  Chinese railway police detained two suspects on 25 December 2014 for
  stealing and selling passenger data; the breach surfaced at the start of
  the Chinese New Year (chunyun) travel rush.
description_de: >
  Am 25. Dezember 2014 veröffentlichte die chinesische Sicherheitsplattform
  Wooyun einen Bericht über ein im Netz kursierendes Datenpaket mit rund
  131.653 Nutzerdatensätzen des offiziellen Bahn-Buchungsportals 12306.cn.
  Betroffen waren Benutzernamen, Klartext-Passwörter, Ausweisnummern,
  Telefonnummern, E-Mail-Adressen und Sicherheitsfragen. Die Betreiberin
  China Railway Corporation bestätigte das Leck, führte es jedoch auf
  Credential-Stuffing ("撞库") mit Zugangsdaten aus anderen Datenlecks zurück
  und nicht auf einen direkten Angriff auf ihre eigene Datenbank. Zwei
  Verdächtige wurden am selben Tag von der Eisenbahnpolizei festgenommen.
