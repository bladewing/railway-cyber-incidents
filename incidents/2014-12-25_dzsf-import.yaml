notes: >
  Two suspects were detained by railway police on 25 December 2014; Chinese
  sources variously identify them only by surnames (Jiang and Shi in some
  accounts). No organised threat-actor group has been attributed. The core
  attack technique was credential stuffing (撞库) — reusing username/password
  pairs harvested from unrelated breaches. 12306.cn denied that its own
  database was breached, citing that its stored passwords are encrypted
  whereas the leaked set contained plaintext passwords. Independent security
  vendors (Qihoo 360, Beijing Rising, Chuangyu) flagged vulnerabilities in
  the 12306 mobile-app login interface that facilitated automated attempts.
  The count of 131,653 records comes from the Wooyun.org disclosure; some
  later coverage rounds to 130,000 or cites 140,000 including duplicate/near
  records.
