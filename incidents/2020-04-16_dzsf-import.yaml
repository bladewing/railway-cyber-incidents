notes: >
  Identification: the original DZSF raw-data entry for 2020-04-16 (US,
  affected_systems=[data], extortion=false) matches, across date,
  country and affected-system profile, the publicly disclosed Amtrak
  Guest Rewards credential-stuffing incident of the same evening
  (16 April 2020). Amtrak is the U.S. national intercity passenger
  rail operator; the Guest Rewards service is the loyalty programme
  for its long-distance and Northeast Corridor services. No other
  US railway cyber incident is documented for this exact date in
  publicly available reporting (RailWorks' January 2020 ransomware and
  Diebold Nixdorf's late-April 2020 ProLock ransomware were both
  checked and deconflicted — different dates, different victim types;
  Amtrak's later 2024 password reset and the 2026 ShinyHunters
  Salesforce incident are separate events). Consequently this
  enrichment maps the DZSF stub onto the Amtrak Guest Rewards breach.

  Dates: event_date kept at 2020-04-16 (the day Amtrak detected the
  suspicious access according to the breach notification — the
  intrusion itself may have started slightly earlier as credentials
  were stuffed). reported_date set to 2020-05-29, the day Amtrak filed
  formal breach notifications with the Vermont and California
  Attorneys-General (Vermont filing referenced by Infosecurity
  Magazine, CPO Magazine, ManageEngine; California breach-report
  listing cites breach dates 2020-04-16 and 2020-04-17). Public media
  coverage began on 2020-05-30 (BleepingComputer) and clustered
  around 2020-06-01 to 2020-06-03.

  attack_vector set to `credential_theft`: the incident is the
  canonical example of credential stuffing — attackers reused
  username/password pairs harvested from unrelated prior breaches
  to log in to Amtrak Guest Rewards. SecurityWeek, CPO Magazine,
  Bleeping Computer, Intelligent CISO, Sophos and Infosecurity
  Magazine all explicitly identify credential-stuffing (or the
  equivalent "compromised usernames and passwords" language from
  Amtrak's own notification). This differs from the DZSF default
  value `unknown`. Amtrak's statement specifically said "no Amtrak
  systems were compromised" — the authentication endpoint was
  abused with valid, externally-sourced credentials.

  MITRE ATT&CK T1110.004 (Brute Force: Credential Stuffing) is
  therefore the precise technique mapping. Only enterprise-matrix
  T1110.004 is asserted; no additional techniques are claimed
  because no lateral movement or further tool deployment is
  documented in any source.

  motive set to `financial`: credential-stuffing attacks against
  rail/airline loyalty programmes are near-universally monetised via
  point theft, account resale on underground markets, or onward PII
  abuse (Dark Reading, CPO Magazine quote industry analysts on this
  pattern). No ransom was demanded (extortion=false kept), no
  political/ideological framing surfaced, and no government
  attribution exists. threat_actor, threat_actor_country,
  attribution_confidence remain null / unknown because the actor was
  never publicly identified.

  affected_systems kept as `data` only (no operational, payment or
  station IT systems were affected — Amtrak operations continued
  normally through the COVID-19 service reductions of April 2020).
  data_compromise.customer_data set true (Guest Rewards profile PII
  was the compromised material); intellectual_property and
  organizational_data set false (nothing corporate was exfiltrated).
  data_published set false — no public leak of the scraped loyalty
  data has been reported. impact.scope set `national`: Amtrak is a
  US-national operator and the compromised loyalty accounts span
  the entire customer base; however impact.duration_hours is left
  null because Amtrak disclosed only that access was blocked
  "within a few hours" of detection without a numeric figure, and
  magnitude.affected_passengers left null because Amtrak declined
  to disclose the count of affected accounts in either the Vermont
  or California filings.

  industry_sector `long_distance_passenger` and operator_type
  `incumbent` describe Amtrak accurately: it is the USA's federally
  chartered intercity passenger rail operator, operating the
  Northeast Corridor plus ~15 long-distance routes and 29 state-
  supported services, and it functions as the incumbent national
  passenger rail operator. supply_chain flipped from the DZSF
  default of `false` (unchanged) — this was a credential-reuse
  attack, not a third-party software compromise.

  confirmation_status `confirmed` retained: Amtrak (the affected
  organisation itself) has publicly confirmed the incident via
  regulator filings with two state Attorneys-General and via a
  customer notification letter (Montana DoJ hosts a sample copy).

  German-language press did not cover this event: heise.de, Golem.de,
  Tagesschau, the DSGVO-Portal Sicherheitsvorfalls-Datenbank and
  German Wikipedia's "Liste von Datendiebstählen" were all checked
  and returned no Amtrak 2020 entry; only the DZSF raw-data table
  itself anchors this case in the German-language record. No CERT
  advisory was issued — credential stuffing is generally handled via
  affected-organisation notifications rather than CERT/CVE advisories
  because it does not require exploitation of a specific technical
  vulnerability in the target.
