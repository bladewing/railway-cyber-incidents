description_en: >
  On the evening of 16 April 2020 Amtrak (National Railroad Passenger
  Corporation) detected that an unknown third party had used compromised
  username/password pairs — obtained from unrelated breaches of other
  services and reused by Amtrak customers — to log in to an unspecified
  number of Amtrak Guest Rewards loyalty accounts, a textbook credential
  stuffing attack (MITRE ATT&CK T1110.004). Amtrak's IT security team
  blocked the unauthorised access within a few hours of detection, reset
  passwords on all potentially affected accounts, engaged external
  cybersecurity experts and notified federal law enforcement. According
  to notifications filed on 29 May 2020 with the Vermont and California
  Attorneys-General, some personal information (names, email/contact
  details, account numbers, and previous journey and payment/gift-card
  details associated with the loyalty profile) may have been viewed, but
  no full credit-card numbers, banking data or Social Security numbers
  were accessed and no operational rail systems were affected. Impacted
  members received a complimentary one-year Experian IdentityWorks
  identity-theft monitoring subscription.
description_de: >
  Am Abend des 16. April 2020 stellte Amtrak (National Railroad
  Passenger Corporation) fest, dass Unbekannte mit aus anderen
  Datendiebstählen stammenden und von Kunden mehrfach verwendeten
  Zugangsdaten in eine nicht näher bezifferte Anzahl von Konten des
  Bonusprogramms „Amtrak Guest Rewards" eingedrungen waren — ein
  klassischer Credential-Stuffing-Angriff (MITRE ATT&CK T1110.004).
  Das IT-Sicherheitsteam beendete den unerlaubten Zugriff binnen
  weniger Stunden, setzte alle potenziell betroffenen Passwörter zurück,
  zog externe Cybersecurity-Experten hinzu und informierte die
  US-Bundesstrafverfolgung. Nach den am 29. Mai 2020 beim
  Generalstaatsanwalt von Vermont bzw. Kalifornien eingereichten
  Meldungen könnten Namen, E-Mail- und Kontaktdaten, Kontonummern
  sowie gespeicherte Reise-, Zahlungs- und Geschenkkartendetails
  eingesehen worden sein; vollständige Kreditkartennummern, Bankdaten
  oder Sozialversicherungsnummern waren nicht betroffen, operative
  Bahnsysteme ebenso wenig. Amtrak bot den betroffenen Mitgliedern
  eine einjährige kostenlose Identitätsschutz-Mitgliedschaft bei
  Experian IdentityWorks an.
