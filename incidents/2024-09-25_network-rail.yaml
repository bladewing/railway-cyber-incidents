description_en: >
  At approximately 17:03 local time on 25 September 2024, the public
  Wi-Fi splash pages at around 20 major UK railway stations managed
  by Network Rail - including London Euston, Manchester Piccadilly,
  and Liverpool Lime Street - were defaced to display an Islamophobic
  message beginning "We love you Europe" and listing prior
  terrorist attacks in Europe. Users attempting to connect to the
  free station Wi-Fi were presented with the message instead of the
  normal login page. The free Wi-Fi service was suspended across
  affected stations during the incident response. British Transport
  Police subsequently arrested an employee of Global Reach Technology,
  the third-party provider of Wi-Fi services at Network Rail
  stations, as the suspected perpetrator. The individual later
  received a suspended sentence. No personal data was compromised;
  the abuse of access was limited to splash-page defacement.
