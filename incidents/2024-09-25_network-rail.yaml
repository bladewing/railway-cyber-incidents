notes: >
  Dual classification: insider threat (the perpetrator was a legitimate
  employee of the Wi-Fi provider) and supply-chain (the compromised
  party was Network Rail's third-party Wi-Fi vendor Global Reach
  Technology, not Network Rail directly). Attack vector is therefore
  classified as insider with supply_chain=true. The impact was limited
  to a defacement of the captive-portal splash page; no credential
  theft or user-data exfiltration has been publicly reported. Rail
  operations and signalling were not affected.
