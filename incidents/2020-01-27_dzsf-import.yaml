notes: >
  The DZSF raw-data row dated 2020-01-27 (US, affected_systems=[data],
  confirmation=confirmed, origin DZSF-2020-23-S-1202) resolves
  unambiguously to the RailWorks Corporation ransomware incident of
  Monday 27 January 2020. The date, country, confirmation status and
  "data" affected-system bucket all match, and no other US railway-sector
  cyber incident on this date is publicly documented. Corrections
  against the DZSF stub: `extortion` set to true (ransomware with ransom
  demand is extortion by definition; DZSF default `false` is wrong);
  `motive` set to `financial` (ransomware for payment); `industry_sector`
  set to `other` because RailWorks is a rail-construction / signalling
  contractor rather than a passenger or freight operator or a network
  infrastructure manager — the incident still belongs in this dataset
  because RailWorks' work is exclusively railway infrastructure and the
  event was profiled by DZSF as a railway-sector cyber incident, but no
  passenger- or freight-operator vocabulary value fits. `operator_type`
  set to `private` (RailWorks is privately held). `supply_chain` kept
  `false`: although RailWorks is itself a supplier to rail operators,
  no public source describes the attack on RailWorks as having
  propagated from or to a third-party supplier — the compromise was of
  RailWorks' own corporate IT. `attack_vector` kept `unknown`: neither
  RailWorks nor any press, CERT or vendor source has disclosed how
  initial access was obtained. `malware` null: no specific ransomware
  family (Maze, DoppelPaymer, Sodinokibi/REvil, Ryuk, CLOP, Nefilim,
  Nemty, Sekhmet) was ever publicly linked to RailWorks despite the
  attack occurring in the same February-2020 window when these families
  dominated large-enterprise ransomware incidents; RailWorks has never
  named a variant. `threat_actor` / `threat_actor_country` null and
  `attribution_confidence` unknown: no attribution has been made public
  in five years, no leak-site post on Dopple Leaks / Maze News /
  Happy Blog was recorded, and no indictment mentions RailWorks.
  `mitre_attack_techniques` left `null` because no primary, CERT or
  vendor source maps this incident into the ATT&CK framework; T1486
  (Data Encrypted for Impact) and T1005/T1041 (data exfiltration)
  would be defensible inferences but remain the subagent's inference
  rather than a cited one. `affected_systems` kept as [data] only:
  corporate servers / PII store were hit; `internal_communication` is
  not added because no source describes email / chat outage, and
  `rail_operations`, `website`, `payment_system`, `station_it`,
  `internal_train_tracking`, `passenger_information` and
  `train_driver_communication` are all inapplicable to a contractor's
  HR-data breach. `data_published` set to false: the stolen data was
  never observed on a ransomware leak site and press reporting is
  consistent that RailWorks said there was "no evidence the information
  has been misused". `data_compromise.organizational_data` set to true
  (employee PII is organisational data); `customer_data` false (the
  stolen records were employees / contractors, not RailWorks' railway
  customers); `intellectual_property` false. `impact.scope` set to
  `international` because affected individuals span both the United
  States and Canada (RailWorks' 45 offices are distributed across both
  countries and the California AG filings plus press reporting confirm
  multi-state impact), hence `countries_impacted` also lists CA.
  `impact.magnitude.affected_trains` is `null` rather than 0 because
  although no train service was publicly reported as disrupted, the
  rail-infrastructure contracts that RailWorks was executing on the
  attack date could have suffered schedule slippage that was simply
  not reported publicly — leaving this null rather than inventing a
  number. `impact.magnitude.affected_passengers` null (not applicable
  to an employee PII breach at a contractor); `monetary_damage_eur`
  null (remediation cost, lost productivity and the subsequent
  class-action settlement amount were not publicly disclosed).
  Date provenance: press coverage (Bleeping Computer, SecurityWeek,
  Security Affairs, SiliconANGLE, OODA Loop, CISO MAG, TechNadu,
  RT&S, 2-Spyware, BreachExchange/SecLists, DataBreaches.net) is
  unanimous on Monday 27 January 2020 as the attack date, matching
  the DZSF event_date. The Coleman v. RailWorks class-action
  complaint alleges the attack "on or about January 14, 2020" — a
  deliberately fuzzy legal formulation that is not inconsistent with
  27 January 2020 and that sits alongside thirteen press sources
  naming 27 January. Event_date is therefore retained at 2020-01-27
  per the DZSF row and the press consensus; the class-action wording
  is noted here rather than reflected in the structured fields.
  `reported_date` set to 2020-02-28: the Bleeping Computer "Week in
  Ransomware" roundup on Friday 28 February 2020 is the earliest
  dated public third-party report; DataBreaches.net (2020-02-29) and
  the remaining cluster followed between 1 and 3 March 2020. The
  RailWorks notifications of 30 January and 7 February 2020 were
  private letters to affected individuals filed with the California
  AG rather than public reports, so they are not used as the
  reported_date anchor.
