description_en: >
  On Monday 27 January 2020 RailWorks Corporation — a privately held
  rail-infrastructure contractor headquartered in New York City that
  builds and maintains track, signalling and transit systems across the
  United States and Canada (about 3,500 employees, 45 offices, roughly
  USD 3 billion of active contracts) — was hit by a ransomware attack in
  which an unauthorised third party encrypted the company's servers and
  systems and exfiltrated personnel data. Personally identifiable
  information of current and former employees, their beneficiaries and
  dependents, and 1099 independent contractors was exposed (names,
  addresses, driver-licence numbers and government-issued IDs, Social
  Security numbers, dates of birth and dates of hire / termination /
  retirement). RailWorks notified affected individuals on 30 January and
  7 February 2020, filed three data-breach notifications with the
  California Office of the Attorney General, offered twelve months of
  Identity Guard Total credit monitoring, and publicly disclosed the
  incident around 28 February 2020. No ransomware family, attack vector
  or threat actor has been publicly named; the incident resulted in the
  Coleman v. RailWorks class-action (S.D.N.Y. 1:20-cv-02428-GBD)
  which settled in 2021 with identity-theft protection through 1 April
  2023 and up to US$50 time-reimbursement per class member. Rail
  operations of RailWorks' customers were not publicly reported as
  disrupted; impact was contained to the contractor's corporate IT.
description_de: >
  Am Montag, 27. Januar 2020, wurde die RailWorks Corporation — ein
  privat geführter US-Bahninfrastruktur-Dienstleister mit Sitz in New
  York City, der Gleisbau, Leit- und Sicherungstechnik sowie
  Nahverkehrssysteme in den USA und Kanada baut und instandhält (rund
  3.500 Beschäftigte, 45 Standorte, etwa 3 Mrd. US-Dollar laufende
  Aufträge) — Ziel eines Ransomware-Angriffs. Dabei verschlüsselten
  Unbekannte die Server und IT-Systeme des Unternehmens und entwendeten
  Personaldaten. Betroffen waren personenbezogene Daten aktueller und
  ehemaliger Beschäftigter, ihrer Angehörigen sowie von 1099-Vertrags­
  partnern (Namen, Adressen, Führerscheinnummern und Ausweisdaten,
  Sozialversicherungs­nummern, Geburtsdaten sowie Einstellungs-,
  Austritts- und Renteneintrittsdaten). RailWorks informierte die
  Betroffenen am 30. Januar und 7. Februar 2020, reichte drei
  Meldungen beim kalifornischen Generalstaatsanwalt ein, bot zwölf
  Monate Bonitätsüberwachung über Identity Guard Total an und machte
  den Vorfall um den 28. Februar 2020 öffentlich. Eine
  Ransomware-Familie, der Angriffsvektor oder ein Täterkreis wurden
  nicht öffentlich benannt. Die anschließende Sammelklage Coleman v.
  RailWorks (S.D.N.Y. 1:20-cv-02428-GBD) wurde 2021 verglichen
  (Bonitätsüberwachung bis 1. April 2023, bis zu 50 US-$
  Zeitaufwands-Entschädigung je Sammelklagemitglied). Eine Beein­
  trächtigung des Bahnbetriebs der Kunden von RailWorks wurde
  öffentlich nicht berichtet; der Schaden blieb auf die Unternehmens-IT
  des Auftragnehmers beschränkt.
