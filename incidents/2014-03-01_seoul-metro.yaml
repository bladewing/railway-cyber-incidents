description_en: >
  Between March and August 2014, unidentified attackers compromised
  several servers of Seoul Metro, the operator of four major subway
  lines in the South Korean capital carrying millions of daily
  commuters. Nearly 60 employee computers were infected with malware.
  The intrusion was disclosed in October 2014 by a South Korean ruling
  party legislator citing intelligence reports, and North Korea was
  named as the suspected perpetrator. Attribution has not been formally
  confirmed by Seoul Metro or by a judicial process. No operational
  disruption of subway services was reported; the intrusion appears to
  have been intelligence-collection oriented.
