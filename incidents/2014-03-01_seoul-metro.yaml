notes: >
  Part of the broader wave of North Korean cyber operations against
  South Korean critical infrastructure in 2014 (which also included
  the December 2014 Korea Hydro and Nuclear Power breach attributed to
  Kimsuky). The specific DPRK unit involved in the Seoul Metro
  intrusion is not publicly identified. event_date uses the start of
  the reported March-August 2014 activity window with month precision.
