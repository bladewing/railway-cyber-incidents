description_en: >
  Around early April 2018, Great Western Railway (GWR — the FirstGroup
  train-operating company running intercity and regional services on
  the Great Western main line between London Paddington, the West
  Country and South Wales) detected a sustained credential-stuffing
  campaign against its customer-facing portal gwr.com. Attackers
  replayed username/password pairs harvested from unrelated third-
  party breaches; the vast majority failed, but approximately 1,000
  of GWR's more than one million registered customer accounts were
  successfully accessed. GWR disclosed the incident publicly on
  11 April 2018, e-mailed the ~1,000 directly affected customers and
  force-reset passwords for the entire ~1 million-user base as a
  precaution. No unencrypted bank-card data is stored in gwr.com
  accounts, so the company stated payment-card details were not
  exposed; no train operations, safety-critical or signalling systems
  were affected.
description_de: >
  Anfang April 2018 entdeckte Great Western Railway (GWR — die
  FirstGroup-Zugbetreiberin auf der Great Western Main Line zwischen
  London Paddington, Südwestengland und Südwales) eine anhaltende
  Credential-Stuffing-Kampagne gegen das Kundenportal gwr.com. Die
  Angreifer spielten aus Drittbreaches erbeutete Nutzername-Passwort-
  Paare ab; die meisten Versuche scheiterten, rund 1.000 der über
  eine Million registrierten GWR-Kundenkonten wurden jedoch
  übernommen. GWR machte den Vorfall am 11. April 2018 öffentlich,
  informierte die ~1.000 unmittelbar Betroffenen per E-Mail und
  erzwang für die gesamte Nutzerbasis einen Passwort-Reset. Da bei
  gwr.com keine unverschlüsselten Zahlungsdaten gespeichert seien,
  seien laut GWR keine Kreditkartendaten abgeflossen; Betrieb,
  sicherheitsrelevante und Signaltechnik waren nicht betroffen.

