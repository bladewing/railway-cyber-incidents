notes: >
  Initial plan file slotted this as "2024-10-??_gwr-credential-stuffing"
  but the underlying reporting (The Register, Infosecurity Magazine,
  Security Affairs, Irish News, Silicon UK, and the RailUK Forums
  thread "All's Not Quiet on the Great Western Front: gwr.com accounts
  breached") all dates from 11 April 2018. Newer third-party
  aggregator pages that surfaced in 2024 (Cybersecurity Insiders,
  CybersecurityCaseStudies.com) re-report the same April-2018 incident
  without a new event; no independent 2024 GWR credential-stuffing
  incident is corroborated. industry_sector=long_distance_passenger
  — GWR's flagship route is the London Paddington ↔ Bristol / Exeter /
  Penzance / Cardiff / Swansea intercity services, plus regional
  branches. operator_type=private (FirstGroup plc DfT franchisee).
  attack_vector=credential_theft and MITRE T1110.004 (Credential
  Stuffing) are the precise classifications; mirrors the dataset's
  2020-04-16 and 2024-05-15 Amtrak Guest Rewards credential-stuffing
  entries. affected_passengers=1000 for the directly-compromised
  accounts; the ~1 M force-reset is inconvenience, not compromise.
  data_compromise.customer_data=true (profile-level access to
  1,000 accounts is a customer-data impact); payment data was not
  exposed per GWR's statement.
