description_en: >
  On the morning of 1 July 2020 Trinity Metro — the public transit
  authority for Fort Worth and Tarrant County, Texas, which operates
  city bus services, the TEXRail hybrid rail line between downtown
  Fort Worth and DFW International Airport, the Trinity Railway
  Express commuter rail to Dallas (jointly with DART), ACCESS
  paratransit, ZIPZONE microtransit and vanpool services — disclosed
  in a passenger alert on ridetrinitymetro.org that "all of our phone
  lines are down including our customer service line and ACCESS
  booking system" and provided a temporary alternate telephone number
  (817-492-6733) for riders who had ACCESS trips scheduled that day.
  The following day, 2 July 2020, the Circus Spider operators of the
  NetWalker ransomware-as-a-service (MITRE ATT&CK Software S0457)
  added Trinity Metro to their TOR-based "dump" leak site, publishing
  screenshots of more than 200 folder names exfiltrated from the
  agency's network before the encryption stage — including folders
  labelled "Accounting and HR Shared", "Daily Operations Documents",
  "Planning Documents", "Security", "Vendor W9s", "Passenger
  information system" and "ACCESS stuff" — and set a ransom deadline
  of 11 July 2020 for publication of the stolen data. By around
  5 July 2020 Trinity Metro's entry had been removed from the
  NetWalker leak site, which iTWire and subsequent commentators
  interpreted as a likely ransom payment; Trinity Metro itself
  declined to discuss cybersecurity publicly. Bus, rail and
  paratransit vehicle operations continued — only back-office IT,
  customer-service telephony and the ACCESS dispatch/booking system
  were impacted. The incident is one of the early confirmed
  ransomware-as-a-service compromises of a U.S. public-transit
  agency, attributable via the NetWalker leak-site post to the
  Russian-speaking Circus Spider operator group and one of its
  affiliates (the NetWalker affiliate programme was later partly
  dismantled in a January 2021 DOJ-led international operation that
  indicted Canadian affiliate Sébastien Vachon-Desjardins for ≥91
  NetWalker intrusions since April 2020).
description_de: >
  Am Morgen des 1. Juli 2020 veröffentlichte Trinity Metro — die
  öffentliche Nahverkehrsbehörde von Fort Worth und Tarrant County
  (Texas), die Stadtbusse, die Hybridbahn TEXRail zwischen der
  Innenstadt von Fort Worth und dem Flughafen DFW, die
  Vorortbahn Trinity Railway Express nach Dallas (gemeinsam mit
  DART), den Paratransit-Dienst ACCESS sowie ZIPZONE-Mikrotransit
  und Fahrgemeinschaften betreibt — auf ridetrinitymetro.org eine
  Fahrgastmeldung, wonach „aufgrund eines technischen Problems alle
  Telefonleitungen einschließlich Kundenservice und ACCESS-
  Buchungssystem ausgefallen" seien; ersatzweise wurde die Nummer
  817-492-6733 bekanntgegeben. Am Folgetag, dem 2. Juli 2020,
  setzten die Circus-Spider-Betreiber des Ransomware-as-a-Service
  NetWalker (MITRE ATT&CK Software S0457) Trinity Metro auf ihre
  TOR-Leak-Site: Screenshots zeigten mehr als 200 vor der
  Verschlüsselung exfiltrierte Ordnernamen — darunter „Accounting
  and HR Shared", „Daily Operations Documents", „Planning
  Documents", „Security", „Vendor W9s", „Passenger information
  system" und „ACCESS stuff" — und es wurde eine Frist bis zum
  11. Juli 2020 gesetzt, bis zu der die Daten veröffentlicht werden
  sollten, falls kein Lösegeld gezahlt werde. Um den 5. Juli 2020
  verschwand Trinity Metro von der Leak-Site; Branchenbeobachter
  (iTWire u.a.) werteten dies als wahrscheinliche Lösegeldzahlung,
  Trinity Metro selbst kommentierte öffentlich nicht. Der Bus-,
  Schienen- und Paratransit-Betrieb lief weiter; betroffen waren
  Back-Office-IT, Kundenservice-Telefonie und das Dispatch-/
  Buchungssystem ACCESS. Der Vorfall gilt als einer der ersten
  bestätigten RaaS-Angriffe auf eine US-amerikanische
  ÖPNV-Behörde und wird über die Leak-Site-Einträge der
  russischsprachigen Gruppe Circus Spider sowie einem ihrer
  Affiliates zugeordnet — das NetWalker-Affiliate-Programm wurde
  in einer international koordinierten Aktion des US-Justiz-
  ministeriums im Januar 2021 teilweise zerschlagen (Anklage gegen
  den kanadischen Affiliate Sébastien Vachon-Desjardins wegen
  mindestens 91 NetWalker-Angriffen seit April 2020).
