notes: >
  Identification: the DZSF raw-data stub dated 2020-07-02 (US,
  malware=NetWalker, threat_actor="Netwalker, Circus Spider",
  extortion=true, data_published=true, affected_systems=[
  internal_communication, website, data]) unambiguously matches the
  Trinity Metro / Fort Worth Transportation Authority NetWalker
  ransomware incident of 1-2 July 2020. Trinity Metro is the only
  rail-operating U.S. transit victim publicly attributed to NetWalker
  in early July 2020 (corroborated by SC Media, iTWire, Cyware,
  Infima Security, the Fort Worth Star-Telegram, Ground News, the
  Emsisoft and Unit 42 NetWalker victim profiles, the ransomware.live
  historical victim index, and TCRP Synthesis 158's cybersecurity
  incidents appendix). No other rail operator in the NetWalker victim
  list maps to 2020-07-02.

  Dates: Trinity Metro's own passenger alert on ridetrinitymetro.org
  is dated 1 July 2020 (the morning the phone/ACCESS booking systems
  went down). The NetWalker leak-site post appeared 2 July 2020
  (matching the DZSF event_date of 2020-07-02 and the SC Media /
  Ground News public-disclosure date). The DZSF date therefore
  reflects the *reported* date (NetWalker leak-site publication /
  SC Media coverage) rather than the operational-impact date. I have
  set event_date to 2020-07-01 (the earliest attested operational
  symptom) and reported_date to 2020-07-02 so that event_date ≤
  reported_date as required. The ransom deadline was 11 July 2020;
  Trinity Metro's leak-site entry disappeared around 5 July 2020
  (iTWire update), suggesting either payment or a negotiated
  withdrawal — the agency declined to discuss it publicly. The
  actual initial-compromise date is unknown; NetWalker affiliates
  typically spent days to weeks inside a network exfiltrating data
  before the encryption stage, so the real intrusion is likely from
  mid- to late-June 2020, but no source quantifies this so I leave
  event_date at 2020-07-01.

  attack_vector left `unknown`: NetWalker's known initial-access
  methods in 2020 were (a) phishing emails with malicious VBScript/
  PowerShell attachments (frequently COVID-19 themed) and (b)
  exploitation of Pulse Secure VPN CVE-2019-11510 and Telerik UI
  CVE-2019-18935 on public-facing appliances (FBI Flash
  MI-000130-MW, 28 July 2020; Unit 42; Emsisoft). Neither Trinity
  Metro nor any secondary source has publicly disclosed the specific
  initial vector used against Trinity Metro, so `unknown` is the
  correct DZSF-conservative call rather than guessing `phishing` or
  `exploit`.

  supply_chain: false — this was a direct RaaS intrusion into
  Trinity Metro's own network, not a third-party software compromise.

  malware: NetWalker (also known historically as "Mailto"; MITRE
  ATT&CK Software S0457, created 2020-05-26). Family set to
  "NetWalker" (single-family brand; Circus Spider is the operator
  group, not the family).

  motive `financial`: classic double-extortion RaaS — encrypt-and-
  leak for cryptocurrency ransom. No geopolitical or ideological
  framing.

  threat_actor: The NetWalker RaaS is run by the Russian-speaking
  "Circus Spider" actor group (CrowdStrike's naming; Unit 42,
  Emsisoft, Heimdal, UpGuard corroborate). The Trinity Metro
  attack itself was presumably carried out by one of Circus Spider's
  affiliates (the identity of the specific affiliate is not
  publicly known; it could plausibly be Sébastien Vachon-Desjardins,
  later indicted for ≥91 NetWalker attacks since April 2020, but no
  source links him specifically to Trinity Metro, so I attribute the
  incident at the RaaS-brand level only).

  threat_actor_country RU: Circus Spider is consistently reported as
  Russian-speaking and based in Russia / the CIS (Unit 42, Emsisoft,
  Heimdal); the NetWalker builder explicitly forbade affiliates from
  attacking targets in Russia/CIS. This is reported (not confirmed
  by government attribution), hence attribution_confidence `reported`.

  mitre_attack_techniques: the list maps NetWalker's documented
  enterprise-ATT&CK behaviour per MITRE S0457 and Unit 42:
    - T1486 Data Encrypted for Impact (the ransomware encryption)
    - T1490 Inhibit System Recovery (shadow-copy deletion via
      PowerShell / WMI)
    - T1059.001 Command and Scripting Interpreter: PowerShell
      (NetWalker is PowerShell-based, runs in-memory)
    - T1003 OS Credential Dumping (known lateral-movement step)
    - T1055 Process Injection (reflective DLL into legitimate
      processes)
    - T1562.001 Impair Defenses: Disable or Modify Tools (detects
      and terminates security software)
    - T1047 Windows Management Instrumentation (shadow-copy deletion
      via WMI)
  These are NetWalker capability mappings from MITRE S0457 / Unit 42;
  no Trinity-Metro-specific forensic report has been published, so
  they represent the family's documented TTPs rather than per-incident
  observations.

  affected_systems: the DZSF triple (internal_communication, website,
  data) is retained and well supported — phone lines and the ACCESS
  dispatch/booking system went down (internal_communication), the
  ridetrinitymetro.org public notice page documented the outage
  (website, meaning the site was used as outage-notification surface
  though the site itself was not defaced), and >200 folders of
  corporate data were exfiltrated and teased on the NetWalker leak
  site (data). Bus, TEXRail and TRE revenue operations continued —
  rail_operations, train_driver_communication, internal_train_tracking
  and passenger_information (train-related) are NOT claimed.

  data_published true: the NetWalker leak-site post teased >200
  folder names with screenshots, which is the "published sample"
  stage of the double-extortion kill chain; full bulk publication
  appears to have been averted (the Trinity Metro entry disappeared
  around 5 July), but the initial tease was public. I keep
  data_published=true (matching the DZSF value) because the teased
  sample itself is public data.

  impact.scope regional: Trinity Metro serves Fort Worth and Tarrant
  County plus the TRE commuter-rail corridor to Dallas — a regional
  (Dallas–Fort Worth metropolitan) footprint, not national.
  impact.data_compromise.customer_data true (ACCESS-booking/
  paratransit rider data exists in the environment and was in the
  teased folder names), organizational_data true (HR, accounting,
  planning, security, vendor W9s folders), intellectual_property
  false (no proprietary technology reported).

  industry_sector `urban_transit`: Trinity Metro is primarily a
  metropolitan public-transit authority (bus + light-/hybrid-rail +
  commuter-rail + paratransit). `regional_passenger` would fit TRE
  alone, and `long_distance_passenger` does not apply — the overall
  agency is best represented by `urban_transit`.

  operator_type `public_authority`: Trinity Metro is the Fort Worth
  Transportation Authority, a political subdivision of the State of
  Texas created under Chapter 452 of the Texas Transportation Code
  — a public transit authority, not an incumbent national operator
  and not a private operator.

  confirmation_status `confirmed`: Trinity Metro publicly confirmed
  the systems outage via its own passenger-alert web page; the
  NetWalker operators publicly claimed the attack on their leak
  site with corroborating screenshots; the Fort Worth Star-Telegram,
  SC Media, iTWire, Cyware, Infima and Ground News all report it as
  a confirmed incident; TCRP Synthesis 158 (National Academies)
  catalogues it. The agency never formally named NetWalker or
  publicly disclosed whether a ransom was paid — but the
  *occurrence* of a ransomware attack is confirmed beyond reasonable
  doubt.

  German-language press: searches of heise.de, Golem.de, Tagesschau,
  Eurailpress, DSGVO-Portal Sicherheitsvorfalls-Datenbank and
  general German-language results returned no Trinity Metro 2020
  coverage. The DZSF catalogue itself remains the only German-
  language anchor. This is consistent with the low German-media
  salience of a US metropolitan transit agency; no escalation is
  warranted.
