description_en: >
  Between late November and 1 December 2020 the South Coast British
  Columbia Transportation Authority (TransLink) — the statutory public
  authority responsible for regional transportation in Metro Vancouver,
  operating the SkyTrain automated rapid-transit Expo, Millennium and
  Canada lines, the West Coast Express commuter rail service to Mission,
  the SeaBus, a bus network of roughly 8,500 employees, and overseeing
  the subsidiaries Coast Mountain Bus Company, British Columbia Rapid
  Transit Company, West Coast Express Ltd. and the Metro Vancouver
  Transit Police — was breached by an affiliate of the Egregor
  ransomware-as-a-service operation (MITRE ATT&CK S0554). According to
  the 2024 judgment of the British Columbia Court of Appeal
  (G.D. v. South Coast British Columbia Transportation Authority,
  2024 BCCA 252), initial access was obtained through a successful
  phishing attempt on an employee of one of TransLink's subsidiaries.
  TransLink first publicly described "issues" with its computing
  systems on 1 December 2020 and confirmed it was investigating
  "suspicious network activity" on 2 December. The attack became
  unmistakable on the evening of 2–3 December when TransLink's
  office printers began repeatedly spooling the Egregor ransom
  letter — a signature Egregor tactic. CEO Kevin Desmond
  acknowledged the ransomware attack in a public statement on
  3 December 2020 and confirmed that "immediate steps" had been
  taken to isolate and shut down key IT assets. Customer-facing
  impact was concentrated on payment and information systems:
  credit- and debit-card purchases at Compass vending machines and
  Tap-to-Pay on fare gates were unavailable for three days (restored
  Thursday 3 December evening per CBC News), the TransLink Trip
  Planner and the customer-service phone lines were offline, the
  Next Bus real-time information feed was broken and was not fully
  restored until 11 May 2021, and the bus-fleet radio system was
  non-functional for more than 24 hours, leaving drivers unable to
  communicate with dispatch and the authority unable to track buses
  in real time on the second day of the attack. Payroll and
  employee-portal systems were shut down, forcing TransLink to pay
  employees by cash advance at approximately 65% of normal pay
  without regular deductions. Revenue bus and SkyTrain service
  itself continued to operate, and no transit safety or signalling
  systems were affected. On the data-theft side, the attackers
  accessed restricted network drives holding payroll and benefits
  administration files — including banking information, social
  insurance numbers, salary and wage rates, deductions and tax
  withholdings — for current, former and retired employees of
  TransLink, Coast Mountain Bus Company, British Columbia Rapid
  Transit Company, West Coast Express, former BC Transit employees,
  third-party HandyDART operators, some spouses and dependents, and
  Metro Vancouver Transit Police, as well as scanned personal cheques
  used to purchase TaxiSaver coupons under the Access Transit
  Program. Roughly 40,000 individuals received notification letters
  in 2021. Customer Compass fare-payment data was not accessed, as
  TransLink uses a third-party payment processor and does not store
  cardholder data. The attackers demanded a ransom reported at
  approximately CA$7.5 million (≈ US$6 million); TransLink declined
  to pay and restored systems from backups over a period of
  approximately five months. Two years of free credit monitoring
  were offered to affected individuals. As of the TransLink Cyber
  Incident page the authority states it is not aware of any misuse
  of the accessed personal information. The incident subsequently
  became the basis of a class-action lawsuit (2024 BCCA 252) that
  the Supreme Court of Canada declined to hear on further appeal in
  March 2025, allowing the class proceeding to continue. The DZSF
  2023 event_date of 2020-12-05 corresponds to the Saturday after
  the public ransomware confirmation and likely reflects DZSF's
  press-coverage cluster rather than the detection date; the
  event_date is corrected here to 2020-12-01 per TransLink's own
  disclosure.
description_de: >
  Zwischen Ende November und dem 1. Dezember 2020 wurde die
  South Coast British Columbia Transportation Authority (TransLink)
  — die gesetzliche öffentlich-rechtliche Verkehrsbehörde der
  Region Metro Vancouver, Betreiberin des vollautomatischen SkyTrain
  (Expo-, Millennium- und Canada-Linie), der Pendlerbahn West Coast
  Express nach Mission, der SeaBus-Passagierfähre und eines
  Busnetzes mit rund 8.500 Beschäftigten sowie Konzernmutter der
  Tochtergesellschaften Coast Mountain Bus Company, British Columbia
  Rapid Transit Company, West Coast Express Ltd. und der Metro
  Vancouver Transit Police — Ziel eines Ransomware-Angriffs durch
  einen Affiliate der Egregor-RaaS-Operation (MITRE ATT&CK S0554).
  Nach dem Urteil des Berufungsgerichts von British Columbia
  (G.D. v. South Coast British Columbia Transportation Authority,
  2024 BCCA 252) erlangten die Angreifer den Erstzugang über eine
  erfolgreiche Phishing-Attacke auf eine Beschäftigte einer
  TransLink-Tochter. TransLink meldete am 1. Dezember 2020
  zunächst „Probleme" mit den IT-Systemen, am 2. Dezember bestätigte
  sie eine Untersuchung „verdächtiger Netzwerkaktivität". In der
  Nacht vom 2. auf den 3. Dezember druckten TransLink-Drucker
  wiederholt den typischen Egregor-Erpresserbrief — ein
  charakteristisches Merkmal der Gruppe. CEO Kevin Desmond
  bestätigte am 3. Dezember 2020 öffentlich den Ransomware-Angriff
  und erklärte, „zentrale IT-Ressourcen" seien umgehend isoliert
  und heruntergefahren worden. Fahrgastseitig betraf der Vorfall
  vor allem Bezahl- und Informationssysteme: Kredit- und
  EC-Karten-Bezahlung an Compass-Automaten und per Tap-to-Pay an
  den Fahrzeugsperren war drei Tage lang (bis zum Abend des
  3. Dezember laut CBC News) nicht möglich, der Trip-Planner und
  die Kunden-Hotline waren offline, die Echtzeit-Fahrgastinformation
  „Next Bus" blieb gestört und wurde erst am 11. Mai 2021 vollständig
  wiederhergestellt, und das Funksystem der Busflotte fiel mehr als
  24 Stunden aus, sodass Fahrer nicht mit der Leitstelle
  kommunizieren konnten und TransLink Busse am zweiten Angriffstag
  nicht mehr live verfolgen konnte. Gehaltsabrechnung und
  Mitarbeiterportal waren ebenfalls heruntergefahren; TransLink
  zahlte Beschäftigten Vorschüsse in Höhe von rund 65 % des
  Normallohns ohne die üblichen Abzüge. Der eigentliche Bus- und
  SkyTrain-Betrieb lief durchgehend weiter; keine Sicherheits- oder
  Leittechnik war betroffen. Datenseitig griffen die Angreifer auf
  ein abgeschottetes Netzlaufwerk mit Personaldaten zu —
  Bankverbindungen, kanadische Sozialversicherungs­nummern (SIN),
  Gehalts- bzw. Stundenlohnsätze, Abzüge und Steuerquellen­
  abzüge — für aktuelle, ehemalige und ausgeschiedene Beschäftigte
  von TransLink, Coast Mountain Bus Company, British Columbia Rapid
  Transit Company, West Coast Express, ehemaligen BC-Transit-
  Beschäftigten, externen HandyDART-Operatoren, teils Ehepartnern
  und Angehörigen sowie der Metro Vancouver Transit Police, und
  außerdem auf Scans privater Schecks zum Kauf von TaxiSaver-
  Gutscheinen im Rahmen des Access Transit Program. Rund 40.000
  Personen erhielten 2021 Benachrichtigungsschreiben. Die
  Compass-Zahlungsdaten der Fahrgäste waren nicht betroffen, da
  TransLink die Kartenabwicklung an einen Zahlungsdienstleister
  ausgelagert hat und keine Karteninhaberdaten speichert. Die
  Angreifer forderten rund 7,5 Mio. CAD (etwa 6 Mio. USD); TransLink
  lehnte die Zahlung ab und stellte die Systeme über rund fünf
  Monate aus Backups wieder her. Betroffenen wurden zwei Jahre
  Bonitätsüberwachung angeboten. Nach Angaben der Cyber-Incident-
  Seite von TransLink ist der Behörde bislang kein Missbrauch der
  abgeflossenen Daten bekannt. Aus dem Vorfall erwuchs eine
  Sammelklage (2024 BCCA 252), deren Weiterführung der kanadische
  Supreme Court im März 2025 durch Ablehnung der Revision
  ermöglicht hat. Das von DZSF in der Rohdatentabelle geführte
  event_date 2020-12-05 liegt am Samstag nach der öffentlichen
  Bestätigung und spiegelt vermutlich das DZSF-Pressecluster wider;
  das event_date wird hier auf den 1. Dezember 2020 (TransLink-
  eigene Erstmitteilung) korrigiert.
