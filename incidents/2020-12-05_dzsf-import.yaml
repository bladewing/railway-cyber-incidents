notes: >
  Identification: the DZSF raw-data row for 2020-12-05 (country CA,
  confirmed, affected_systems=[train_driver_communication,
  payment_system, passenger_information, data], extortion=true,
  motive=financial) uniquely matches the publicly disclosed Egregor
  ransomware attack against Metro Vancouver's TransLink detected on
  1 December 2020 and publicly confirmed by CEO Kevin Desmond on
  3 December 2020. No other Canadian rail or public-transit cyber
  incident is documented for early December 2020; the neighbouring
  Canadian DZSF entry (2020-10-28_ransomexx) corresponds to the
  separate Société de transport de Montréal (STM) RansomExx attack
  of 19 October 2020 detected on 28 October. The match is multiply
  corroborated by a BC Court of Appeal judgment (2024 BCCA 252),
  TransLink's own CEO statement, TransLink's dedicated cyber-
  incident information page, CBC News, Global News (two pieces),
  CTV News / The Canadian Press, BleepingComputer (two pieces),
  Bitdefender, Threatpost, SiliconANGLE, Security Newspaper,
  Mass Transit Magazine, Control Engineering, Wikipedia and the
  MITRE ATT&CK entries for Egregor (S0554) and Data Encrypted for
  Impact (T1486).

  Dates: the DZSF event_date 2020-12-05 is inconsistent with
  TransLink's own disclosure, CEO Desmond's 3 December 2020
  statement and every contemporaneous press report. 2020-12-05 is
  a Saturday in the coverage cluster and is not attested in any
  source. event_date corrected to 2020-12-01 (TransLink's first
  public service-issue notice and the date on which the DDoS/ICMP
  disruption began inside the network per BC Court of Appeal
  2024 BCCA 252 and TransLink's own CEO statement). The filename
  stem is kept as `2020-12-05_dzsf-import` so that `id == stem`
  continues to hold and no rename is required; the incident-body
  event_date correctly reflects reality. reported_date set to
  2020-12-02 — the Global News tweet of the printed ransom note by
  Jordan Armstrong and the first press references to a cyber
  attack (CBC and Global News early editions) are dated 2 December
  2020, one day before CEO Desmond's 3 December statement.

  target_organization: South Coast British Columbia Transportation
  Authority (TransLink) — a Provincial statutory authority under
  the South Coast British Columbia Transportation Authority Act,
  with subsidiaries Coast Mountain Bus Company (CMBC), British
  Columbia Rapid Transit Company (BCRTC, SkyTrain Expo + Millennium
  lines), West Coast Express Ltd. (commuter rail to Mission) and
  Metro Vancouver Transit Police. All four subsidiaries are listed
  explicitly as victims of the data-theft component.
  industry_sector set to `urban_transit`: the overwhelming majority
  of affected services (SkyTrain, Coast Mountain buses, SeaBus,
  Compass fare gates) are urban-transit modes; the West Coast
  Express commuter-rail component, which could alternately fit
  `regional_passenger`, is secondary. operator_type
  `public_authority`: TransLink is a Provincial statutory authority
  with a mayors' council and board of directors — the canonical
  fit for `public_authority`.

  attack_vector `phishing`: the 2024 BC Court of Appeal judgment
  G.D. v. South Coast British Columbia Transportation Authority,
  2024 BCCA 252 states explicitly that "third party hackers had
  gained access into TransLink's computer network through a
  successful phishing attempt on an employee of one of TransLink's
  subsidiaries." This is corroborated by Egregor's standard modus
  operandi (phishing email → Qakbot → Cobalt Strike) as documented
  by BankInfoSecurity, Group-IB, Palo Alto Unit 42, MITRE ATT&CK
  S0554 and Emsisoft. The DZSF default `unknown` is therefore
  corrected to `phishing`. supply_chain kept false (no supply-
  chain involvement reported).

  malware: Egregor (MITRE S0554), family Egregor / Sekhmet (the
  RaaS successor to Maze). The ransom note, printer-bomb signature
  and Tor contact instructions are all standard Egregor indicators.
  threat_actor left as "Egregor ransomware affiliate (unattributed
  individual)" — the Egregor operation is confirmed as the
  responsible group but the specific affiliate was never publicly
  named. Ukrainian police arrested suspected Egregor affiliates in
  February 2021, but no link to the TransLink attack was ever
  publicly established. threat_actor_country left null and
  attribution_confidence set to `reported` — the Egregor
  attribution is reported by press and by TransLink's own
  acknowledgement of the printed Egregor ransom note, but there is
  no formal CERT or law-enforcement attribution naming the
  specific actor or country.

  extortion kept `true` (DZSF correct). motive kept `financial`.
  mitre_attack_techniques: T1566 Phishing (court-confirmed initial
  vector), T1486 Data Encrypted for Impact (file encryption across
  TransLink systems — the canonical ransomware technique),
  T1039 Data from Network Shared Drive (the attackers accessed a
  restricted network drive with payroll and benefits files —
  literal match to T1039), T1059.001 PowerShell and T1059.003
  Windows Command Shell (both attested in the MITRE S0554 Egregor
  software profile). Further Egregor-profile techniques (T1055
  Process Injection, T1027.002 Software Packing, T1562.001
  Impair Defenses etc.) are NOT included because their use in the
  TransLink case specifically was not publicly documented — only
  the techniques directly attested for this incident or
  authoritative on-host are listed.

  affected_systems enriched to [train_driver_communication,
  payment_system, passenger_information, internal_communication,
  data, website]. DZSF's four values are retained; two are added.
  `train_driver_communication` (DZSF value; German original
  "Komm. mit Fahrzeugführer") is preserved and documented as the
  bus-fleet radio outage (>24 hours, sources inside TransLink and
  the Bleeping Computer follow-up) — the vocabulary label
  "Communication with train driver (GSM-R, radio)" is interpreted
  inclusively to cover bus-driver radio for a multi-modal public
  transport authority. `payment_system` covers the Compass tap-
  to-pay fare gate outage (3 days per CBC News) and credit/debit
  purchases at Compass vending machines. `passenger_information`
  covers the Trip Planner outage (Desmond statement, Global News)
  and the Next Bus real-time feed, which was not fully restored
  until 11 May 2021 (~5 months). `internal_communication` is
  added: phone systems, customer-service phone lines and employee
  portal were all shut down (Bleeping Computer, Bitdefender,
  Global News). `data` covers the restricted-network-drive
  exfiltration affecting ~40,000 employees and associated persons
  (TransLink cyber-incident page, 2024 BCCA 252, Global News).
  `website` is added because Trip Planner, online services and
  phones were all described as disabled (TransLink own statement,
  Threatpost, Bitdefender, Bleeping Computer). `rail_operations`,
  `internal_train_tracking` and `station_it` are NOT added:
  SkyTrain revenue service continued without interruption,
  signalling / CBTC was not affected, and no source describes
  station IT beyond the Compass payment subsystem as affected —
  the TransLink CEO explicitly stated "transit safety systems
  were not affected."

  data_published set to false: no TransLink data was ever observed
  on the Egregor leak site ("Egregor News" on the Tor network);
  the attackers threatened publication within three days but
  TransLink's backup-led recovery appears to have completed
  before they followed through, and as of the TransLink cyber-
  incident page (June 2021 privacy-review conclusion) the
  authority states it is "not aware of any misuse" of accessed
  personal information.

  impact.scope set to `regional`: Metro Vancouver is a metropolitan
  region within one Canadian province. impact.duration_hours null
  because different subsystems were restored on different
  timelines (payment 3 days, bus radio >24 hours, Next Bus ~5
  months) and no single authoritative figure exists.
  impact.magnitude.affected_trains null (SkyTrain/West Coast
  Express/bus revenue service continued throughout;
  affected_passengers null (riders were inconvenienced but the
  count was not disclosed and is ambiguous for a payment-/info-
  system outage); monetary_damage_eur null (TransLink declined
  the CA$7.5M / US$6M ransom demand and has not disclosed the
  recovery cost or the insurance payout).
  impact.data_compromise.organizational_data true (employee
  banking, SIN, payroll, benefits and tax data for TransLink,
  CMBC, BCRTC, WCE, Transit Police and third-party HandyDART
  operators — explicit in TransLink's own statement and the
  2024 BCCA 252 judgment), customer_data false (Compass
  cardholder data is handled by a third-party processor and
  was not accessed — explicit in TransLink's CEO statement and
  cyber-incident page; only TaxiSaver cheque scans of TaxiSaver
  coupon purchasers could arguably be "customer" data, but the
  TaxiSaver Access Transit Program is an accessibility programme
  for clients of HandyDART and is treated as organisational
  rather than general fare-paying customer data), intellectual_
  property false.

  confirmation_status `confirmed` retained: TransLink itself
  publicly acknowledged the ransomware attack through CEO
  Kevin Desmond's statement on 3 December 2020 and operates a
  dedicated cyber-incident information page; the BC Court of
  Appeal judgment formally records the incident.

  German-language press: heise.de, Golem.de, Tagesschau and the
  DSGVO-Portal Sicherheitsvorfalls-Datenbank were checked and
  return no TransLink 2020 entry. Only the DZSF raw-data table
  anchors this incident in the German-language record —
  description_de is therefore a translation of the English facts
  rather than a citation to a German-language primary or
  secondary source. No CERT/CSIRT advisory (CCCS, CSE, CISA,
  US-CERT, BSI, CERT-Bund) was issued publicly — the incident
  was handled through TransLink's own incident response and
  external forensics.

  Deconfliction: the October 2020 STM (Société de transport de
  Montréal) RansomExx attack is a distinct Canadian transit
  incident and is already covered separately by
  `2020-10-28_ransomexx.yaml`. The 2021 Toronto Transit
  Commission (TTC) ransomware attack is a year later and
  unrelated. A separately named "Translink" transit authority in
  Northern Ireland is a naming collision only and not related.
  TransLink's own 2019 Metro Vancouver data-breach incident
  (a separate cloud-storage vendor exposure) is unrelated.
