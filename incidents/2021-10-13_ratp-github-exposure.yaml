description_en: >
  On 13 October 2021, vpnMentor's research team discovered an
  unsecured, internet-facing server belonging to Régie Autonome des
  Transports Parisiens (RATP) — the public authority operating the
  Paris Métro, RER (shared with SNCF), tramway and bus network. The
  exposed server held configuration files and full source code for
  an RATP employee-benefits web portal, together with a database of
  approximately 57,000 current and former RATP employees (names,
  e-mail addresses, RATP login names and outdated MD5-hashed
  passwords). Records of senior executives and members of the RATP
  cyber-security team were among the exposed entries. The
  configuration files included live API keys, including at least
  one key linked to an RATP GitHub account, which could have allowed
  an attacker to modify software projects, embed backdoors or
  ransomware in RATP apps, and pivot into production systems.
  vpnMentor disclosed responsibly; the server was secured before
  public reporting and the keys were rotated. No rail-operational
  or signalling systems were impacted; no passenger data was exposed.
description_de: >
  Am 13. Oktober 2021 entdeckte das Forschungsteam von vpnMentor
  einen ungesicherten, aus dem Internet erreichbaren Server der
  Régie Autonome des Transports Parisiens (RATP) — der öffentlich-
  rechtlichen Betreiberin von Pariser Metro, RER (gemeinsam mit
  SNCF), Tram und Bus. Auf dem Server lagen Konfigurationsdateien
  und vollständiger Quellcode eines Mitarbeiterportals sowie eine
  Datenbank mit rund 57.000 aktuellen und ehemaligen
  RATP-Beschäftigten (Namen, E-Mail-Adressen, RATP-Login-Namen und
  veraltete MD5-Passwort-Hashes). Datensätze von Geschäftsführung
  und Cybersicherheitsteam waren betroffen. Die Konfigurationsdateien
  enthielten aktive API-Schlüssel, darunter mindestens einen mit
  Zugriff auf ein RATP-GitHub-Konto; ein Angreifer hätte damit
  Softwareprojekte manipulieren, Backdoors oder Ransomware in
  RATP-Apps einschleusen und in produktive Systeme eindringen können.
  vpnMentor meldete verantwortungsvoll; der Server wurde vor der
  Veröffentlichung abgesichert und die Schlüssel rotiert. Betrieb
  und Signaltechnik waren nicht betroffen, Fahrgastdaten nicht
  exponiert.

