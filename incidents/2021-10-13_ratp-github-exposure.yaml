notes: >
  industry_sector=urban_transit matches the dataset's handling of
  other metropolitan transport authorities (BVG 2025-04-07, WMATA
  2024-05-07, RVBW 2025-03-21). operator_type=public_authority
  because RATP is an établissement public à caractère industriel
  et commercial (EPIC) owned by the French state. attack_vector=
  exploit reflects the root cause: a publicly reachable server with
  no authentication allowed directory-listing access. MITRE
  T1530 (Data from Cloud Storage Object) and T1552.001 (Unsecured
  Credentials: Credentials in Files) capture the two data-classes
  exposed (employee PII and API keys). confirmation_status=reported:
  vpnMentor is a primary security-researcher source, independently
  republished by Infosecurity Magazine, Bitdefender and Cyware; RATP
  acknowledged the responsible-disclosure fix but has not published
  a formal incident statement, so the record stays at reported
  rather than confirmed. event_date=2021-10-13 is the vpnMentor
  discovery day; reported_date=2021-11-11 is the coordinated public-
  disclosure day. data_published=false — the leak was found by
  researchers, secured before criminal exploitation, and not dumped
  publicly. threat_actor_country/null because no malicious actor
  ever appears to have accessed the data before remediation.
