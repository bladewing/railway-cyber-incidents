description_en: >
  Between approximately 2017 and 2020, operatives of Russia's military
  intelligence service (GRU) gained and maintained access to multiple IT
  systems at Georgian Railway (the national railway company of Georgia)
  for a period of more than two years. The railway intrusion was one
  component of a broader multi-year cyber-espionage campaign against
  Georgian targets that also compromised government ministries, the
  Central Election Commission, email accounts, the central bank,
  telecommunications providers, and media organisations including Imedi
  and Maestro. No operational disruption of rail services was publicly
  reported, and the access appears to have been intelligence-collection
  oriented rather than destructive. The intrusion came to wider public
  attention through an October 2024 Stars and Stripes report based on
  Georgian and US government sources.
