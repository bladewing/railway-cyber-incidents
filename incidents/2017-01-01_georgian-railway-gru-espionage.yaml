notes: >
  Rail is a peripheral target within a cross-sector GRU espionage campaign
  against Georgia, but the access is non-trivial: IT-system-level presence
  maintained for more than two years. The Stripes report does not name the
  specific GRU unit responsible for the rail intrusion; the 2020 US DOJ
  indictment of Unit 74455 (Sandworm) covers GRU cyber operations against
  Georgia in 2018-2019 focused on media defacement and wipers, which may
  or may not be the same track as the railway IT access. Attribution is
  therefore kept at the GRU level rather than a specific unit. Exact dates
  within the 2017-2020 window are not public; event_date uses the
  start-of-window placeholder per the dataset's year-precision convention.
  This entry was manually rewritten from the discovery-pipeline draft
  2017-01-01_eurepoc-50fa, which had null target_organization and a
  generic cross-sector description; scope was narrowed to the rail
  component and a second source (the 2020 DOJ indictment of Unit 74455)
  was added for GRU attribution context.
