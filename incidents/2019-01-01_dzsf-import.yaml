notes: >
  The DZSF entry dated 2019-01-01 (month precision, country CN,
  affected_systems [data], supply_chain true, data_published true,
  confirmation confirmed) maps to the 12306.cn / third-party ticket-booking
  platform data-leak incident that broke publicly on 28 December 2018
  (dark-web ad by "deepscorpions"), peaked in international coverage on
  1–2 January 2019, and was closed by the arrest of suspect Chen in
  Beijing's Xicheng District on 29 December 2018. Figures as publicly
  reported: 600,000 12306 account credentials (purchased from unrelated
  prior leaks, i.e. credential-stuffing data) plus 4.1 million additional
  passenger contact records scraped via third-party booking apps — total
  ~4.7 million affected individuals (Beijing cyber-police @首都网警 figure).
  `supply_chain: true` because the 4.1 M record set was obtained from
  third-party ticket-booking platforms (Fliggy, Meituan, Ctrip and others)
  acting as service providers used by 12306 customers, not from 12306
  itself. `attack_vector: credential_theft` captures both the
  credential-stuffing origin of the 600 k 12306 accounts and the
  credential-abuse path into the third-party APIs; matches the sibling
  2014-12-25 12306 incident's classification. `operator_type: incumbent`:
  China Railway Corporation is the national incumbent rail operator.
  `threat_actor: deepscorpions` is the dark-web handle; the real-world
  suspect (Chen, 25, from Xingtai, working in a Beijing tech company) was
  named only by surname in public reporting and was not acting as part of
  a known threat-actor group, so `threat_actor_country: CN` and
  `attribution_confidence: confirmed` (arrest + confession). MITRE
  ATT&CK: `T1110.004` (Credential Stuffing) for the 12306 login stage and
  `T1589.001` (Gather Victim Identity Information: Credentials) for the
  purchase stage — conservative mapping grounded in the confessed modus
  operandi, though no vendor has published a formal ATT&CK write-up.
  `affected_systems: [data, website]`: 12306.cn credentials proved valid
  on the public login (website) and the primary impact was exposure of
  customer data; train operations were unaffected. Impact scope
  `national` because CRC operates the entire Chinese national rail
  network and the breach spanned all passenger segments ahead of the
  Spring-Festival (chunyun) travel rush. No monetary damage figure was
  ever published; dark-web asking price was reportedly around USD 20
  (not used as `monetary_damage_eur`, which measures damage to the
  victim, not sale price). China Railway Corporation publicly denied
  that its own database was compromised; that denial is compatible with
  the confessed modus operandi and with `confirmation_status: confirmed`
  for the overall incident (the leak and criminal detention are
  established facts via Beijing PSB and multiple independent outlets).
