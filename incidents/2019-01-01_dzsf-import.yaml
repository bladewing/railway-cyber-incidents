description_en: >
  On 28 December 2018 a dark-web vendor operating under the handle
  "deepscorpions" advertised a dataset for sale that allegedly contained
  roughly 600,000 12306.cn user accounts (usernames, hashed/plaintext
  passwords, real names, ID card numbers, phone numbers, email addresses
  and security-question answers) together with about 4.1 million associated
  passenger contact records — for a total of around 4.7 million affected
  individuals. China Railway Corporation (operator of 12306.cn) denied on
  its official Weibo that its own database had been breached and
  attributed the exposure to third-party ticketing platforms. On
  29 December 2018 Beijing's Xicheng District Public Security Bureau
  detained a 25-year-old suspect surnamed Chen, an employee of a Beijing
  tech company; the Beijing cyber-police (@首都网警) announced the arrest on
  31 December 2018 and international outlets reported it from 1–2 January
  2019. Chen confessed that he had purchased the 600,000 12306 credentials
  from another online source (credential-stuffing data from unrelated
  leaks) and used them to scrape further passenger data from third-party
  ticket-booking platforms (e.g. Fliggy, Meituan, Ctrip), rather than
  directly hacking 12306. The incident prompted Chinese regulators to
  open a broader probe into third-party travel apps in January 2019.
description_de: >
  Am 28. Dezember 2018 bot ein Darknet-Verkäufer unter dem Pseudonym
  "deepscorpions" einen Datensatz mit mutmaßlich rund 600.000
  12306.cn-Benutzerkonten (Benutzernamen, Passwörter, Klarnamen,
  Ausweisnummern, Telefonnummern, E-Mail-Adressen und Sicherheitsfragen)
  sowie rund 4,1 Millionen zugehörigen Passagier-Kontaktdatensätzen zum
  Kauf an — insgesamt etwa 4,7 Millionen betroffene Personen. Die
  Betreiberin China Railway Corporation (12306.cn) dementierte auf ihrem
  offiziellen Weibo einen direkten Angriff auf ihre eigene Datenbank und
  verwies auf Drittanbieter-Buchungsplattformen. Am 29. Dezember 2018
  nahm die Polizei im Pekinger Bezirk Xicheng einen 25-jährigen
  Verdächtigen mit Familiennamen Chen fest (angestellt in einem Pekinger
  IT-Unternehmen, gebürtig aus Xingtai, Hebei). Die Pekinger Cyberpolizei
  (@首都网警) bestätigte die Festnahme am 31. Dezember 2018; die
  internationale Berichterstattung setzte am 1./2. Januar 2019 ein. Chen
  gestand, die 600.000 12306-Zugangsdaten online gekauft (Credential-
  Stuffing aus anderen Datenlecks) und damit weitere Passagierinformationen
  über Drittanbieter-Buchungsplattformen (u. a. Fliggy, Meituan, Ctrip)
  abgegriffen zu haben — ohne direkten Angriff auf 12306. Der Vorfall
  löste Anfang 2019 eine behördliche Überprüfung chinesischer
  Reise-Buchungs-Apps aus.
