description_en: >
  Between 1 October 2017 and 22 December 2017, an attacker gained
  unauthorised access to a legacy Orbitz travel-booking platform used by
  several partner travel sites, deploying malware that targeted payment
  cards. Orbitz (owned by Expedia) discovered the intrusion on 1 March 2018
  and publicly disclosed it on 20 March 2018; the company estimated that
  roughly 880,000 payment cards worldwide were exposed along with names,
  dates of birth, phone numbers, email addresses, physical and billing
  addresses and gender. In May 2018 Amtrak — the US national passenger
  rail carrier, whose Guest Rewards bookings used Orbitz as a service
  provider — issued its own breach notification informing affected
  customers that their personal and payment data may have been exposed
  through the Orbitz compromise. No threat actor was publicly attributed.
  Orbitz and Expedia later paid a USD 110,000 Pennsylvania Attorney
  General settlement (December 2019) over inadequate data-security
  controls.
description_de: >
  Zwischen dem 1. Oktober 2017 und dem 22. Dezember 2017 verschaffte sich
  ein Angreifer Zugriff auf eine Alt-Plattform des Reiseportals Orbitz,
  die von mehreren Partnerseiten als Buchungs-Engine genutzt wurde, und
  installierte dort Schadsoftware zum Abgreifen von Zahlungsdaten. Orbitz
  (Tochter von Expedia) entdeckte den Vorfall am 1. März 2018 und machte
  ihn am 20. März 2018 öffentlich. Etwa 880.000 Zahlungskarten weltweit
  waren betroffen, zusammen mit Namen, Geburtsdaten, Telefonnummern,
  E-Mail-Adressen, Post- und Rechnungsadressen sowie Geschlecht. Im Mai
  2018 informierte Amtrak — der US-Fernverkehrsbetreiber, dessen Guest-
  Rewards-Buchungen Orbitz als Dienstleister nutzten — seine Kundinnen
  und Kunden über den Drittanbieter-Vorfall. Eine Tätergruppe wurde nicht
  öffentlich benannt; Orbitz/Expedia zahlten im Dezember 2019 einen
  Vergleich in Höhe von 110.000 US-Dollar an den Generalstaatsanwalt von
  Pennsylvania.
