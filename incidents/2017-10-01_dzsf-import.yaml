notes: >
  The DZSF import entry dated 2017-10-01 (month precision, US, affected
  systems website+data) maps to the Orbitz third-party breach whose
  attacker-access window began on exactly 1 October 2017. Amtrak is the
  rail-sector victim: it used Orbitz as a booking/service provider for its
  Guest Rewards programme and issued its own customer notification in May
  2018 after Orbitz's March 2018 disclosure. The 880,000-card figure is
  the Orbitz-wide global count; the Amtrak-specific number of affected
  customers was never publicly disclosed, so `impact.magnitude.
  affected_passengers` is left null. Public reporting describes the
  attacker as deploying "malware" against the legacy Orbitz platform but
  no specific malware family, MITRE Software ID or threat-actor group was
  ever named. Because the compromise happened inside a service provider
  (Orbitz/Expedia) used by Amtrak, this is classified as a supply-chain
  attack (`supply_chain: true`, `attack_vector: supply_chain`),
  correcting the DZSF default of `supply_chain: false`. `operator_type`
  is `public_authority` because Amtrak (National Railroad Passenger
  Corporation) is a federally-chartered quasi-public US corporation with
  majority government ownership — not a private operator and not a
  European-style incumbent. No data was publicly leaked: the attack
  targeted payment-card data for monetisation, not public disclosure.
