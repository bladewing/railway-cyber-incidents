description_en: >
  From approximately 16:45 CET on Tuesday 17 February 2026 into the
  afternoon of 18 February, the public website bahn.de and the
  DB Navigator mobile app — Deutsche Bahn's primary timetable and
  booking channels — were rendered intermittently unreachable by a
  large-scale, multi-wave distributed denial-of-service (DDoS) attack.
  Deutsche Bahn characterised the attack as "targeted" and confirmed
  that safety-relevant rail-operations systems were not affected;
  BSI President Claudia Plattner described the volume as "billions
  of requests per minute" and the attack's bandwidth as "unusually
  severe." DB restored both services progressively, with some
  temporary rate-limits in place, by around 14:00 CET on 18 February.
  Sources inside Deutsche Bahn and German press reporting attributed
  the campaign to the pro-Russian hacktivist collective NoName057(16),
  which ran parallel DDoSia attacks against targets in multiple NATO
  countries during the same period. No customer data was exfiltrated
  and train operations continued normally throughout.
description_de: >
  Ab etwa 16:45 Uhr MEZ am Dienstag, 17. Februar 2026, bis in den
  Nachmittag des 18. Februar waren bahn.de und der DB Navigator —
  die wichtigsten Auskunfts- und Buchungskanäle der Deutschen Bahn —
  durch einen großangelegten, in Wellen erfolgenden DDoS-Angriff
  zeitweise nicht erreichbar. Die Deutsche Bahn bezeichnete den
  Angriff als "gezielt" und bestätigte, dass sicherheitsrelevante
  Bahnbetriebssysteme nicht betroffen waren; BSI-Präsidentin Claudia
  Plattner sprach im WDR-Interview von "Milliarden Anfragen pro
  Minute" und einer "ungewöhnlichen Härte" des Angriffs. Beide Dienste
  wurden bis ca. 14:00 Uhr MEZ am 18. Februar schrittweise
  wiederhergestellt, zunächst mit Ratenbegrenzungen. Deutsche-Bahn-
  interne Quellen und deutsche Presseberichte schrieben die Kampagne
  dem pro-russischen Hacktivistenkollektiv NoName057(16) zu, das
  zeitgleich DDoSia-Angriffe gegen Ziele in mehreren NATO-Staaten
  fuhr. Kundendaten wurden nicht entwendet; der Zugbetrieb lief
  durchgehend normal.

