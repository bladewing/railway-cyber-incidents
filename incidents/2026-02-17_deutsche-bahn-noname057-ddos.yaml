notes: >
  industry_sector=other because Deutsche Bahn AG covers passenger
  (DB Fernverkehr / DB Regio), freight (DB Cargo) and infrastructure
  (DB InfraGO) within the group; the attack hit the shared customer
  front-end (bahn.de, DB Navigator, WLAN portal). attack_vector=
  unknown — DDoS is not enumerated in the vocabulary; MITRE T1498
  (Network DoS) / T1498.001 (Direct Network Flood) captured under
  mitre_attack_techniques. attribution_confidence=reported: internal
  DB sources pointed to NoName057(16) and German press corroborated,
  but DB and BSI have declined to make a formal public attribution
  statement as of April 2026; NoName057(16) did post celebratory
  claims on Telegram during the attack window. duration_hours≈20
  matches the 16:45 CET 2026-02-17 → ~14:00 CET 2026-02-18 window
  described by BSI/DB. Part of the same pro-Russian DDoSia
  hacktivist campaign previously affecting ÖBB (2022-12-16) and SBB
  (2023-06-12), both separately catalogued.
