description_en: >
  On or around 1 April 2025, a distributed denial-of-service attack
  targeted the website and mobile application of Russian Railways
  (RZD / РЖД), the Russian state-owned incumbent railway operator.
  The attack disrupted online ticket purchasing and digital
  passenger-facing services; rail operations and train schedules
  were not affected. The incident was widely interpreted in Russian
  and international reporting as a retaliatory action following the
  23 March 2025 cyberattack on Ukraine's state railway Ukrzaliznytsia,
  though no specific threat actor claimed responsibility publicly.
