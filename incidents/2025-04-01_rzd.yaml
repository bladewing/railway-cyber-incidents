notes: >
  Tit-for-tat pattern: closely follows (and is widely reported as
  retaliation for) the 23 March 2025 Ukrzaliznytsia attack, with the
  direction reversed. Attribution to a pro-Ukraine hacktivist actor is
  inferred from context rather than formally claimed. Single reputable
  English-language source at the time of enrichment.
