description_en: >
  On 9 July 2025, the public-facing website of S-Bahn Hannover,
  operated by Transdev Hannover GmbH in the Hannover region of Lower
  Saxony, Germany, was rendered unavailable by a cyberattack. No
  operational impact on train services was reported; onboard and
  platform passenger information continued through other channels.
  No threat actor claimed responsibility publicly. A second cyber
  incident affecting the same website occurred on 24 July 2025
  (tracked as a separate entry).
