notes: >
  The specific pro-Russian group was not named in public reporting.
  Estonia was a frequent target of pro-Russian DDoS activity in 2022-
  2023 in retaliation for its support of Ukraine; NoName057(16) and
  Killnet are the most likely candidates by pattern-matching, though
  no formal attribution was made. Elron is majority-owned by the
  Estonian state, classified here as incumbent.
