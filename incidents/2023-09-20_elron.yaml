description_en: >
  On 20 September 2023, Elron - the Estonian state-owned passenger
  rail operator - was targeted by a distributed denial-of-service
  attack that disrupted its public-facing website. A suspected
  pro-Russian hacktivist group was identified by the Estonian
  Information System Authority (RIA) as the likely perpetrator, which
  stated publicly that similar incidents were likely to recur. Rail
  operations and ticket-vending machines at stations were not
  affected by the incident.
