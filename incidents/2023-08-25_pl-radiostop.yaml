notes: >
  Dieser Vorfall ist der empirische Bruchfall für These B des
  Safety-Meets-Security-Vortrags 2026: erste direkt ausgelöste Safety-Funktion
  durch einen nicht-autorisierten externen Eingriff in ein nationales Bahnnetz.

  Vokabular-Abweichungen: (1) attack_vector=physical ist der nächstbeste Wert
  für einen RF-Angriff — der Einsatz von SDR-Hardware erfordert physische Nähe
  zur Übertragungsstrecke und physisches Equipment; radio_frequency existiert
  nicht im Vokabular. (2) affected_systems: train_driver_communication deckt
  den 150-MHz-VHF-Zugfunk ab; rail_operations erfasst die dadurch ausgelöste
  Nothalt-Funktion. Eine dedizierte ID train_radio fehlt im Vokabular.
  (3) industry_sector=other, da sowohl Fernverkehr (PKP Intercity) als auch
  Regionalverkehr betroffen waren — kein einzelner Sektor trifft zu.
  (4) motive=mixed: die Täter kombinierten ideologische Propaganda (russische
  Hymne, Putin-Rede) mit operativer Disruption; einer der Verdächtigen soll
  außerdem aus persönlicher Amüsement gehandelt haben ("joking around"
  laut Niebezpiecznik.pl). Polnische Sonderdienste (Zaryn) ordneten dies
  öffentlich der Unterstützung Russlands zu.

  PKP PLK klassifizierte den Vorfall offiziell NICHT als Cyberangriff, da kein
  Computersystem kompromittiert wurde — die Gefährdung resultierte aus der
  physischen Sendung eines ungesicherten analogen Funksignals. In der
  wissenschaftlichen und medialen Aufarbeitung wird der Vorfall dennoch als
  sicherheitsrelevanter Cybervorfall eingestuft (fehlende Authentifizierung,
  keine Verschlüsselung, SDR-basierter Angriff).

  In 2023 wurden insgesamt 775 Fälle unautorisierten RADIOSTOP-Gebrauchs
  registriert (Rynek Kolejowy, 2024) — der Augustvorfall ist der prominenteste
  dieser Serie und der einzige mit bestätigten Verhaftungen und
  politisch-propagandistischem Kontext.
