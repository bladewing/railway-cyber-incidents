description_en: >
  Starting on the evening of 25 August 2023, two Polish individuals used cheap
  software-defined radio (SDR) equipment (cost ~$30–100) to broadcast the
  unauthenticated three-tone RADIOSTOP emergency-stop signal on Poland's
  legacy unencrypted 150.100 MHz VHF train radio, halting approximately 20
  freight and passenger trains across multiple regions (Zachodniopomorskie,
  Białystok, Gdynia, Wrocław). The same broadcasts interleaved Russian national
  anthem recordings and excerpts of a Putin speech. Two suspects (aged 24 and
  29), one a serving Białystok police officer, were arrested on 27–29 August
  2023. Polish special services attributed the action to alleged support for
  Russia in the context of the ongoing war in Ukraine. This is the first
  publicly documented case where an unauthorized external radio signal directly
  and intentionally triggered a railway safety function (emergency stop) on a
  national scale.
description_de: >
  Ab dem Abend des 25. August 2023 sendeten zwei polnische Personen mit
  günstigem SDR-Equipment (ca. 30–100 USD) das unauthentifizierte
  RADIOSTOP-Drei-Ton-Signal über das unverschlüsselte analoge 150,100-MHz-VHF-
  Zugfunknetz, was rund 20 Güter- und Personenzüge in mehreren Regionen
  (Zachodniopomorskie, Białystok, Gdynia, Wrocław) zum Halten zwang. Parallel
  wurden Aufnahmen der russischen Nationalhymne und Ausschnitte einer
  Putin-Rede übertragen. Zwei Tatverdächtige (24 und 29 Jahre), einer davon
  ein aktiver Polizeibeamter aus Białystok, wurden am 27.–29. August 2023
  verhaftet. Polnische Sicherheitsbehörden ordneten die Aktion mutmaßlicher
  Unterstützung Russlands im Kontext des Ukraine-Krieges zu. Es ist der erste
  öffentlich dokumentierte Fall, bei dem ein unautorisiertes externes
  Funksignal absichtlich eine Sicherheitsfunktion (Nothalt) eines nationalen
  Bahnsystems auf nationaler Ebene ausgelöst hat.

