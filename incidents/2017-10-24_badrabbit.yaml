notes: >
  Maintainer-corrected date (2026-04-19). The original DZSF raw-data row
  placed this BadRabbit railway incident on 2021-10-24. In the April 2026
  enrichment pass the subagent verified that no vendor advisory, CERT
  bulletin, academic paper or press report documents any BadRabbit
  activity on 2021-10-24; every credible source (Kaspersky Securelist,
  ESET WeLiveSecurity, Cisco Talos, Trend Micro, Check Point, Fortinet,
  the UK NCSC 2018 attribution, the CFR Cyber Operations Tracker, MITRE
  ATT&CK S0606) dates the one and only BadRabbit / Win32/Diskcoder.D
  outbreak to 2017-10-24 — exactly four years earlier to the day. The
  escalation recommended correcting the date to 2017-10-24; per
  maintainer decision dated 2026-04-19 the record has been re-dated
  accordingly. The filename stem was changed from
  `2021-10-24_badrabbit` to `2017-10-24_badrabbit`, the `id` and
  `event_date` fields were updated, and the full 2017 BadRabbit
  narrative (Kyiv Metro fare-payment network, Odesa International
  Airport, Ukrainian Ministry of Infrastructure, Sandworm/GRU
  attribution, MITRE technique mapping) was adopted into the draft —
  the 2017 campaign is multiply corroborated by ≥ 6 independent
  non-DZSF sources (Kaspersky, ESET, Check Point, CFR, SecurityWeek /
  UK-NCSC attribution, MITRE) and comfortably clears the ≥ 2
  independent-source threshold.
  Field choices. industry_sector set `urban_transit` (Kyiv Metro is
  the canonical urban transit operator anchoring this record).
  operator_type `public_authority` (Kyiv Metro is a municipal utility
  of the Kyiv City State Administration). attack_vector set `exploit`
  to capture the EternalRomance SMB exploit used for lateral movement
  after the drive-by-download initial access; the vocabulary does not
  have a dedicated "drive-by-download" value, so `exploit` is the
  closest fit and the detail is recorded in description_en. motive
  `state_geopolitical` (Sandworm / GRU operations against Ukrainian
  infrastructure are classic state-directed geopolitical
  cyber-operations, not financially motivated, despite the ransomware
  disguise; the UK NCSC 2018 attribution explicitly frames BadRabbit
  as GRU activity). extortion retained `true` (the ransomware did
  display a ransom note; whether any victim paid is not publicly
  documented). affected_systems expanded from the DZSF stub
  [payment_system] to [payment_system, station_it,
  passenger_information] to reflect that Kyiv Metro's turnstiles and
  contactless-payment readers (station_it + payment_system) were
  disabled and real-time passenger-facing systems went offline.
  Provenance preserved (DZSF-2020-23-S-1202 / Rohdaten XLSX origin)
  so the re-dated record remains traceable to the original stub.
