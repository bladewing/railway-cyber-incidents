description_en: >
  On 24 October 2017 the BadRabbit ransomware (also known as
  Win32/Diskcoder.D; a Petya-lineage wiper-style ransomware) disrupted
  the contactless fare-payment and station-IT systems of Kyiv Metro,
  Ukraine's capital-city metro network, as part of a wider outbreak
  that also struck Odesa (Odessa) International Airport, the Ukrainian
  Ministry of Infrastructure, Russia's Interfax news agency, the
  Fontanka news site, and further targets in Turkey, Bulgaria, Germany
  and Japan. The initial-access vector was a drive-by-download via
  compromised legitimate Ukrainian and Russian news sites that
  redirected visitors to a fake Adobe Flash Player update
  (install_flash_player.exe) — a watering-hole operation pre-positioned
  on the compromised sites for months per ESET. Once executed with
  admin privileges the malware encrypted files with AES-128 (keys
  wrapped by an RSA-2048 attacker key), modified the Master Boot
  Record to display a ransom note on reboot, and used hardcoded
  credentials plus an EternalRomance SMB exploit for lateral spread
  inside networks. Kyiv Metro's turnstile / contactless-payment
  systems were rendered unusable and passengers were advised to use
  cash; the metro reported no disruption to train operations. Odesa
  airport operated manually and delayed some flights. The UK NCSC,
  with US/AU/CA/NZ partners, formally attributed BadRabbit to the
  Russian GRU (Sandworm Team, Unit 74455) on 3 October 2018 as part
  of a broader public attribution of GRU cyber-operations. Per
  maintainer decision 2026-04-19 the original DZSF raw-data row
  carrying this incident as "2021-10-24" is treated as a year typo
  (2017 → 2021) and the record has been re-dated to the canonical
  2017-10-24 (see ESCALATIONS.md).
description_de: >
  Am 24. Oktober 2017 störte die Ransomware BadRabbit (auch
  Win32/Diskcoder.D; ein wiper-artiger Ransomware-Nachfahre der
  Petya-Familie) das kontaktlose Fahrkarten- und Drehkreuz-Bezahlsystem
  der Kyiv Metro, des U-Bahn-Netzes der ukrainischen Hauptstadt Kyjiw
  (Kiew), im Rahmen eines breiteren Angriffs, der zugleich den Flughafen
  Odesa (Odessa), das ukrainische Infrastrukturministerium, die
  russische Nachrichtenagentur Interfax, das Nachrichtenportal Fontanka
  sowie Ziele in der Türkei, Bulgarien, Deutschland und Japan traf. Der
  initiale Zugriffsweg war ein Drive-by-Download über kompromittierte
  legitime ukrainische und russische Nachrichtenseiten, die Besucher auf
  ein gefälschtes Adobe-Flash-Update (install_flash_player.exe)
  umleiteten — eine Watering-Hole-Operation, die laut ESET über Monate
  vorbereitet worden war. Nach Ausführung mit Admin-Rechten
  verschlüsselte die Schadsoftware Dateien mit AES-128 (Schlüssel mit
  einem RSA-2048-Angreiferschlüssel verpackt), modifizierte den Master
  Boot Record zur Anzeige einer Lösegeldforderung beim Neustart und
  nutzte fest kodierte Zugangsdaten sowie den EternalRomance-SMB-Exploit
  zur lateralen Ausbreitung im Netzwerk. Die Drehkreuz- und Bezahlsysteme
  der Kyiv Metro wurden funktionsuntüchtig; Fahrgäste wurden aufgefordert,
  bar zu bezahlen. Der Bahnbetrieb selbst war nicht beeinträchtigt. Der
  Flughafen Odesa arbeitete manuell weiter, einige Flüge verzögerten
  sich. Das britische NCSC schrieb BadRabbit am 3. Oktober 2018 gemeinsam
  mit den Partnern USA, Australien, Kanada und Neuseeland öffentlich dem
  russischen Militärnachrichtendienst GRU (Sandworm Team, Einheit 74455)
  zu. Per Maintainer-Entscheidung vom 19. April 2026 wird der
  ursprüngliche DZSF-Rohdateneintrag mit Datum „2021-10-24" als
  Jahres-Tippfehler (2017 → 2021) gewertet und auf das kanonische Datum
  2017-10-24 korrigiert (siehe ESCALATIONS.md).
