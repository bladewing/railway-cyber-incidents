description_en: >
  On 23 March 2025, Ukrzaliznytsia - the Ukrainian state-owned railway
  operator and the country's largest cargo carrier - was targeted by a
  large-scale cyberattack that disrupted its online ticket-purchasing
  system and mobile application. Ukrzaliznytsia described the attack
  as "systematic, complex, and multi-layered." The central railway
  station in Kyiv experienced unusually large queues on the morning
  after the attack began, as passengers were forced to buy tickets at
  physical counters. Train schedules and rail operations themselves
  were not affected, and the operator stated that no confidential
  passenger data had been exfiltrated. Technical specialists worked
  continuously for 89 hours to restore the affected website and
  application. On 1 April 2025, Yevheniia Nakonechna, a senior
  Ukrainian cybersecurity official, attributed the attack to tactics,
  techniques, and procedures typical of Russian intelligence services
  and characterised the operation as an "act of terrorism". A retaliatory DDoS
  attack on the Moscow Metro website was reported shortly afterwards.
