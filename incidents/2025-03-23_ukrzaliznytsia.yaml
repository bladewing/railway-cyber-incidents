notes: >
  One of the most significant incidents against European rail in 2025.
  Attribution to Russia is made on the basis of TTP analysis by
  Ukrainian cybersecurity authorities; no specific GRU or FSB unit
  (Sandworm / APT28 / Gamaredon / Turla / etc.) has been named
  publicly. Impact scope classified as "widespread" because
  nationwide online ticketing was unavailable during a 89-hour
  recovery window; however, physical rail operations and train
  schedules continued. Replaced the original discovery-pipeline
  single-source t.me link with four reputable reporting sources.
