notes: >
  metronom, erixx, erixx Holstein, and enno are co-managed regional
  passenger rail operators in Lower Saxony and Schleswig-Holstein; they
  share digital infrastructure and were therefore all taken offline
  simultaneously by the DDoS attack. Treated as a single incident here
  because the target infrastructure is shared. The attacker remains
  unidentified; the January 2025 period saw increased pro-Russian
  hacktivist DDoS activity against German targets, but no group
  claimed this specific operation. Renamed from the original
  discovery-pipeline draft slug "2025-01_metronom" (which lacked a
  day component) once the exact start date (2025-01-27) was
  corroborated via reporting.
