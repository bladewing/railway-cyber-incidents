description_en: >
  At approximately 16:45 local time on Monday 27 January 2025, a
  distributed denial-of-service attack - reported to have used a
  botnet - rendered the websites and digital passenger-information
  services of metronom Eisenbahngesellschaft mbH, together with its
  affiliated regional operators erixx, erixx Holstein, and enno,
  unavailable. The outage lasted approximately three days; public
  access to timetables, delay and cancellation information, alternative
  connection searches, lost-and-found services, and contact forms was
  interrupted during this period. Train operations and onboard
  services were not affected. Normal web and digital services were
  restored on Friday 31 January 2025. No threat actor claimed
  responsibility publicly.
