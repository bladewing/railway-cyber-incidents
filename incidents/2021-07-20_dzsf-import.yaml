notes: >
  Identification. The DZSF raw-data row (event 2021-07-20, country GB,
  confirmation_status=confirmed, affected_systems=[payment_system],
  all other core fields null / unknown / default) maps unambiguously
  onto the ransomware attack against Northern Trains' Flowbird-operated
  self-service ticket-vending-machine (TVM) estate publicly disclosed
  on 19-20 July 2021 via the BBC and picked up by The Register, Railway
  Technology, PYMNTS, City AM, ITPro, Computing and SecurityWeek. No
  other UK railway cyber incident is publicly attested for 20 July 2021.
  The 18 April 2021 Merseyrail LockBit incident (already enriched as
  `2021-04-18_lockbit.yaml`) is a distinct event three months earlier,
  targets a different operator (Merseyrail vs Northern Trains), uses
  different affected_systems (internal_communication + data vs
  payment_system), and has explicit attacker self-branding (LockBit);
  this DZSF stub is clearly NOT the Merseyrail case. The 9 July 2021
  Iranian Railways "Meteor" wiper and the 22 July 2021 South African
  Transnet "Death Kitty" ransomware are also distinct events
  (different countries: IR and ZA respectively) already present in
  the repo; no duplication.

  Dates. event_date = 2021-07-20 kept as-is from the DZSF row — the
  day the ransomware incident became publicly known via the BBC (with
  The Register, Railway Technology and multiple other outlets all
  publishing on 20 July 2021). reported_date set to 2021-07-20
  (same day). The actual attack onset is attested as "last week"
  relative to 20 July (i.e. some time between 12-19 July 2021)
  according to multiple outlets, but no source pins down the exact
  initial-intrusion or encryption-detonation date; the publicly
  documented event date is therefore 2021-07-20 and the internal
  onset date is left implicit.

  target_organization. Northern Trains Limited — the train-operating
  company (TOC) for the Northern rail franchise, incorporated in
  England and headquartered in York. Since 1 March 2020 it has been
  owned by DfT Operator Ltd (formerly DfT OLR Holdings), the UK
  Department for Transport's "operator of last resort" vehicle, after
  Arriva Rail North's franchise was terminated. The attack surface
  was the Flowbird-operated TVM server cluster, meaning the attack is
  a supplier-compromise / supply-chain incident against Northern via
  its TVM vendor Flowbird Transport Intelligence (a French payments
  & ticketing firm headquartered in the 15th arrondissement of Paris,
  formed in 2018 by the merger of Parkeon and Cale; acquired by
  EasyPark Group in January 2025).

  industry_sector = `regional_passenger`. Northern Trains runs
  regional and commuter passenger services across the North of
  England with some inter-regional flows into the East and West
  Midlands; it is classified as a regional franchise rather than a
  long-distance passenger operation (TransPennine Express, LNER,
  Avanti West Coast are the long-distance operators in that
  geography) or an urban-transit metro (Merseyrail, Tyne & Wear
  Metro are the urban-transit comparators). `regional_passenger` is
  the closest match in the schema enumeration.

  operator_type = `public_authority`. Northern Trains Limited is
  owned by DfT Operator Ltd on behalf of the UK Secretary of State
  for Transport — i.e. a publicly-owned, state-run train operator
  since March 2020. This is distinct from `incumbent` (which in
  the repo's usage maps to national legacy state incumbents such
  as DB, SNCF, Amtrak, RZD) and from `private` (which would apply
  if Arriva Rail North still held the franchise). `public_authority`
  is the best match for the "operator of last resort" status.

  attack_vector = `unknown`. Northern publicly described the
  incident as a "supply chain" issue routed through Flowbird
  (explicit in multiple outlets). However, no public source names
  the initial-access technique against Flowbird: no phishing lure,
  exploited CVE, brute-forced RDP endpoint, compromised credential
  or software-update trojanisation is documented. The draft keeps
  `attack_vector: unknown` to avoid invention, while flipping
  `supply_chain: true` to record the supplier-routing aspect that
  is documented.

  supply_chain = `true` (corrected from DZSF default of `false`).
  The ransomware hit the Flowbird-operated TVM server cluster
  (Flowbird's own infrastructure operated on Northern's behalf),
  not Northern's own IT; both organisations explicitly described
  the incident as affecting the "servers which operate the ticket
  machines" and as a supplier-side issue. This maps cleanly to the
  schema's `supply_chain: true` semantics.

  malware = [{name: "Unidentified ransomware"}]. Neither Northern
  Trains nor Flowbird publicly named a variant. Cybersecurity
  Insiders (Naveen Goud, 2021-07-22) and aggregator sites echoing
  that piece speculated REvil / Sodinokibi, but mainstream trade
  coverage (The Register, Computer Weekly, ITPro, Railway
  Technology, City AM, PYMNTS, Computing, SecurityWeek) does not
  name a family, and the timing coincides with REvil's 13 July
  2021 post-Kaseya infrastructure blackout — so the REvil
  attribution is unreliable. The draft therefore records a single
  malware entry with `name: "Unidentified ransomware"` (to preserve
  the confirmed ransomware nature) and leaves both `family` and
  `mitre_software_id` null. This approach matches the repo's
  "prefer null over invention" rule; REvil is noted as a reported-
  but-unconfirmed attribution in the description rather than
  encoded structurally.

  extortion = true (ransomware message demanded cryptocurrency for
  a decryption key — attested by Cybersecurity Insiders and Pride
  Solutions). motive = `financial` (standard commodity-ransomware
  monetisation; SecurityWeek's Kevin Townsend explicitly called
  this a "spray and pray" financial-crime attack with zero chance
  of ransom payment from a UK public-sector target).
  data_published = false (no leak-site listing by any ransomware
  gang is on the public record).
  data_compromise.* = false across the board — both Northern and
  Flowbird explicitly stated that no customer data, payment data
  or personal data was compromised; no evidence has emerged since
  to contradict this.

  mitre_attack_techniques = [T1486]. Only T1486 "Data Encrypted
  for Impact" is publicly documented (the TVM server filesystems
  were encrypted and a ransom message was displayed). Additional
  REvil-generic techniques (T1078 Valid Accounts, T1133 External
  Remote Services, T1190 Exploit Public-Facing Application,
  T1490 Inhibit System Recovery, T1566 Phishing, T1583.003 VPS) are
  deliberately not asserted — no Northern-specific public source
  pins them to this intrusion, and the draft conforms to the
  "prefer null over invention" rule.

  threat_actor / threat_actor_country = null. No attacker
  self-branding appeared (unlike the Merseyrail LockBit case three
  months earlier, where the attacker mass-mailed journalists and
  staff with a "Lockbit Ransomware Attack and Data Theft" subject
  line). No gang publicly claimed the attack; no leak-site listing
  appeared. attribution_confidence = `unknown` (null is not in
  the enum — `unknown` is the closest valid value).

  affected_systems = [payment_system] kept as DZSF had it. TVMs
  are ticket-vending / payment machines; the repo's schema maps
  them to `payment_system`. No other system was affected
  (signalling, station IT displays, the public website,
  internal_communication, passenger_information systems,
  rail_operations — all explicitly stated to be untouched by
  Northern's public statements and by every trade-press source).

  confirmation_status = `confirmed` (unchanged): Northern Trains
  and Flowbird both publicly confirmed the incident via on-the-
  record spokespersons to The Register, BBC and multiple other
  outlets.

  impact.scope = `regional`: Northern's franchise footprint covers
  North East England, North West England and Yorkshire & Humber —
  a large but sub-national UK regional footprint. Not `national`
  because the attack did not affect other UK operators, Network
  Rail, or the national ticket-reservations system. Not `local`
  because 420 stations across multiple counties is well beyond a
  single locality. duration_hours left null — the qualitative
  phrasing "about a week" / "several days" appears in multiple
  sources but no source gives a numeric downtime figure.
  affected_trains = 0 (train services were explicitly stated to be
  running normally — only the TVM estate was offline).
  affected_passengers left null (no source quantifies how many
  journeys were delayed or disrupted by the need to queue at
  staffed ticket offices instead of using the TVMs). monetary_
  damage_eur null (no public loss figure).

  German-language press coverage. Searches on heise.de, golem.de,
  tagesschau.de, süddeutsche.de and the Tarnkappe IT-security
  archive returned no dedicated German-language article on the
  Northern Trains / Flowbird July 2021 ransomware incident; only
  the DZSF Rohdaten row itself anchors the case in the German-
  language academic record. The DZSF 2023 EI/Eurailpress summary
  article "Cyberangriffe auf das Bahnsystem — Was bisher geschah"
  (EI 8/2023) does not mention this incident per se. Noted as a
  coverage gap rather than a substantive discrepancy.

  No CERT / NCSC / ORR advisory specific to the Northern Trains
  incident was published. The UK Information Commissioner's
  Office (ICO) did not publicly confirm a notification for this
  incident (contrast with the April 2021 Merseyrail case where
  the ICO publicly acknowledged receipt). No court / enforcement
  action is in the 2021-2026 public record.
