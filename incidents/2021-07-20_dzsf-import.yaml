description_en: >
  On or around 20 July 2021 the self-service ticket vending machines
  (TVMs) operated for Northern Trains by supplier Flowbird Transport
  Intelligence were taken offline following a ransomware cyber-attack
  against the servers that run the TVM estate. Northern had completed a
  £17 million modernisation scheme with Flowbird in May 2021, installing
  621 new touch-screen TVMs at approximately 420 stations across North
  East England, North West England, Yorkshire and the Humber. Flowbird
  identified the incident via its own cyber-monitoring systems and
  instigated its major-incident procedure, taking the TVM network
  offline as a precautionary measure; the machines remained unavailable
  for roughly one week. Northern Trains, a publicly-owned operator run
  by DfT Operator (the UK government's "operator of last resort") since
  March 2020, stated publicly that "the ticket machine service has been
  subject to a ransomware cyber attack" and that only the TVM-operating
  servers were affected; customer and payment data were not compromised.
  Passengers were redirected to the Northern Trains website and mobile
  app, to staffed ticket offices, and were told to board their trains
  and pay the conductor or destination-station staff using "promise to
  pay" arrangements where necessary. Train services, signalling and
  safety-critical systems were unaffected. No specific ransomware
  variant was publicly named by either organisation; Cybersecurity
  Insiders (Naveen Goud, 2021-07-22) reported that REvil / Sodinokibi
  was suspected, but this attribution was not corroborated by
  mainstream coverage (The Register, Computer Weekly, ITPro, Railway
  Technology, City AM, PYMNTS) and coincides with REvil's July-2021
  post-Kaseya infrastructure blackout — so the draft records the malware
  as "Unidentified ransomware" and `attribution_confidence: unknown`.
  The attack vector is unconfirmed: Northern publicly framed the
  incident as a "supply chain" issue routed through Flowbird, consistent
  with the fact that the targeted servers and machines were supplier-
  operated; `supply_chain: true` is therefore asserted but
  `attack_vector` is left `unknown` because no source pins down the
  initial-access technique (phishing, exploit, brute-force RDP against
  Flowbird, etc.).
description_de: >
  Am 20. Juli 2021 wurden die vom Zulieferer Flowbird Transport
  Intelligence für Northern Trains betriebenen Fahrkartenautomaten
  (Ticket Vending Machines, TVM) nach einem Ransomware-Angriff auf die
  TVM-Serverinfrastruktur vom Netz genommen. Northern Trains hatte im
  Mai 2021 ein Modernisierungsprogramm im Wert von 17 Mio. £
  abgeschlossen, in dessen Rahmen Flowbird 621 neue Touchscreen-
  Automaten an rund 420 Bahnhöfen in Nordostengland, Nordwestengland,
  Yorkshire and the Humber (sowie in Teilen der East und West Midlands)
  installiert hatte. Flowbird erkannte den Vorfall über seine eigenen
  Cyber-Monitoring-Systeme und löste sein Major-Incident-Verfahren aus;
  die TVM-Flotte blieb rund eine Woche lang offline. Northern Trains —
  seit März 2020 ein staatlich kontrolliertes Eisenbahnverkehrsunternehmen
  (DfT Operator / "operator of last resort" des britischen
  Verkehrsministeriums) — erklärte öffentlich, dass der Ticket-
  Automaten-Dienst „Gegenstand eines Ransomware-Cyberangriffs" gewesen
  sei, dass ausschließlich die TVM-Server betroffen gewesen seien und
  dass weder Kunden- noch Zahlungsdaten kompromittiert worden seien.
  Fahrgäste wurden auf die Northern-Website und -App, auf bediente
  Fahrkartenschalter sowie auf das „Promise-to-Pay"-Verfahren
  verwiesen. Zugbetrieb, Signalisierung und sicherheitsrelevante
  Systeme waren nicht betroffen. Keine der beiden Organisationen nannte
  eine konkrete Ransomware-Familie; Cybersecurity Insiders (Naveen Goud,
  22. Juli 2021) spekulierte über REvil / Sodinokibi als Urheber, diese
  Zuordnung wurde jedoch von keiner Leitmedien-Quelle (The Register,
  Computer Weekly, ITPro, Railway Technology, City AM, PYMNTS) bestätigt
  und fällt zudem in den Zeitraum, in dem die REvil-Infrastruktur nach
  dem Kaseya-Angriff offline war. Der Entwurf führt die Schadsoftware
  daher als „Unidentified ransomware" und `attribution_confidence:
  unknown`. Der Angriffsvektor ist unbestätigt: Northern rahmte den
  Vorfall öffentlich als „supply-chain"-Problem über Flowbird ein, was
  zu der Tatsache passt, dass die betroffenen Server und Geräte vom
  Zulieferer betrieben wurden; `supply_chain: true` wird daher gesetzt,
  `attack_vector` bleibt jedoch `unknown`, weil keine Quelle die
  Erstzugriffstechnik präzisiert.
