description_en: >
  On 29 October 2022 (Saturday morning), a ransomware-type attack on Supeo,
  a Danish IT supplier to DSB (Danske Statsbaner), forced Supeo to shut down
  its servers. The 'Digital Backpack 2' (Digitale Rygsæk 2) application used
  by train drivers to access safety-critical operational information—including
  speed limits and track-work notifications—became unavailable, halting all
  DSB train operations across Denmark for several hours. DSB's security chief
  Carsten Dam Sønderbo-Jacobsen described the attack as "economic crime" not
  targeting DSB infrastructure directly. An emergency offline-access procedure failed due to a software
  defect, extending the disruption. No attribution to a named threat actor was
  established.
description_de: >
  Am 29. Oktober 2022 (Samstagmorgen) zwang ein Ransomware-artiger Angriff
  auf den IT-Dienstleister Supeo zur Abschaltung seiner Server. Die von
  Zugpersonal verwendete Applikation 'Digital Backpack 2' (Digitale Rygsæk 2)
  war nicht mehr erreichbar, wodurch der DSB-Zugverkehr in ganz Dänemark
  mehrere Stunden lang stillstand. Eine Notfall-Offline-Prozedur versagte
  aufgrund eines Softwarefehlers. DSB-Sicherheitschef Carsten Dam
  Sønderbo-Jacobsen bezeichnete den Angriff als 'wirtschaftliche
  Kriminalität', der nicht auf DSB-Infrastruktur abzielte.

