notes: >
  First documented case of a ransomware attack on a railway supplier causing
  a complete national train standstill without the railway operator itself
  being compromised. DSB security chief Carsten Dam Sønderbo-Jacobsen told
  DR and Reuters that Supeo's testing environment had been infiltrated by
  criminals with a financial motive (suspected bitcoin mining / ransomware).
  The backup offline-access procedure for 'Digital Backpack 2' was rendered
  ineffective by a pre-existing software defect, compounding the disruption.
  No named threat actor claimed responsibility; motive described as economic
  crime. The incident triggered a review of Danish railway emergency procedures.
  extortion is set to false because public sources confirm financial motive
  (suspected ransomware / cryptominer) but no ransom demand or extortion
  component was publicly confirmed.
