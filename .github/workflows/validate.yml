name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Schema + cross-file validation
        run: uv run python scripts/validate.py
      - name: Tests
        run: uv run pytest -v
      - name: Build release (smoke)
        run: uv run python scripts/build_release.py
      - name: Frictionless validate
        run: uv run frictionless validate dist/datapackage.json
