name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Schema + cross-file validation
        run: python scripts/validate.py
      - name: Tests
        run: pytest -v
      - name: Build release (smoke)
        run: python scripts/build_release.py
      - name: Frictionless validate
        run: frictionless validate dist/datapackage.json
