name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python scripts/validate.py
      - run: uv run python scripts/build_release.py
      - name: Package dist
        run: |
          cd dist
          zip -r "../railway-cyber-incidents-${GITHUB_REF_NAME}.zip" .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: railway-cyber-incidents-${{ github.ref_name }}.zip
          generate_release_notes: true
