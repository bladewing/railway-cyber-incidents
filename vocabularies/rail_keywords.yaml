# Rail-adjacency keywords used by discovery adapters to filter broad
# aggregator feeds. Not a controlled enum — purely a filter list.
# Case-insensitive match; adapters do whole-word matching with an
# optional trailing ``s`` (so plurals like ``railways`` match).
# German compounds must be listed explicitly — whole-word matching
# cannot decompose ``Straßenbahn`` into ``bahn``.
keywords:
  - rail
  - railway
  - railroad
  - train
  - metro
  - subway
  - tram
  - transit
  - bahn
  # German compounds (deliberately excludes ``Autobahn`` — that's a
  # road, not rail):
  - Eisenbahn
  - Straßenbahn
  - S-Bahn
  - U-Bahn
  - Stadtbahn
  - Regionalbahn
  # Operators (add as discovered):
  - "Deutsche Bahn"
  - DB Schenker
  - SNCF
  - Trenitalia
  - ÖBB
  - NS
  - Amtrak
  - ProRail
  - Network Rail
  - Renfe
  - JR East
  - CFL
  - CD Cargo
